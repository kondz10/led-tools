<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f12;
    --surface: #13161b;
    --surface2:#191c23;
    --border:  #252838;
    --accent:  #8b15ba;
    --text:    #c4cad8;
    --muted:   #4e5668;
    --radius:  7px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }

  /* ── TOPBAR ── */
  .topbar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    user-select: none;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; margin-right: 6px;
  }
  .logo span { color: var(--accent); }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  .mode-btns { display: flex; gap: 3px; }
  .mode-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 5px; border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .mode-btn:hover { color: var(--text); border-color: #3a3d52; background: rgba(255,255,255,0.03); }
  .mode-btn.active { background: rgba(139,21,186,0.12); border-color: rgba(139,21,186,0.4); color: #c06ae0; }

  .hint {
    margin-left: auto;
    font-size: 10px; color: var(--muted);
    font-family: 'Space Mono', monospace; letter-spacing: 0.04em;
    opacity: 0; transition: opacity 0.3s;
  }
  .hint.visible { opacity: 1; }

  /* ── WORKSPACE ── */
  #workspace {
    position: relative;
    width: 100%; height: calc(100vh - 48px);
    overflow: hidden; background: var(--bg);
  }
  #workspace::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0; transition: opacity 0.25s; z-index: 0;
  }
  #workspace.drag-active::before { opacity: 1; }

  /* ── WINDOW ── */
  .win {
    position: absolute;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    overflow: hidden; min-width: 260px; min-height: 180px;
    transition: box-shadow 0.15s; z-index: 10;
  }
  .win.dragging {
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(139,21,186,0.35);
    z-index: 100; cursor: grabbing;
  }
  .win.resizing { z-index: 100; }
  .win.closed { display: none !important; }

  .win-bar {
    height: 36px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 10px 0 12px; gap: 8px;
    flex-shrink: 0; cursor: grab; user-select: none;
  }
  .win-bar:active { cursor: grabbing; }
  .win-badge {
    font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700;
    letter-spacing: 0.12em; background: var(--accent); color: #fff;
    border-radius: 3px; padding: 2px 5px; flex-shrink: 0;
  }
  .win-title { font-size: 12px; color: var(--text); font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-btns { display: flex; gap: 5px; flex-shrink: 0; }
  .win-btn {
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 11px; transition: all 0.12s; line-height: 1;
  }
  .win-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .win-btn.close:hover { background: rgba(232,91,91,0.18); color: #e85b5b; border-color: rgba(232,91,91,0.3); }
  .win-btn.max-btn { font-size: 13px; }

  .win-body { flex: 1; min-height: 0; position: relative; }
  .win-body iframe { width: 100%; height: 100%; border: none; display: block; background: #0d0f12; }
  .win-body::after {
    content: ''; position: absolute; inset: 0; display: none; z-index: 200;
  }
  .dragging .win-body::after,
  .resizing .win-body::after { display: block; }

  .win-resize {
    position: absolute; right: 0; bottom: 0;
    width: 18px; height: 18px; cursor: se-resize; z-index: 10;
  }
  .win-resize::after {
    content: ''; position: absolute; right: 4px; bottom: 4px;
    width: 7px; height: 7px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    border-radius: 1px; opacity: 0.35;
  }
  .win:hover .win-resize::after { opacity: 0.75; }

  /* ── TABS MODE ── */
  #workspace.tabs-mode {
    display: flex; flex-direction: column;
    height: calc(100vh - 48px);
    overflow: hidden;
  }
  #tab-strip {
    display: none; background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 12px; gap: 2px; align-items: flex-end; height: 40px; flex-shrink: 0;
  }
  #tab-strip.visible { display: flex; }
  .tab-content {
    display: none; flex: 1; min-height: 0;
  }
  .tab-content.active { display: flex; flex-direction: column; }
  #workspace.tabs-mode .win {
    position: static; flex: 1; min-height: 0;
    width: auto !important; height: auto !important;
    border-radius: 0; border: none; box-shadow: none; display: none;
  }
  #workspace.tabs-mode .win.tab-active { display: flex; }
  #workspace.tabs-mode .win-bar { cursor: default; }
  #workspace.tabs-mode .win-resize { display: none; }

  .tab-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px; height: 33px; cursor: pointer;
    border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none;
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 500;
    transition: all 0.14s; user-select: none; position: relative; bottom: -1px; white-space: nowrap;
  }
  .tab-pill:hover { color: var(--text); background: rgba(139,21,186,0.06); }
  .tab-pill.active { color: #e8ecf4; background: var(--bg); border-color: var(--border); border-bottom-color: var(--bg); }
  .tab-pill .tbadge {
    font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
    background: rgba(139,21,186,0.15); color: var(--accent);
    border: 1px solid rgba(139,21,186,0.2); border-radius: 3px; padding: 2px 5px;
  }
  .tab-pill.active .tbadge { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── TILED MODE ── */
  #workspace.tiled-mode {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    grid-auto-rows: calc((100vh - 48px) / 2);
    gap: 6px; padding: 6px;
    height: calc(100vh - 48px);
    overflow: auto; align-content: start;
  }
  #workspace.tiled-mode .win {
    position: static !important;
    width: auto !important; height: auto !important;
    border-radius: var(--radius);
  }
  #workspace.tiled-mode .win-resize { display: none; }
  #workspace.tiled-mode .win-bar { cursor: default; }

  /* ── RESTORE BAR ── */
  #restore-bar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; display: none; gap: 6px; align-items: center;
    z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #restore-bar.visible { display: flex; }
  .restore-chip {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 5px; background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; font-size: 11px; color: var(--muted); transition: all 0.13s;
    font-family: 'Space Mono', monospace; letter-spacing: 0.08em;
  }
  .restore-chip:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

&lt;html lang=&quot;pl&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;LED CRI Analyzer&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
  :root {
    --bg: #0d0f14;
    --surface: #161820;
    --surface2: #1e2028;
    --border: #2a2d3a;
    --border-light: #353847;
    --accent: #8b15ba;
    --accent2: #e8915b;
    --text: #e8eaf0;
    --text-dim: #8b8fa8;
    --text-muted: #5a5e72;
    --input-bg: #12141c;
    --input-border: #252838;
    --input-focus: #8b15ba;
    --good: #5fc97e;
    --warn: #e8c45b;
    --bad: #e85b5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: &#x27;DM Sans&#x27;, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 14px 14px 20px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 18px;
  }
  header h1 {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
  }
  header h1 span { color: var(--accent); }
  header p { font-size: 12px; color: var(--text-muted); }

  .main-layout {
    display: grid;
    grid-template-columns: 25vw 37.5vw;
    gap: 14px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .panel-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-body { padding: 14px 16px; }

  /* LED rows table */
  .led-table {
    width: 100%;
    border-collapse: collapse;
  }
  .led-table thead th {
    padding: 6px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .led-table thead th:first-child { text-align: left; }
  .led-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .led-table tbody tr:last-child { border-bottom: none; }
  .led-table tbody tr:hover { background: rgba(139,21,186,0.04); }
  .led-table tbody td {
    padding: 7px 8px;
    text-align: center;
    vertical-align: middle;
  }
  .led-table tbody td:first-child { text-align: left; }

  .led-color-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 7px;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .led-name {
    font-size: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
  }
  .led-nm {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .num-input {
    width: 64px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 5px;
    color: var(--text);
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 12px;
    padding: 5px 7px;
    text-align: right;
    outline: none;
    transition: border-color 0.15s;
  }
  .num-input:focus { border-color: var(--input-focus); }

  .pwm-slider-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type=range] {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border-light);
    outline: none;
    cursor: pointer;
    flex: 1;
    min-width: 60px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* Results */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    text-align: center;
  }
  .result-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .result-value {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .result-value.good { color: var(--good); }
  .result-value.warn { color: var(--warn); }
  .result-value.bad  { color: var(--bad);  }
  .result-value.neutral { color: var(--text); }

  .result-sub {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* Ri breakdown */
  .ri-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-top: 6px;
  }
  .ri-cell {
    background: var(--surface2);
    border-radius: 4px;
    padding: 4px 3px;
    text-align: center;
  }
  .ri-cell-label {
    font-size: 9px;
    color: var(--text-muted);
    font-family: &#x27;Space Mono&#x27;, monospace;
  }
  .ri-cell-val {
    font-size: 11px;
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-weight: 700;
  }

  /* Canvas */
  canvas {
    width: 100%;
    border-radius: 6px;
    display: block;
  }

  .chart-wrap {
    background: var(--input-bg);
    border-radius: 8px;
    padding: 8px;
    position: relative;
  }

  /* Add LED section */
  .add-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    flex-wrap: wrap;
  }
  select.add-select {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    color: var(--text);
    font-family: &#x27;DM Sans&#x27;, sans-serif;
    font-size: 12px;
    padding: 6px 8px;
    cursor: pointer;
    outline: none;
    flex: 1;
    min-width: 160px;
  }
  .add-btn {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 11px;
    font-weight: 700;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: #fff;
    padding: 7px 14px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: 0.85; }
  .del-btn {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border-light);
    border-radius: 5px;
    color: var(--text-muted);
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .del-btn:hover { border-color: var(--bad); color: var(--bad); }

  .full-span { grid-column: 1 / -1; }

  .ri-title {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .legend-wrap {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-line { width: 18px; height: 3px; border-radius: 2px; }

  @media (max-width: 700px) {
    .main-layout { grid-template-columns: 1fr; }
    .results-grid { grid-template-columns: 1fr 1fr; }
  }

  .app-header {
    flex-shrink: 0;
    padding: 2px 4px;
    margin-bottom: 10px;
  }
  .app-header h1 {
    font-family: &#x27;Space Mono&#x27;, monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #e8ecf4;
    line-height: 1;
  }
  .app-header h1 .h-w1 { color: #ffffff; }
  .app-header h1 .h-w2 { color: #8b15ba; }
  .app-header p {
    font-size: 11px;
    color: #4e5668;
    margin-top: 5px;
    font-family: &#x27;IBM Plex Sans&#x27;, &#x27;DM Sans&#x27;, sans-serif;
    letter-spacing: 0.01em;
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;div class=&quot;main-layout&quot;&gt;

// Gaussian helper
function gaussian(lam, peak, fwhm, amplitude) {
  const sigma = fwhm / (2 * Math.sqrt(2 * Math.LN2));
  return amplitude * Math.exp(-0.5 * Math.pow((lam - peak) / sigma, 2));
}

// Multi-Gaussian SPD builder
function buildSPD(components) {
  const spd = new Array(401).fill(0);
  for (let i = 0; i &lt; 401; i++) {
    const lam = 380 + i;
    for (const c of components) {
      spd[i] += gaussian(lam, c.peak, c.fwhm, c.amp);
    }
  }
  // Normalize to 1
  const mx = Math.max(...spd);
  if (mx &gt; 0) for (let i = 0; i &lt; 401; i++) spd[i] /= mx;
  return spd;
}

function interpolateSPD(spd5nm) {
  const spd = [];

  for (let lam = 380; lam &lt;= 780; lam++) {
    const idx = (lam - 380) / 5;

    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, spd5nm.length - 1);

    const frac = idx - i0;

    const v =
      spd5nm[i0] * (1 - frac) +
      spd5nm[i1] * frac;

    spd.push(v);
  }

  return spd;
}

function interp5to1(arr5, lam) {
  // lam: 380..780, arr5 has indices 0..80 at 5nm steps from 380
  const i = (lam - 380) / 5;
  const i0 = Math.floor(i);
  const i1 = Math.min(i0 + 1, 80);
  const f = i - i0;
  return arr5[i0] * (1 - f) + arr5[i1] * f;
}

function getCMF(lam) {
  return {
    x: interp5to1(CMF_5NM.xbar, lam),
    y: interp5to1(CMF_5NM.ybar, lam),
    z: interp5to1(CMF_5NM.zbar, lam),
  };
}

function spdToXYZ(spd) {
  let X = 0, Y = 0, Z = 0;
  for (let i = 0; i &lt; 401; i++) {
    const lam = 380 + i;
    const c = getCMF(lam);
    X += spd[i] * c.x;
    Y += spd[i] * c.y;
    Z += spd[i] * c.z;
  }
  return {X, Y, Z};
}

function XYZtoxyY(X, Y, Z) {
  const s = X + Y + Z;
  if (s &lt; 1e-10) return {x: 0.333, y: 0.333, Y};
  return {x: X/s, y: Y/s, Y};
}

function XYZtoLab(X, Y, Z, Xn, Yn, Zn) {
  function f(t) { return t &gt; 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116; }
  const L = 116 * f(Y/Yn) - 16;
  const a = 500 * (f(X/Xn) - f(Y/Yn));
  const b = 200 * (f(Y/Yn) - f(Z/Zn));
  return {L, a, b};
}

// ══════════════════════════════════════════════
// CCT estimation (McCamy formula)
// ══════════════════════════════════════════════
function xyzToCCT(X, Y, Z) {
  const {x, y} = XYZtoxyY(X, Y, Z);
  const n = (x - 0.3320) / (0.1858 - y);
  return 449*n*n*n + 3525*n*n + 6823.3*n + 5520.33;
}

// ══════════════════════════════════════════════
// Planckian / Daylight reference SPD
// ══════════════════════════════════════════════
function planckianSPD(T) {
  const h = 6.626e-34, c = 2.998e8, k = 1.381e-23;
  const c1 = 2*h*c*c, c2 = h*c/k;
  const spd = new Array(401);
  let mx = 0;
  for (let i = 0; i &lt; 401; i++) {
    const lam = (380 + i) * 1e-9;
    spd[i] = c1 / (Math.pow(lam, 5) * (Math.exp(c2 / (lam * T)) - 1));
    if (spd[i] &gt; mx) mx = spd[i];
  }
  for (let i = 0; i &lt; 401; i++) spd[i] /= mx;
  return spd;
}

// ══════════════════════════════════════════════
// CIE TCS (Test Color Samples) — Munsell reflectance functions
// Using simplified Gaussian approximations of the 14 standard CIE samples
// ══════════════════════════════════════════════
const TCS_PARAMS = [
  // R1: 7.5R 6/4 – medium grey-red
  [{peak:620,fwhm:110,amp:0.5},{peak:450,fwhm:80,amp:0.13}],
  // R2: 5Y 6/4 – olive
  [{peak:580,fwhm:120,amp:0.6},{peak:430,fwhm:60,amp:0.1}],
  // R3: 5GY 6/8 – yellow-green
  [{peak:540,fwhm:90,amp:0.75}],
  // R4: 2.5G 6/6 – moderate green
  [{peak:515,fwhm:80,amp:0.65}],
  // R5: 10BG 6/4 – cyan-green
  [{peak:490,fwhm:80,amp:0.55}],
  // R6: 5PB 6/8 – blue
  [{peak:460,fwhm:70,amp:0.65}],
  // R7: 2.5P 6/8 – violet
  [{peak:440,fwhm:100,amp:0.55},{peak:630,fwhm:80,amp:0.25}],
  // R8: 10P 6/8 – red-purple
  [{peak:420,fwhm:80,amp:0.3},{peak:640,fwhm:90,amp:0.6}],
  // R9: 4.5R 4/13 – strong red
  [{peak:640,fwhm:80,amp:0.85}],
  // R10: 4.5Y 6/10 – strong yellow
  [{peak:578,fwhm:100,amp:0.8}],
  // R11: 4.5G 5/8 – strong green
  [{peak:525,fwhm:70,amp:0.8}],
  // R12: 4.5B 4/8 – strong blue
  [{peak:462,fwhm:60,amp:0.75}],
  // R13: Caucasian skin tone
  [{peak:590,fwhm:150,amp:0.5},{peak:450,fwhm:80,amp:0.08}],
  // R14: leaf green
  [{peak:530,fwhm:70,amp:0.72},{peak:670,fwhm:50,amp:0.12}],
  // R15: Asian skin tone
  [{peak:585,fwhm:140,amp:0.55},{peak:455,fwhm:80,amp:0.1}],
];

const TCS_SPDS = TCS_PARAMS.map(params =&gt; {
  const spd = new Array(401).fill(0);
  for (let i = 0; i &lt; 401; i++) {
    const lam = 380 + i;
    for (const p of params) {
      spd[i] += gaussian(lam, p.peak, p.fwhm, p.amp);
    }
    // clamp to [0, 1]
    spd[i] = Math.min(1, Math.max(0, spd[i]));
  }
  return spd;
});

// ══════════════════════════════════════════════
// CRI Calculation
// ══════════════════════════════════════════════
function illuminateTCS(tcsSPD, lightSPD) {
  // reflected SPD = TCS * light
  const ref = new Array(401);
  for (let i = 0; i &lt; 401; i++) ref[i] = tcsSPD[i] * lightSPD[i];
  return spdToXYZ(ref);
}



function computeCRI(testSPD) {

  const testXYZ = spdToXYZ(testSPD);

  if (testXYZ.Y &lt; 1e-10) {
    return {Ra:null, Ri:[], cct:null};
  }

  const cct = xyzToCCT(testXYZ.X, testXYZ.Y, testXYZ.Z);

  const refSPD = planckianSPD(
    Math.max(2000, Math.min(9000, cct))
  );

  const refXYZ = spdToXYZ(refSPD);

  const Ri = [];

  for (let t = 0; t &lt; 15; t++) {

    const refSample = illuminateTCS(TCS_SPDS[t], refSPD);
    const testSample = illuminateTCS(TCS_SPDS[t], testSPD);

    // chromatic adaptation
    const adapted = {
      X: testSample.X * (refXYZ.X / Math.max(testXYZ.X, 1e-9)),
      Y: testSample.Y * (refXYZ.Y / Math.max(testXYZ.Y, 1e-9)),
      Z: testSample.Z * (refXYZ.Z / Math.max(testXYZ.Z, 1e-9)),
    };

    const refLab = XYZtoLab(
      refSample.X,
      refSample.Y,
      refSample.Z,
      refXYZ.X,
      refXYZ.Y,
      refXYZ.Z
    );

    const testLab = XYZtoLab(
      adapted.X,
      adapted.Y,
      adapted.Z,
      refXYZ.X,
      refXYZ.Y,
      refXYZ.Z
    );

    const dE = Math.sqrt(
      (refLab.L - testLab.L) ** 2 +
      (refLab.a - testLab.a) ** 2 +
      (refLab.b - testLab.b) ** 2
    );

    let ri = 100 - (2.2 * dE);

    ri = Math.max(0, Math.min(100, ri));

    Ri.push(Math.round(ri));
  }

  const Ra = Math.round(
    Ri.slice(0,8).reduce((a,b)=&gt;a+b,0) / 8
  );

  return {
    Ra,
    Ri,
    cct: Math.round(cct)
  };
}



// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let activeLeds = [
  {id: &#x27;LED-3000K&#x27;, count: 4, pwm: 255},
  {id: &#x27;LED-Amber&#x27;, count: 1, pwm: 120},
  {id: &#x27;LED-Red&#x27;, count: 1, pwm: 90},
];
let rowCounter = 0;

// ── Populate add select ──
const addSel = document.getElementById(&#x27;addSelect&#x27;);
const groups = {};
for (const [id, led] of Object.entries(LED_LIBRARY)) {
  if (!groups[led.series]) groups[led.series] = [];
  groups[led.series].push({id, led});
}
for (const [series, items] of Object.entries(groups)) {
  const grp = document.createElement(&#x27;optgroup&#x27;);
  grp.label = series;
  for (const {id, led} of items) {
    const opt = document.createElement(&#x27;option&#x27;);
    opt.value = id;
    opt.textContent = led.name;
    grp.appendChild(opt);
  }
  addSel.appendChild(grp);
}

function addLed() {
  const id = addSel.value;
  activeLeds.push({id, count: 1, pwm: 255});
  renderTable();
  recalculate();
}

function removeLed(idx) {
  activeLeds.splice(idx, 1);
  renderTable();
  recalculate();
}

function renderTable() {
  const tbody = document.getElementById(&#x27;ledTableBody&#x27;);
  tbody.innerHTML = &#x27;&#x27;;
  activeLeds.forEach((led, idx) =&gt; {
    const info = LED_LIBRARY[led.id];
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.innerHTML = `
      &lt;td&gt;
        &lt;div class=&quot;led-name&quot;&gt;
          &lt;span class=&quot;led-color-dot&quot; style=&quot;background:${info.hexColor};border:1px solid rgba(255,255,255,0.2)&quot;&gt;&lt;/span&gt;
          ${info.name}
        &lt;/div&gt;
      &lt;/td&gt;
      &lt;td&gt;
        &lt;input type=&quot;number&quot; class=&quot;num-input&quot; min=&quot;1&quot; max=&quot;999&quot; value=&quot;${led.count}&quot;
          onchange=&quot;activeLeds[${idx}].count = Math.max(1, parseInt(this.value)||1); recalculate();&quot;&gt;
      &lt;/td&gt;
      &lt;td&gt;
        &lt;div class=&quot;pwm-slider-wrap&quot;&gt;
          &lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;255&quot; value=&quot;${led.pwm}&quot;
            oninput=&quot;activeLeds[${idx}].pwm = parseInt(this.value); this.parentElement.querySelector(&#x27;.pwm-num&#x27;).value=this.value; recalculate();&quot;&gt;
          &lt;input type=&quot;number&quot; class=&quot;num-input pwm-num&quot; min=&quot;0&quot; max=&quot;255&quot; value=&quot;${led.pwm}&quot; style=&quot;width:50px&quot;
            onchange=&quot;activeLeds[${idx}].pwm = Math.max(0,Math.min(255,parseInt(this.value)||0)); this.parentElement.querySelector(&#x27;input[type=range]&#x27;).value=activeLeds[${idx}].pwm; recalculate();&quot;&gt;
        &lt;/div&gt;
      &lt;/td&gt;
      &lt;td&gt;
        &lt;span style=&quot;font-family:&#x27;Space Mono&#x27;,monospace;font-size:11px;color:var(--text-muted)&quot;&gt;${(led.pwm/255*100).toFixed(0)}%&lt;/span&gt;
      &lt;/td&gt;
      &lt;td&gt;
        &lt;button class=&quot;del-btn&quot; onclick=&quot;removeLed(${idx})&quot;&gt;✕&lt;/button&gt;
      &lt;/td&gt;
    `;
    tbody.appendChild(tr);
  });
}

// ══════════════════════════════════════════════
// COMBINED SPD
// ══════════════════════════════════════════════
function getCombinedSPD() {
  const combined = new Array(401).fill(0);
  for (const led of activeLeds) {
    const info = LED_LIBRARY[led.id];
    const weight = led.count * (led.pwm / 255);
    for (let i = 0; i &lt; 401; i++) {
      combined[i] += interpolateSPD(info.spd5nm)[i] * weight;
    }
  }
  // normalize by total spectral energy
  const sum = combined.reduce((a,b) =&gt; a + b, 0);

  if (sum &gt; 0) {
    for (let i = 0; i &lt; 401; i++) {
      combined[i] /= sum;
    }
  }
  return combined;
}

function scoreClass(val, threshHigh, threshMed) {
  if (val === null) return &#x27;neutral&#x27;;
  if (val &gt;= threshHigh) return &#x27;good&#x27;;
  if (val &gt;= threshMed) return &#x27;warn&#x27;;
  return &#x27;bad&#x27;;
}

// ══════════════════════════════════════════════
// CANVAS CHART
// ══════════════════════════════════════════════
const canvas = document.getElementById(&#x27;specChart&#x27;);
const ctx = canvas.getContext(&#x27;2d&#x27;);

function lambdaToRGB(lam) {
  // approximate visible spectrum coloring
  let r=0,g=0,b=0;
  if (lam &gt;= 380 &amp;&amp; lam &lt; 440) { r=(440-lam)/60; g=0; b=1; }
  else if (lam &lt; 490) { r=0; g=(lam-440)/50; b=1; }
  else if (lam &lt; 510) { r=0; g=1; b=(510-lam)/20; }
  else if (lam &lt; 580) { r=(lam-510)/70; g=1; b=0; }
  else if (lam &lt; 645) { r=1; g=(645-lam)/65; b=0; }
  else { r=1; g=0; b=0; }
  // factor for extremes
  let fac=1;
  if (lam &gt;= 380 &amp;&amp; lam &lt; 420) fac=0.3+0.7*(lam-380)/40;
  if (lam &gt; 700) fac=0.3+0.7*(780-lam)/80;
  return `rgba(${Math.round(r*255*fac)},${Math.round(g*255*fac)},${Math.round(b*255*fac)},0.85)`;
}

function drawChart(combinedSPD) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 2;
  const H = 220;
  canvas.style.width = W + &#x27;px&#x27;;
  canvas.style.height = H + &#x27;px&#x27;;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const padL=44, padR=14, padT=18, padB=36;
  const cw = W - padL - padR;
  const ch = H - padT - padB;

  // Normalize to max=1 for display (not by sum like CRI calc)
  const maxVal = Math.max(...combinedSPD) || 1;
  const norm = combinedSPD.map(v =&gt; v / maxVal);

  const tx = lam =&gt; padL + (lam-380)/400 * cw;
  const ty = v   =&gt; padT + ch * (1 - v);

  // Dark background
  ctx.fillStyle = &#x27;#0d0f12&#x27;;
  ctx.fillRect(0, 0, W, H);

  // Spectral gradient fill under combined curve
  const grad = ctx.createLinearGradient(padL, 0, padL+cw, 0);
  for (let wl = 380; wl &lt;= 780; wl += 5) {
    grad.addColorStop(Math.min(1,(wl-380)/400), lambdaToRGBsa(wl) + &#x27;0.55)&#x27;);
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx(380), ty(0));
  for (let i = 0; i &lt;= 400; i++) ctx.lineTo(tx(380+i), ty(Math.max(0, norm[i]||0)));
  ctx.lineTo(tx(780), ty(0));
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Individual LED SPDs (dim coloured lines), also normalised
  for (const led of activeLeds) {
    const info = LED_LIBRARY[led.id];
    const weight = led.count * (led.pwm / 255);
    if (weight &lt; 0.001) continue;
    const spd = interpolateSPD(info.spd5nm);
    const ledMax = Math.max(...spd.map(v =&gt; v * weight));
    if (ledMax &lt; 0.001) continue;
    ctx.beginPath();
    ctx.strokeStyle = info.hexColor + &#x27;55&#x27;;
    ctx.lineWidth = 1;
    for (let i = 0; i &lt;= 400; i++) {
      const x = tx(380+i);
      const y = ty(Math.min(1, (spd[i] * weight) / maxVal));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Grid lines (dark, on top of fill)
  ctx.strokeStyle = &#x27;rgba(30,37,53,0.9)&#x27;;
  ctx.lineWidth = 1;
  [400, 450, 500, 550, 600, 650, 700, 750].forEach(lam =&gt; {
    ctx.beginPath(); ctx.moveTo(tx(lam), padT); ctx.lineTo(tx(lam), padT+ch); ctx.stroke();
  });
  for (let g = 0; g &lt;= 5; g++) {
    const y = padT + ch * (1 - g/5);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+cw, y); ctx.stroke();
  }

  // Coloured glow stroke (per-segment, wavelength colour) — under white curve
  ctx.lineWidth = 3;
  ctx.lineJoin = &#x27;round&#x27;;
  for (let i = 0; i &lt; 400; i++) {
    const lam = 380 + i;
    const x1 = tx(lam), y1 = ty(norm[i]||0);
    const x2 = tx(lam+1), y2 = ty(norm[i+1]||0);
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = lambdaToRGBsa(lam + 0.5) + &#x27;0.45)&#x27;;
    ctx.stroke();
  }

  // White curve on top
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx(380), ty(norm[0]||0));
  for (let i = 0; i &lt;= 400; i++) ctx.lineTo(tx(380+i), ty(norm[i]||0));
  ctx.strokeStyle = &#x27;rgba(255,255,255,0.9)&#x27;;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // Peak marker
  let peakIdx = 0;
  for (let i = 1; i &lt;= 400; i++) if ((norm[i]||0) &gt; (norm[peakIdx]||0)) peakIdx = i;
  if ((norm[peakIdx]||0) &gt; 0.01) {
    const peakLam = 380 + peakIdx;
    ctx.strokeStyle = &#x27;rgba(192,106,224,0.8)&#x27;; ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(tx(peakLam), padT); ctx.lineTo(tx(peakLam), padT+ch); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = &#x27;#c06ae0&#x27;; ctx.font = &#x27;bold 10px Space Mono, monospace&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(peakLam + &#x27;nm&#x27;, tx(peakLam), padT - 4);
  }

  // Axes
  ctx.strokeStyle = &#x27;rgba(74,90,106,0.8)&#x27;; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+ch); ctx.lineTo(padL+cw, padT+ch); ctx.stroke();

  // X-axis labels (wavelength colours)
  ctx.font = &#x27;9px Space Mono, monospace&#x27;; ctx.textAlign = &#x27;center&#x27;;
  [400, 450, 500, 550, 600, 650, 700, 750].forEach(lam =&gt; {
    ctx.fillStyle = lambdaToRGBsa(lam) + &#x27;1)&#x27;;
    ctx.fillText(lam + &#x27;nm&#x27;, tx(lam), padT+ch+14);
  });

  // Y-axis labels
  ctx.textAlign = &#x27;right&#x27;; ctx.fillStyle = &#x27;#4e5668&#x27;; ctx.font = &#x27;9px Space Mono, monospace&#x27;;
  for (let g = 0; g &lt;= 5; g++) {
    const y = padT + ch * (1 - g/5);
    ctx.fillText((g/5).toFixed(1), padL - 5, y + 3);
  }
}

// SA-compatible wavelength→color (returns rgba prefix without alpha)
function lambdaToRGBsa(wl) {
  let r=0,g=0,b=0;
  if (wl&gt;=380&amp;&amp;wl&lt;440){r=(440-wl)/60;g=0;b=1;}
  else if(wl&gt;=440&amp;&amp;wl&lt;490){r=0;g=(wl-440)/50;b=1;}
  else if(wl&gt;=490&amp;&amp;wl&lt;510){r=0;g=1;b=(510-wl)/20;}
  else if(wl&gt;=510&amp;&amp;wl&lt;580){r=(wl-510)/70;g=1;b=0;}
  else if(wl&gt;=580&amp;&amp;wl&lt;645){r=1;g=(645-wl)/65;b=0;}
  else{r=1;g=0;b=0;}
  let att=1;
  if(wl&lt;420)att=0.3+0.7*(wl-380)/40;
  else if(wl&gt;700)att=0.3+0.7*(780-wl)/80;
  return `rgba(${Math.round(r*255*att)},${Math.round(g*255*att)},${Math.round(b*255*att)},`;
}

// Legend
function updateLegend() {
  const legend = document.getElementById(&#x27;specLegend&#x27;);
  legend.innerHTML = &#x27;&#x27;;
  for (const led of activeLeds) {
    const info = LED_LIBRARY[led.id];
    const d = document.createElement(&#x27;div&#x27;);
    d.className = &#x27;legend-item&#x27;;
    d.innerHTML = `&lt;div class=&quot;legend-line&quot; style=&quot;background:${info.hexColor}88&quot;&gt;&lt;/div&gt;${info.name} ×${activeLeds.find(l=&gt;l.id===led.id)?.count||1}`;
    legend.appendChild(d);
  }
}

// ══════════════════════════════════════════════
// MAIN RECALCULATE
// ══════════════════════════════════════════════
function recalculate() {
  // Update % in table dynamically
  document.querySelectorAll(&#x27;#ledTableBody tr&#x27;).forEach((tr, idx) =&gt; {
    const pct = tr.querySelector(&#x27;td:nth-child(4) span&#x27;);
    if (pct &amp;&amp; activeLeds[idx]) pct.textContent = (activeLeds[idx].pwm/255*100).toFixed(0) + &#x27;%&#x27;;
  });

  const combined = getCombinedSPD();
  const hasSignal = combined.some(v =&gt; v &gt; 0.001);

  if (!hasSignal) {
    document.getElementById(&#x27;criVal&#x27;).textContent = &#x27;—&#x27;;
    document.getElementById(&#x27;criVal&#x27;).className = &#x27;result-value neutral&#x27;;
    document.getElementById(&#x27;riGrid&#x27;).innerHTML = &#x27;&#x27;;
    drawChart(combined);
    return;
  }

  const cri = computeCRI(combined);

  // CRI
  if (cri.Ra !== null) {
    const el = document.getElementById(&#x27;criVal&#x27;);
    el.textContent = cri.Ra;
    el.className = &#x27;result-value &#x27; + scoreClass(cri.Ra, 85, 70);
  }

  // R1-R15 grid
  const grid = document.getElementById(&#x27;riGrid&#x27;);
  grid.innerHTML = &#x27;&#x27;;
  if (cri.Ri) {
    cri.Ri.forEach((ri, i) =&gt; {
      const cell = document.createElement(&#x27;div&#x27;);
      cell.className = &#x27;ri-cell&#x27;;
      const cl = ri &gt;= 85 ? &#x27;good&#x27; : ri &gt;= 70 ? &#x27;warn&#x27; : &#x27;bad&#x27;;
      cell.innerHTML = `&lt;div class=&quot;ri-cell-label&quot;&gt;R${i+1}&lt;/div&gt;&lt;div class=&quot;ri-cell-val&quot; style=&quot;color:var(--${cl})&quot;&gt;${ri}&lt;/div&gt;`;
      grid.appendChild(cell);
    });
  }

  drawChart(combined);
  updateLegend();
}

// Init
renderTable();
recalculate();

// Redraw on resize
window.addEventListener(&#x27;resize&#x27;, () =&gt; {
  const combined = getCombinedSPD();
  drawChart(combined);
});

&lt;script&gt;
// Render CRI spectrum to offscreen canvas with WHITE background for PDF export
function getCRIChartImageLight() {
  const combined = getCombinedSPD();
  const maxVal = Math.max(...combined) || 1;
  const norm = combined.map(v =&gt; v / maxVal);
  const W = 860, H = 220;
  const oc = document.createElement(&#x27;canvas&#x27;);
  oc.width = W; oc.height = H;
  const c = oc.getContext(&#x27;2d&#x27;);
  const padL=44, padR=14, padT=18, padB=36;
  const cw = W - padL - padR;
  const ch = H - padT - padB;
  const tx = lam =&gt; padL + (lam-380)/400 * cw;
  const ty = v   =&gt; padT + ch * (1 - v);

  // White bg
  c.fillStyle = &#x27;#ffffff&#x27;; c.fillRect(0, 0, W, H);

  // Spectral gradient fill under normalised curve
  const grad = c.createLinearGradient(padL, 0, padL+cw, 0);
  for (let wl = 380; wl &lt;= 780; wl += 5)
    grad.addColorStop(Math.min(1,(wl-380)/400), lambdaToRGBsa(wl) + &#x27;0.35)&#x27;);
  c.save();
  c.beginPath();
  c.moveTo(tx(380), ty(0));
  for (let i = 0; i &lt;= 400; i++) c.lineTo(tx(380+i), ty(Math.max(0, norm[i]||0)));
  c.lineTo(tx(780), ty(0));
  c.closePath();
  c.fillStyle = grad; c.fill();
  c.restore();

  // Individual LED SPDs (dim, normalised)
  for (const led of activeLeds) {
    const info = LED_LIBRARY[led.id];
    const weight = led.count * (led.pwm / 255);
    if (weight &lt; 0.001) continue;
    const spd = interpolateSPD(info.spd5nm);
    c.beginPath();
    c.strokeStyle = info.hexColor + &#x27;55&#x27;;
    c.lineWidth = 1;
    for (let i = 0; i &lt;= 400; i++) {
      const x = tx(380+i);
      const y = ty(Math.min(1, (spd[i]*weight)/maxVal));
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }

  // Grid
  c.strokeStyle = &#x27;rgba(180,185,200,0.7)&#x27;; c.lineWidth = 1;
  [400, 450, 500, 550, 600, 650, 700, 750].forEach(lam =&gt; {
    c.beginPath(); c.moveTo(tx(lam), padT); c.lineTo(tx(lam), padT+ch); c.stroke();
  });
  for (let g = 0; g &lt;= 5; g++) {
    const y = padT + ch*(1-g/5);
    c.beginPath(); c.moveTo(padL, y); c.lineTo(padL+cw, y); c.stroke();
  }

  // Coloured glow stroke under dark curve
  c.lineWidth = 3; c.lineJoin = &#x27;round&#x27;;
  for (let i = 0; i &lt; 400; i++) {
    const lam = 380 + i;
    c.beginPath();
    c.moveTo(tx(lam), ty(norm[i]||0)); c.lineTo(tx(lam+1), ty(norm[i+1]||0));
    c.strokeStyle = lambdaToRGBsa(lam+0.5) + &#x27;0.5)&#x27;;
    c.stroke();
  }

  // Dark curve on top
  c.save();
  c.beginPath();
  c.moveTo(tx(380), ty(norm[0]||0));
  for (let i = 0; i &lt;= 400; i++) c.lineTo(tx(380+i), ty(norm[i]||0));
  c.strokeStyle = &#x27;rgba(20,20,40,0.85)&#x27;; c.lineWidth = 1.5;
  c.stroke();
  c.restore();

  // Peak marker
  let peakIdx = 0;
  for (let i = 1; i &lt;= 400; i++) if ((norm[i]||0) &gt; (norm[peakIdx]||0)) peakIdx = i;
  if ((norm[peakIdx]||0) &gt; 0.01) {
    const peakLam = 380 + peakIdx;
    c.strokeStyle = &#x27;rgba(139,21,186,0.6)&#x27;; c.lineWidth = 1;
    c.setLineDash([3,3]);
    c.beginPath(); c.moveTo(tx(peakLam), padT); c.lineTo(tx(peakLam), padT+ch); c.stroke();
    c.setLineDash([]);
    c.fillStyle = &#x27;#8b15ba&#x27;; c.font = &#x27;bold 10px Space Mono, monospace&#x27;;
    c.textAlign = &#x27;center&#x27;;
    c.fillText(peakLam + &#x27;nm&#x27;, tx(peakLam), padT - 4);
  }

  // Axes
  c.strokeStyle = &#x27;rgba(100,110,130,0.8)&#x27;; c.lineWidth = 1;
  c.beginPath(); c.moveTo(padL, padT); c.lineTo(padL, padT+ch); c.lineTo(padL+cw, padT+ch); c.stroke();

  // X labels (coloured)
  c.font = &#x27;9px Space Mono, monospace&#x27;; c.textAlign = &#x27;center&#x27;;
  [400,450,500,550,600,650,700,750].forEach(lam =&gt; {
    c.fillStyle = lambdaToRGBsa(lam) + &#x27;1)&#x27;;
    c.fillText(lam + &#x27;nm&#x27;, tx(lam), padT+ch+14);
  });

  // Y labels
  c.textAlign = &#x27;right&#x27;; c.fillStyle = &#x27;#556&#x27;; c.font = &#x27;9px monospace&#x27;;
  for (let g = 0; g &lt;= 5; g++) {
    const y = padT + ch*(1-g/5);
    c.fillText((g/5).toFixed(1), padL - 4, y + 3);
  }
  return oc.toDataURL(&#x27;image/png&#x27;);
}

function exportToPDF() {
  const criEl = document.getElementById(&#x27;criVal&#x27;);
  const Ra = criEl ? criEl.textContent.trim() : &#x27;—&#x27;;
  
  // R1-R15 from grid
  const riCells = document.querySelectorAll(&#x27;.ri-cell&#x27;);
  const riData = [];
  riCells.forEach((cell, i) =&gt; {
    const val = cell.querySelector(&#x27;.ri-cell-val&#x27;);
    if (val) riData.push({label: &#x27;R&#x27;+(i+1), value: val.textContent.trim()});
  });
  
  // Active LEDs
  const ledRows = document.querySelectorAll(&#x27;#ledTableBody tr&#x27;);
  const leds = [];
  ledRows.forEach(row =&gt; {
    const cb = row.querySelector(&#x27;input[type=checkbox]&#x27;);
    const nameEl = row.querySelector(&#x27;td:nth-child(2)&#x27;);
    const pwmEl = row.querySelector(&#x27;input[type=range]&#x27;);
    if (cb &amp;&amp; cb.checked &amp;&amp; nameEl) {
      leds.push({name: nameEl.textContent.trim(), pwm: pwmEl ? pwmEl.value : &#x27;—&#x27;});
    }
  });

  // Use light-theme offscreen render for PDF
  let chartImage = null;
  try { chartImage = getCRIChartImageLight(); } catch(e) {}

  const payload = {
    source: &#x27;CRI&#x27;,
    title: &#x27;LED CRI Analyzer&#x27;,
    data: {
      Ra,
      riData,
      leds,
      chartImage,
    }
  };
  window.parent.postMessage({type:&#x27;LED_TOOLS_EXPORT&#x27;, payload}, &#x27;*&#x27;);
}
&lt;/script&gt;

&lt;script&gt;
// Listen for trigger from parent relay
window.addEventListener(&#x27;message&#x27;, (e) =&gt; {
  if (e.data &amp;&amp; e.data.type === &#x27;LED_TOOLS_TRIGGER_EXPORT&#x27;) {
    if (typeof exportToPDF === &#x27;function&#x27;) exportToPDF();
  }
});
&lt;/script&gt;

// ═══════════════════════════════════════════════════════════════
// MATRIX HELPERS
// ═══════════════════════════════════════════════════════════════
function matMul3(M, v) {
  return [
    M[0][0]*v[0] + M[0][1]*v[1] + M[0][2]*v[2],
    M[1][0]*v[0] + M[1][1]*v[1] + M[1][2]*v[2],
    M[2][0]*v[0] + M[2][1]*v[1] + M[2][2]*v[2],
  ];
}

function inv3(m) {
  const det = m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
             -m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
             +m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
  const inv = 1/det;
  return [
    [(m[1][1]*m[2][2]-m[1][2]*m[2][1])*inv, (m[0][2]*m[2][1]-m[0][1]*m[2][2])*inv, (m[0][1]*m[1][2]-m[0][2]*m[1][1])*inv],
    [(m[1][2]*m[2][0]-m[1][0]*m[2][2])*inv, (m[0][0]*m[2][2]-m[0][2]*m[2][0])*inv, (m[0][2]*m[1][0]-m[0][0]*m[1][2])*inv],
    [(m[1][0]*m[2][1]-m[1][1]*m[2][0])*inv, (m[0][1]*m[2][0]-m[0][0]*m[2][1])*inv, (m[0][0]*m[1][1]-m[0][1]*m[1][0])*inv],
  ];
}

// ═══════════════════════════════════════════════════════════════
// CHROMATIC ADAPTATION (Bradford, von Kries, XYZ Scaling)
// ═══════════════════════════════════════════════════════════════
const MA_Bradford = [
  [ 0.8951,  0.2664, -0.1614],
  [-0.7502,  1.7135,  0.0367],
  [ 0.0389, -0.0685,  1.0296],
];
const MA_vonKries = [
  [ 0.40024,  0.70760, -0.08081],
  [-0.22630,  1.16532,  0.04570],
  [ 0.00000,  0.00000,  0.91822],
];
const MA_XYZ = [[1,0,0],[0,1,0],[0,0,1]];

function getChromaticAdaptationMatrix(ws, wd, method) {
  const MA = method === &#x27;Bradford&#x27; ? MA_Bradford : method === &#x27;vonKries&#x27; ? MA_vonKries : MA_XYZ;
  const MAi = inv3(MA);
  const cs = matMul3(MA, ws);
  const cd = matMul3(MA, wd);
  const scale = [[cd[0]/cs[0],0,0],[0,cd[1]/cs[1],0],[0,0,cd[2]/cs[2]]];
  // M = MAi * scale * MA
  const t = [
    [scale[0][0]*MA[0][0] + scale[0][1]*MA[1][0] + scale[0][2]*MA[2][0],
     scale[0][0]*MA[0][1] + scale[0][1]*MA[1][1] + scale[0][2]*MA[2][1],
     scale[0][0]*MA[0][2] + scale[0][1]*MA[1][2] + scale[0][2]*MA[2][2]],
    [scale[1][0]*MA[0][0] + scale[1][1]*MA[1][0] + scale[1][2]*MA[2][0],
     scale[1][0]*MA[0][1] + scale[1][1]*MA[1][1] + scale[1][2]*MA[2][1],
     scale[1][0]*MA[0][2] + scale[1][1]*MA[1][2] + scale[1][2]*MA[2][2]],
    [scale[2][0]*MA[0][0] + scale[2][1]*MA[1][0] + scale[2][2]*MA[2][0],
     scale[2][0]*MA[0][1] + scale[2][1]*MA[1][1] + scale[2][2]*MA[2][1],
     scale[2][0]*MA[0][2] + scale[2][1]*MA[1][2] + scale[2][2]*MA[2][2]],
  ];
  return [
    [MAi[0][0]*t[0][0]+MAi[0][1]*t[1][0]+MAi[0][2]*t[2][0],
     MAi[0][0]*t[0][1]+MAi[0][1]*t[1][1]+MAi[0][2]*t[2][1],
     MAi[0][0]*t[0][2]+MAi[0][1]*t[1][2]+MAi[0][2]*t[2][2]],
    [MAi[1][0]*t[0][0]+MAi[1][1]*t[1][0]+MAi[1][2]*t[2][0],
     MAi[1][0]*t[0][1]+MAi[1][1]*t[1][1]+MAi[1][2]*t[2][1],
     MAi[1][0]*t[0][2]+MAi[1][1]*t[1][2]+MAi[1][2]*t[2][2]],
    [MAi[2][0]*t[0][0]+MAi[2][1]*t[1][0]+MAi[2][2]*t[2][0],
     MAi[2][0]*t[0][1]+MAi[2][1]*t[1][1]+MAi[2][2]*t[2][1],
     MAi[2][0]*t[0][2]+MAi[2][1]*t[1][2]+MAi[2][2]*t[2][2]],
  ];
}

// ═══════════════════════════════════════════════════════════════
// GAMMA COMPANDING
// ═══════════════════════════════════════════════════════════════
function linearToGamma(v, gamma) {
  // keep out-of-gamut values stable
  if (v &lt; 0) return 0;

  if (gamma === &#x27;sRGB&#x27;) {
    return v &lt;= 0.0031308
      ? 12.92 * v
      : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  } else if (gamma === &#x27;L*&#x27;) {
    return v &lt;= 0.008856
      ? 9.033 * v
      : 1.16 * Math.pow(v, 1 / 3) - 0.16;
  }

  return Math.pow(v, 1 / gamma);
}

function clamp01(v) {
  return Math.min(1, Math.max(0, v));
}

function gammaToLinear(v, gamma) {
  if (gamma === &#x27;sRGB&#x27;) {
    return v &lt;= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  } else if (gamma === &#x27;L*&#x27;) {
    return v &lt;= 0.08 ? v/9.033 : Math.pow((v+0.16)/1.16, 3);
  }
  return Math.pow(Math.max(0, v), gamma);
}

// ═══════════════════════════════════════════════════════════════
// CIE HELPER CONSTANTS
// ═══════════════════════════════════════════════════════════════
const e = 0.008856; // actual: 216/24389
const k = 903.3;   // actual: 24389/27

function f(t) { return t &gt; e ? Math.cbrt(t) : (k*t + 16)/116; }
function finv(t) { return t &gt; 0.206897 ? t*t*t : (116*t-16)/k; }

// ═══════════════════════════════════════════════════════════════
// CONVERSION FUNCTIONS  (all using XYZ as hub, Yn=1.0)
// ═══════════════════════════════════════════════════════════════
function XYZ_to_xyY(X,Y,Z, Xn,Yn,Zn) {
  const s = X+Y+Z;
  if (s &lt; 1e-10) return [Xn/(Xn+Yn+Zn), Yn/(Xn+Yn+Zn), Y];
  return [X/s, Y/s, Y];
}
function xyY_to_XYZ(x,y,Y) {
  if (Math.abs(y) &lt; 1e-10) return [0,0,0];
  return [x*Y/y, Y, (1-x-y)*Y/y];
}
function XYZ_to_Lab(X,Y,Z, Xn,Yn,Zn) {
  const fx=f(X/Xn), fy=f(Y/Yn), fz=f(Z/Zn);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function Lab_to_XYZ(L,a,b, Xn,Yn,Zn) {
  const fy=(L+16)/116;
  return [Xn*finv(fy+a/500), Yn*finv(fy), Zn*finv(fy-b/200)];
}
function Lab_to_LCH(L,a,b) {
  const C=Math.sqrt(a*a+b*b);
  let H=Math.atan2(b,a)*180/Math.PI;
  if (H&lt;0) H+=360;
  return [L,C,H];
}
function LCH_to_Lab(L,C,H) {
  const r=H*Math.PI/180;
  return [L, C*Math.cos(r), C*Math.sin(r)];
}
function XYZ_to_Luv(X,Y,Z, Xn,Yn,Zn) {
  function uv(x,y,z){ const d=x+15*y+3*z; return d&lt;1e-10 ? [0,0] : [4*x/d, 9*y/d]; }
  const [un,vn]=uv(Xn,Yn,Zn);
  const [up,vp]=uv(X,Y,Z);
  const yr=Y/Yn;
  const L = yr&gt;e ? 116*Math.cbrt(yr)-16 : k*yr;
  return [L, 13*L*(up-un), 13*L*(vp-vn)];
}
function Luv_to_XYZ(L,u,v, Xn,Yn,Zn) {
  const d=Xn+15*Yn+3*Zn;
  const un=4*Xn/d, vn=9*Yn/d;
  const Y = L&gt;8 ? Yn*Math.pow((L+16)/116,3) : Yn*L/k;
  if (Math.abs(L)&lt;1e-10) return [0,0,0];
  const up = u/(13*L) + un;
  const vp = v/(13*L) + vn;
  const X = Y*9*up/(4*vp);
  const Z = Y*(12-3*up-20*vp)/(4*vp);
  return [X,Y,Z];
}

function XYZ_to_CCT(X,Y,Z) {
  const denom = X+15*Y+3*Z;
  if (denom &lt; 1e-10) return null;
  const up=4*X/denom, vp=6*Y/denom;
  let di=0, last=null;
  for (let i=0; i&lt;ROBERTSON.length-1; i++) {
    const {u,v,du,dv} = ROBERTSON[i];
    const {u:u2,v:v2,du:du2,dv:dv2} = ROBERTSON[i+1];
    const d1 = ((vp-v)*du-(up-u)*dv) / Math.sqrt(du*du+dv*dv);
    const d2 = ((vp-v2)*du2-(up-u2)*dv2) / Math.sqrt(du2*du2+dv2*dv2);
    if (last !== null &amp;&amp; last*d1 &lt; 0) {
      return Math.round(1e6*ROBERTSON[i].r/(1e6*ROBERTSON[i].r/ROBERTSON[i].t +
        (d1/(d1-last))*( 1e6*ROBERTSON[i].r/ROBERTSON[i-1].t - 1e6*ROBERTSON[i].r/ROBERTSON[i].t)));
    }
    last = d1;
    if (i===0 &amp;&amp; d1 &gt; 0) return null;
  }
  return null;
}

function CCT_to_xy(T) {
  // Extended valid range: 1667K – 25000K
  if (T &lt; 1667 || T &gt; 25000) return null;

  let x;

  // McCamy / Hernandez-Andres approximation
  if (T &gt;= 1667 &amp;&amp; T &lt;= 4000) {
    x =
      -0.2661239e9 / (T*T*T) -
      0.2343580e6 / (T*T) +
      0.8776956e3 / T +
      0.179910;
  } else {
    x =
      -3.0258469e9 / (T*T*T) +
      2.1070379e6 / (T*T) +
      0.2226347e3 / T +
      0.240390;
  }

  let y;

  if (T &gt;= 1667 &amp;&amp; T &lt;= 2222) {
    y =
      -1.1063814 * (x*x*x) -
      1.34811020 * (x*x) +
      2.18555832 * x -
      0.20219683;
  } else if (T &gt; 2222 &amp;&amp; T &lt;= 4000) {
    y =
      -0.9549476 * (x*x*x) -
      1.37418593 * (x*x) +
      2.09137015 * x -
      0.16748867;
  } else {
    y =
      3.0817580 * (x*x*x) -
      5.87338670 * (x*x) +
      3.75112997 * x -
      0.37001483;
  }

  return [x, y];
}

const ROWS = [

  { id:&#x27;Luv&#x27;,     label:&#x27;L*u*v*&#x27;,     fields:[&#x27;L*&#x27;,&#x27;u*&#x27;,&#x27;v*&#x27;] },

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let stale = false;
function setStale(v) {
  stale = v;
  document.getElementById(&#x27;staleNote&#x27;).classList.toggle(&#x27;visible&#x27;, v);
}

function getRefWhite() { return REF_WHITES[document.getElementById(&#x27;refWhite&#x27;).value]; }
function getRGBModel() {
  const v = document.getElementById(&#x27;rgbModel&#x27;).value;
  return RGB_MODELS[v] || RGB_MODELS[&#x27;sRGB&#x27;];
}
function getAdaptation() { return document.getElementById(&#x27;adaptation&#x27;).value; }
function getEffectiveGamma() {
  const g = document.getElementById(&#x27;gamma&#x27;).value;
  if (g === &#x27;native&#x27;) return getRGBModel().gamma;
  if (g === &#x27;1.0&#x27;) return 1.0;
  if (g === &#x27;1.8&#x27;) return 1.8;
  if (g === &#x27;2.2&#x27;) return 2.2;
  return &#x27;sRGB&#x27;;
}
function scaleXYZ() { return document.getElementById(&#x27;scaleXYZ&#x27;).checked; }
function scaleRGB() { return document.getElementById(&#x27;scaleRGB&#x27;).checked; }

function getInput(rowId, idx) {
  const el = document.querySelector(`[data-row=&quot;${rowId}&quot;][data-idx=&quot;${idx}&quot;]`);
  if (!el) return 0;
  const v = parseFloat(el.value);
  return isNaN(v) ? 0 : v;
}

function setOutput(rowId, idx, value) {
  const el = document.querySelector(`[data-row=&quot;${rowId}&quot;][data-idx=&quot;${idx}&quot;]`);
  if (!el) return;

  if (value === null || isNaN(value) || !isFinite(value)) {
    el.value = &#x27;&#x27;;
    return;
  }

  // RGB scaled to 0-255 -&gt; integer values
  if (rowId === &#x27;RGB&#x27; &amp;&amp; scaleRGB()) {
    el.value = Math.round(value);
    return;
  }

  // XYZ or Y in xyY scaled to 0-100
  if ((rowId === &#x27;XYZ&#x27; || (rowId === &#x27;xyY&#x27; &amp;&amp; idx === 2)) &amp;&amp; scaleXYZ()) {
    el.value = parseFloat(value.toFixed(2));
    return;
  }

  // Other values
  el.value = parseFloat(value.toFixed(6));
}

function clearRow(rowId) {
  [0,1,2].forEach(i =&gt; {
    const el = document.querySelector(`[data-row=&quot;${rowId}&quot;][data-idx=&quot;${i}&quot;]`);
    if (el) el.value = &#x27;&#x27;;
  });
}

function clearAll() {
  ROWS.forEach(r =&gt; clearRow(r.id));
  setStale(false);
  updateSwatch(null);
}

// ═══════════════════════════════════════════════════════════════
// MAIN CONVERT
// ═══════════════════════════════════════════════════════════════
function convert(sourceRow) {
  const [Xn,Yn,Zn] = getRefWhite();
  const model = getRGBModel();
  const adaptation = getAdaptation();
  const gamma = getEffectiveGamma();
  const xyzOutputScale = scaleXYZ() ? 100 : 1;
  const rgbOutputScale = scaleRGB() ? 255 : 1;

  // internal engine always works in 0..1 XYZ space
  const xyzInputScale = scaleXYZ() ? 100 : 1;
  const rgbInputScale = scaleRGB() ? 255 : 1;

  let X, Y, Z;

  // --- Step 1: source → XYZ ---
  if (sourceRow === &#x27;XYZ&#x27;) {
    X = getInput(&#x27;XYZ&#x27;,0)/xyzInputScale;
    Y = getInput(&#x27;XYZ&#x27;,1)/xyzInputScale;
    Z = getInput(&#x27;XYZ&#x27;,2)/xyzInputScale;
  } else if (sourceRow === &#x27;xyY&#x27;) {
    const x=getInput(&#x27;xyY&#x27;,0), y=getInput(&#x27;xyY&#x27;,1), Yv=getInput(&#x27;xyY&#x27;,2)/xyzInputScale;
    [X,Y,Z] = xyY_to_XYZ(x, y, Yv);
  } else if (sourceRow === &#x27;Lab&#x27;) {
    const [L,a,b]=[getInput(&#x27;Lab&#x27;,0),getInput(&#x27;Lab&#x27;,1),getInput(&#x27;Lab&#x27;,2)];
    [X,Y,Z] = Lab_to_XYZ(L,a,b, Xn,Yn,Zn);
  } else if (sourceRow === &#x27;Luv&#x27;) {
    const [L,u,v]=[getInput(&#x27;Luv&#x27;,0),getInput(&#x27;Luv&#x27;,1),getInput(&#x27;Luv&#x27;,2)];
    [X,Y,Z] = Luv_to_XYZ(L,u,v, Xn,Yn,Zn);
  } else if (sourceRow === &#x27;RGB&#x27;) {
    let R=getInput(&#x27;RGB&#x27;,0)/rgbInputScale, G=getInput(&#x27;RGB&#x27;,1)/rgbInputScale, Bv=getInput(&#x27;RGB&#x27;,2)/rgbInputScale;
    // linear
    R = gammaToLinear(R, gamma);
    G = gammaToLinear(G, gamma);
    Bv= gammaToLinear(Bv, gamma);
    // RGB model white
    const ws = REF_WHITES[model.white];
    const wd = [Xn,Yn,Zn];
    let rgb_xyz = [
      model.M[0][0]*R + model.M[0][1]*G + model.M[0][2]*Bv,
      model.M[1][0]*R + model.M[1][1]*G + model.M[1][2]*Bv,
      model.M[2][0]*R + model.M[2][1]*G + model.M[2][2]*Bv,
    ];
    // adapt if white differs
    if (model.white !== document.getElementById(&#x27;refWhite&#x27;).value &amp;&amp; adaptation !== &#x27;None&#x27;) {
      const AM = getChromaticAdaptationMatrix(ws, wd, adaptation);
      rgb_xyz = matMul3(AM, rgb_xyz);
    }
    [X,Y,Z] = rgb_xyz;
  } else if (sourceRow === &#x27;CCT&#x27;) {
    const T = getInput(&#x27;CCT&#x27;,0);
    const xy = CCT_to_xy(T);
    if (!xy) { clearAll(); return; }
    const [xc,yc] = xy;
    [X,Y,Z] = xyY_to_XYZ(xc, yc, 1.0);
  }

  // --- Step 2: XYZ → all ---
  // XYZ
  if (sourceRow !== &#x27;XYZ&#x27;) {
    setOutput(&#x27;XYZ&#x27;,0, X*xyzOutputScale);
    setOutput(&#x27;XYZ&#x27;,1, Y*xyzOutputScale);
    setOutput(&#x27;XYZ&#x27;,2, Z*xyzOutputScale);
  }

  // xyY
  if (sourceRow !== &#x27;xyY&#x27;) {
    const [xo,yo,Yo] = XYZ_to_xyY(X,Y,Z, Xn,Yn,Zn);
    setOutput(&#x27;xyY&#x27;,0, xo);
    setOutput(&#x27;xyY&#x27;,1, yo);
    setOutput(&#x27;xyY&#x27;,2, Yo*xyzOutputScale);
  }

  // Lab
  const [L,a,b] = XYZ_to_Lab(X,Y,Z, Xn,Yn,Zn);
  if (sourceRow !== &#x27;Lab&#x27;) {
    setOutput(&#x27;Lab&#x27;,0,L); setOutput(&#x27;Lab&#x27;,1,a); setOutput(&#x27;Lab&#x27;,2,b);
  }

  

  // Luv
  const [Luv_L,u,v] = XYZ_to_Luv(X,Y,Z, Xn,Yn,Zn);
  if (sourceRow !== &#x27;Luv&#x27;) {
    setOutput(&#x27;Luv&#x27;,0,Luv_L); setOutput(&#x27;Luv&#x27;,1,u); setOutput(&#x27;Luv&#x27;,2,v);
  }

  

  // RGB
  if (sourceRow !== &#x27;RGB&#x27;) {
    const ws = [Xn,Yn,Zn];
    const wd = REF_WHITES[model.white];
    let xyz = [X,Y,Z];
    if (model.white !== document.getElementById(&#x27;refWhite&#x27;).value &amp;&amp; adaptation !== &#x27;None&#x27;) {
      const AM = getChromaticAdaptationMatrix(ws, wd, adaptation);
      xyz = matMul3(AM, xyz);
    }
    const Mi = inv3(model.M);
    let Rl = Mi[0][0]*xyz[0]+Mi[0][1]*xyz[1]+Mi[0][2]*xyz[2];
    let Gl = Mi[1][0]*xyz[0]+Mi[1][1]*xyz[1]+Mi[1][2]*xyz[2];
    let Bl = Mi[2][0]*xyz[0]+Mi[2][1]*xyz[1]+Mi[2][2]*xyz[2];
    // Clamp out-of-gamut linear RGB before gamma companding
    Rl = clamp01(Rl);
    Gl = clamp01(Gl);
    Bl = clamp01(Bl);

    const Rc = linearToGamma(Rl, gamma);
    const Gc = linearToGamma(Gl, gamma);
    const Bc = linearToGamma(Bl, gamma);
    setOutput(&#x27;RGB&#x27;,0, Rc*rgbOutputScale);
    setOutput(&#x27;RGB&#x27;,1, Gc*rgbOutputScale);
    setOutput(&#x27;RGB&#x27;,2, Bc*rgbOutputScale);

    // swatch (clamp to [0,1])
    updateSwatch([Math.max(0,Math.min(1,Rc)), Math.max(0,Math.min(1,Gc)), Math.max(0,Math.min(1,Bc))]);
  } else {
    // compute swatch from RGB source
    const Rc=getInput(&#x27;RGB&#x27;,0)/rgbInputScale, Gc=getInput(&#x27;RGB&#x27;,1)/rgbInputScale, Bc=getInput(&#x27;RGB&#x27;,2)/rgbInputScale;
    updateSwatch([Math.max(0,Math.min(1,Rc)), Math.max(0,Math.min(1,Gc)), Math.max(0,Math.min(1,Bc))]);
  }

  // CCT
  if (sourceRow !== &#x27;CCT&#x27;) {

    const cctInput = document.querySelector(&#x27;[data-row=&quot;CCT&quot;][data-idx=&quot;0&quot;]&#x27;);

    // obliczenie chromatyczności xy
    const sum = X + Y + Z;

    if (sum &gt; 1e-10) {

      const x = X / sum;
      const y = Y / sum;

      // standardowe CCT
      const cct = XYZ_to_CCT(X, Y, Z);

      // ─────────────────────────────────────────
      // DETEKCJA PRZYBLIŻONEGO CCT
      // ─────────────────────────────────────────

      let warning = false;

      // skrajne chromatyczności
      if (
        x &lt; 0.20 || x &gt; 0.45 ||
        y &lt; 0.20 || y &gt; 0.45
      ) {
        warning = true;
      }

      // pobierz aktualny RGB
      const rgbR = parseFloat(document.querySelector(&#x27;[data-row=&quot;RGB&quot;][data-idx=&quot;0&quot;]&#x27;)?.value || 0);
      const rgbG = parseFloat(document.querySelector(&#x27;[data-row=&quot;RGB&quot;][data-idx=&quot;1&quot;]&#x27;)?.value || 0);
      const rgbB = parseFloat(document.querySelector(&#x27;[data-row=&quot;RGB&quot;][data-idx=&quot;2&quot;]&#x27;)?.value || 0);

      const rgbScale = scaleRGB() ? 255 : 1;

      const r = rgbR / rgbScale;
      const g = rgbG / rgbScale;
      const b = rgbB / rgbScale;

      const maxRGB = Math.max(r, g, b);
      const minRGB = Math.min(r, g, b);
      const saturation = maxRGB - minRGB;

      // mocno nasycone kolory = przybliżone CCT
      if (saturation &gt; 0.55) {
        warning = true;
      }

      // ─────────────────────────────────────────

      if (cct !== null &amp;&amp; isFinite(cct)) {

        cctInput.value = warning
          ? `${Math.round(cct)} ⚠`
          : `${Math.round(cct)}`;

      } else {

        cctInput.value = &#x27;— ⚠&#x27;;

      }

    } else {

      cctInput.value = &#x27;&#x27;;

    }
  }

  setStale(false);
  // highlight active
  document.querySelectorAll(&#x27;.row-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
  document.querySelector(`.row-btn[data-row=&quot;${sourceRow}&quot;]`).classList.add(&#x27;active&#x27;);
}

// ═══════════════════════════════════════════════════════════════
// SWATCH
// ═══════════════════════════════════════════════════════════════
function updateSwatch(rgb) {
  const swatch = document.getElementById(&#x27;colorSwatch&#x27;);
  const hexEl = document.getElementById(&#x27;hexDisplay&#x27;);
  const rgbEl = document.getElementById(&#x27;rgbDisplay&#x27;);
  if (!rgb) {
    swatch.style.background = &#x27;#333&#x27;;
    hexEl.textContent = &#x27;—&#x27;;
    rgbEl.textContent = &#x27;&#x27;;
    return;
  }
  const [r,g,b] = rgb;
  const ri = Math.round(r*255), gi = Math.round(g*255), bi = Math.round(b*255);
  const hex = &#x27;#&#x27; + [ri,gi,bi].map(x=&gt;x.toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;);
  swatch.style.background = hex;
  hexEl.textContent = hex.toUpperCase();
  rgbEl.textContent = `RGB: ${ri}, ${gi}, ${bi}`;
}

// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════
document.querySelectorAll(&#x27;.row-btn&#x27;).forEach(btn =&gt; {
  btn.addEventListener(&#x27;click&#x27;, () =&gt; convert(btn.dataset.row));
});
document.getElementById(&#x27;clearBtn&#x27;).addEventListener(&#x27;click&#x27;, clearAll);

// Settings change → mark stale
[&#x27;refWhite&#x27;,&#x27;rgbModel&#x27;,&#x27;adaptation&#x27;,&#x27;gamma&#x27;,&#x27;scaleXYZ&#x27;,&#x27;scaleRGB&#x27;].forEach(id =&gt; {
  document.getElementById(id).addEventListener(&#x27;change&#x27;, () =&gt; {
    setStale(true);
    // update RGB model white label
    const m = getRGBModel();
    document.getElementById(&#x27;rgbModelWhite&#x27;).textContent = &#x27;Ref: &#x27; + m.white;
  });
});

// Allow Enter on inputs
document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
  if (e.key === &#x27;Enter&#x27;) {
    const focused = document.activeElement;
    if (focused &amp;&amp; focused.dataset.row) {
      convert(focused.dataset.row);
    }
  }
});

// ── Init ──
document.getElementById(&#x27;rgbModelWhite&#x27;).textContent = &#x27;Ref: &#x27; + getRGBModel().white;

&lt;script&gt;
function exportToPDF() {
  const g = id =&gt; { const el = document.getElementById(id); return el ? el.textContent.trim() : &#x27;—&#x27;; };
  
  // Get CCT from the CCT input row
  let cct = &#x27;—&#x27;;
  const cctInput = document.querySelector(&#x27;[data-row=&quot;CCT&quot;][data-idx=&quot;0&quot;]&#x27;);
  if (cctInput &amp;&amp; cctInput.value) cct = cctInput.value + &#x27; K&#x27;;
  
  // Get hex + rgb from swatch panel
  const hexEl = document.getElementById(&#x27;hexDisplay&#x27;);
  const hex = hexEl ? hexEl.textContent.trim() : &#x27;—&#x27;;
  const rgbEl = document.getElementById(&#x27;rgbDisplay&#x27;);
  const rgb = rgbEl ? rgbEl.textContent.trim() : &#x27;—&#x27;;

  // Build swatch image from colorSwatch div background color
  let chartImage = null;
  try {
    const swatchDiv = document.getElementById(&#x27;colorSwatch&#x27;);
    const swatchColor = swatchDiv ? swatchDiv.style.background || swatchDiv.style.backgroundColor : null;
    const hexColor = hex !== &#x27;—&#x27; ? hex : (swatchColor || &#x27;#808080&#x27;);
    // Draw on offscreen canvas
    const cv = document.createElement(&#x27;canvas&#x27;);
    cv.width = 560; cv.height = 120;
    const ctx2d = cv.getContext(&#x27;2d&#x27;);
    // Background
    ctx2d.fillStyle = &#x27;#ffffff&#x27;;
    ctx2d.fillRect(0, 0, 560, 120);
    // Colour swatch block
    ctx2d.fillStyle = hexColor;
    ctx2d.beginPath();
    ctx2d.roundRect(12, 12, 200, 96, 8);
    ctx2d.fill();
    // Labels
    ctx2d.fillStyle = &#x27;#1a1c24&#x27;;
    ctx2d.font = &#x27;bold 22px Space Mono, monospace&#x27;;
    ctx2d.fillText(hexColor.toUpperCase(), 228, 46);
    ctx2d.fillStyle = &#x27;#4e5668&#x27;;
    ctx2d.font = &#x27;13px Space Mono, monospace&#x27;;
    ctx2d.fillText(rgb, 228, 72);
    if (cct !== &#x27;—&#x27;) {
      ctx2d.fillStyle = &#x27;#8b15ba&#x27;;
      ctx2d.font = &#x27;bold 13px Space Mono, monospace&#x27;;
      ctx2d.fillText(&#x27;CCT: &#x27; + cct, 228, 96);
    }
    chartImage = cv.toDataURL(&#x27;image/png&#x27;);
  } catch(e) {}

  const payload = {
    source: &#x27;CC&#x27;,
    title: &#x27;Colour Calculator&#x27;,
    data: {
      x: g(&#x27;res-x&#x27;),
      y: g(&#x27;res-y&#x27;),
      z: g(&#x27;res-z&#x27;),
      lm: g(&#x27;res-lm&#x27;),
      cct,
      hex,
      rgb,
      chartImage,
    }
  };
  window.parent.postMessage({type:&#x27;LED_TOOLS_EXPORT&#x27;, payload}, &#x27;*&#x27;);
}

    --gap: 14px;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  .app {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: var(--panel-w) 1fr;
    padding: var(--gap);
    gap: var(--gap);
  }

  /* ══ LEFT COLUMN ══ */
  .col-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .app-title {
    flex-shrink: 0;
    padding: 2px 4px;
  }

  .app-title h1 {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #e8ecf4;
    line-height: 1;
  }

  .app-title h1 .w1 { color: #ffffff; }
  .app-title h1 .w2 { color: #8b15ba; }

  /* card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
  }

  .card-header {
    padding: 8px 16px 7px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .card-header span {
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* channels */
  .channels { display: flex; flex-direction: column; }

  .channel {
    padding: 8px 16px;
    border-bottom: 1px solid #12141b;
    display: grid;
    grid-template-columns: 100px 1fr 52px 90px;
    align-items: center;
    gap: 10px;
    transition: background 0.14s;
    position: relative;
  }

  .count-control {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .count-btn {
    width: 22px; height: 22px;
    background: var(--surface3);
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, border-color 0.12s;
    flex-shrink: 0;
    padding: 0;
  }

  .count-btn:hover {
    background: var(--border2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .count-val {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-bright);
    min-width: 24px;
    text-align: center;
  }

  .count-label {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2px;
    display: block;
  }

  .channel::after {
    content: &#x27;&#x27;;
    position: absolute;
    left: 0; top: 18%; bottom: 18%;
    width: 2px;
    border-radius: 1px;
    background: var(--led-color, transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .channel:last-child { border-bottom: none; }
  .channel:hover { background: #0e1015; }
  .channel:hover::after { opacity: 0.65; }

  .channel-header { display: contents; }
  .channel-controls { display: contents; }
  .channel-cie { display: none; }

  .channel-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 400;
    color: var(--text-bright);
    white-space: nowrap;
  }

  .led-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    background: var(--border2);
    border-radius: 3px;
    cursor: pointer;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--led-color, var(--accent));
    border: 2px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 0 7px var(--led-color, var(--accent)), 0 1px 4px rgba(0,0,0,0.6);
  }

  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.16);
    box-shadow: 0 0 13px var(--led-color, var(--accent)), 0 2px 6px rgba(0,0,0,0.7);
  }

  input[type=range]::-moz-range-thumb {
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--led-color, var(--accent));
    border: 2px solid rgba(255,255,255,0.12);
    cursor: pointer;
    box-shadow: 0 0 7px var(--led-color, var(--accent));
  }

  input[type=number] {
    width: 52px;
    background: var(--surface3);
    border: 1px solid var(--border2);
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 4px;
    text-align: right;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number]:focus { border-color: var(--accent); }

  /* results */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    padding: 12px 14px 8px;
  }

  .result-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
  }

  .result-item.wide { grid-column: 1 / -1; }

  .result-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .result-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .lm-bar {
    margin-top: 4px;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .lm-bar-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 1px;
    transition: width 0.3s ease;
  }

  .json-block {
    padding: 0 14px 12px;
  }

  .json-out {
    display: block;
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 6px;
  }
  .json-out:hover { border-color: var(--accent); color: var(--text); }

  .copy-hint {
    font-size: 8px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: var(--mono);
    text-align: right;
  }

  /* ══ RIGHT COLUMN ══ */
  .col-right {
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .diagram-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .diagram-topbar {
    flex-shrink: 0;
    padding: 8px 16px 7px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .diagram-title {
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: nowrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }

  .legend-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .diagram-wrap {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--bg);
  }

  svg#cie-diagram {
    width: 100%; height: 100%;
    display: block;
  }
&lt;/style&gt;

&lt;script&gt;
const LEDS = [
  { name: &#x27;Red&#x27;,        x: 0.680, y: 0.310, lmMax: 155,  color: &#x27;#ff4444&#x27;, pwm: 255, count: 1 },
  { name: &#x27;Green&#x27;,      x: 0.210, y: 0.710, lmMax: 250,  color: &#x27;#44ee77&#x27;, pwm: 0,   count: 1 },
  { name: &#x27;Blue&#x27;,       x: 0.150, y: 0.060, lmMax: 109,  color: &#x27;#4499ff&#x27;, pwm: 255, count: 1 },
  { name: &#x27;Amber&#x27;,      x: 0.560, y: 0.430, lmMax: 203,  color: &#x27;#ffbb33&#x27;, pwm: 0,   count: 1 },
  { name: &#x27;Lime&#x27;,       x: 0.380, y: 0.580, lmMax: 500,  color: &#x27;#aaff33&#x27;, pwm: 0,   count: 1 },
  { name: &#x27;Warm White&#x27;, x: 0.433, y: 0.403, lmMax: 800,  color: &#x27;#fff0c0&#x27;, pwm: 0,   count: 1 },
  { name: &#x27;Cool White&#x27;, x: 0.313, y: 0.329, lmMax: 850,  color: &#x27;#d0eeff&#x27;, pwm: 0,   count: 1 },

function getMaxLm() { return LEDS.reduce((s, l) =&gt; s + l.lmMax * (l.count||1), 0); }

const HORSESHOE = [
  [0.1741,0.0050],[0.1740,0.0050],[0.1738,0.0049],[0.1736,0.0049],[0.1730,0.0048],
  [0.1726,0.0048],[0.1721,0.0048],[0.1714,0.0051],[0.1689,0.0102],[0.1644,0.0229],
  [0.1566,0.0533],[0.1440,0.1295],[0.1241,0.2892],[0.0913,0.5871],[0.0687,0.7218],
  [0.0754,0.7798],[0.1421,0.7671],[0.2780,0.7171],[0.4517,0.5714],[0.5939,0.4063],
  [0.6900,0.3100],[0.7347,0.2653],[0.7347,0.2653],[0.7076,0.2924],[0.6413,0.3587],
  [0.5780,0.4220],[0.5130,0.4870],[0.4480,0.4520],[0.4073,0.3927],[0.3713,0.3713],
  [0.3430,0.3580],[0.3120,0.3290],[0.2740,0.2780],[0.2270,0.2100],[0.1904,0.1368],
  [0.1749,0.0595],[0.1741,0.0050],
];

const PLANCK = [
  [0.4476,0.4074,2000],[0.4166,0.3732,2500],[0.3805,0.3769,3000],[0.3499,0.3656,3500],
  [0.3220,0.3518,4000],[0.2998,0.3391,4500],[0.2847,0.3356,5000],[0.2737,0.3240,5500],
  [0.2650,0.3215,6000],[0.2579,0.3154,6500],[0.2525,0.3107,7000],[0.2483,0.3071,7500],
  [0.2451,0.3048,8000],
];

// Build sliders
const container = document.getElementById(&#x27;channels-container&#x27;);
LEDS.forEach((led, i) =&gt; {
  const div = document.createElement(&#x27;div&#x27;);
  div.className = &#x27;channel&#x27;;
  div.style.setProperty(&#x27;--led-color&#x27;, led.color);
  div.innerHTML = `
    &lt;div class=&quot;channel-header&quot;&gt;
      &lt;div class=&quot;channel-name&quot;&gt;
        &lt;div class=&quot;led-dot&quot; style=&quot;background:${led.color};box-shadow:0 0 5px ${led.color}77&quot;&gt;&lt;/div&gt;
        ${led.name}
      &lt;/div&gt;
      &lt;div class=&quot;channel-cie&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;channel-controls&quot;&gt;
      &lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;255&quot; value=&quot;${led.pwm}&quot; id=&quot;range-${i}&quot;
        style=&quot;--led-color:${led.color}&quot; oninput=&quot;syncInput(${i},this.value)&quot;&gt;
      &lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;255&quot; value=&quot;${led.pwm}&quot; id=&quot;num-${i}&quot;
        oninput=&quot;syncRange(${i},this.value)&quot;&gt;
    &lt;/div&gt;
    &lt;div class=&quot;count-control&quot;&gt;
      &lt;button class=&quot;count-btn&quot; onclick=&quot;changeCount(${i},-1)&quot;&gt;−&lt;/button&gt;
      &lt;span class=&quot;count-val&quot; id=&quot;count-${i}&quot;&gt;1&lt;/span&gt;
      &lt;button class=&quot;count-btn&quot; onclick=&quot;changeCount(${i},+1)&quot;&gt;+&lt;/button&gt;

  container.appendChild(div);
});

// Legend
const legend = document.getElementById(&#x27;legend&#x27;);
LEDS.forEach(led =&gt; {
  const item = document.createElement(&#x27;div&#x27;);
  item.className = &#x27;legend-item&#x27;;
  item.innerHTML = `&lt;div class=&quot;legend-dot&quot; style=&quot;background:${led.color}&quot;&gt;&lt;/div&gt;${led.name}`;
  legend.appendChild(item);
});

function syncInput(i, v) {
  v = Math.min(255, Math.max(0, parseInt(v)||0));
  LEDS[i].pwm = v;
  document.getElementById(`num-${i}`).value = v;
  update();
}

function syncRange(i, v) {
  v = Math.min(255, Math.max(0, parseInt(v)||0));
  LEDS[i].pwm = v;
  document.getElementById(`range-${i}`).value = v;
  update();
}

function changeCount(i, delta) {
  LEDS[i].count = Math.max(1, Math.min(99, (LEDS[i].count || 1) + delta));
  document.getElementById(`count-${i}`).textContent = LEDS[i].count;
  update();
}

function calcMixture() {
  let wx=0, wy=0, totalLm=0;
  LEDS.forEach(led =&gt; {
    const lm = led.lmMax * (led.pwm/255) * (led.count || 1);
    wx += led.x * lm; wy += led.y * lm; totalLm += lm;
  });
  if (totalLm===0) return {x:null,y:null,z:null,lm:0};
  const x=wx/totalLm, y=wy/totalLm;
  return {x, y, z:1-x-y, lm:totalLm};
}

function update() {
  const {x,y,z,lm} = calcMixture();
  if (x===null) {
    [&#x27;res-x&#x27;,&#x27;res-y&#x27;,&#x27;res-z&#x27;,&#x27;res-json&#x27;].forEach(id=&gt;document.getElementById(id).textContent=&#x27;—&#x27;);
    document.getElementById(&#x27;res-lm&#x27;).textContent=&#x27;—&#x27;;
    document.getElementById(&#x27;lm-bar-fill&#x27;).style.width=&#x27;0%&#x27;;
    drawDiagram(null); return;
  }
  document.getElementById(&#x27;res-x&#x27;).textContent = x.toFixed(4);
  document.getElementById(&#x27;res-y&#x27;).textContent = y.toFixed(4);
  document.getElementById(&#x27;res-z&#x27;).textContent = z.toFixed(4);
  document.getElementById(&#x27;res-lm&#x27;).textContent = Math.round(lm)+&#x27; lm&#x27;;
  document.getElementById(&#x27;lm-bar-fill&#x27;).style.width = Math.min(100,lm/getMaxLm()*100)+&#x27;%&#x27;;
  document.getElementById(&#x27;res-json&#x27;).textContent =
    `{&quot;x&quot;:&quot;${x.toFixed(4)}&quot;,&quot;y&quot;:&quot;${y.toFixed(4)}&quot;,&quot;lm&quot;:&quot;${Math.round(lm)}&quot;}`;
  drawDiagram({x,y});
}

// CIE Diagram
const SVG_NS = &#x27;http://www.w3.org/2000/svg&#x27;;
const svg = document.getElementById(&#x27;cie-diagram&#x27;);
const PAD={l:40,r:14,t:14,b:32}, VW=620-PAD.l-PAD.r, VH=520-PAD.t-PAD.b;
const X_MIN=0.05, X_MAX=0.78, Y_MIN=0.0, Y_MAX=0.85;

function toSvg(cx,cy) {
  return [PAD.l+(cx-X_MIN)/(X_MAX-X_MIN)*VW, PAD.t+(1-(cy-Y_MIN)/(Y_MAX-Y_MIN))*VH];
}

function mkEl(tag,attrs) {
  const el=document.createElementNS(SVG_NS,tag);
  for(const[k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

function buildDiagramBase() {
  svg.innerHTML=&#x27;&#x27;;
  svg.appendChild(mkEl(&#x27;rect&#x27;,{x:0,y:0,width:620,height:520,fill:&#x27;#ffffff&#x27;}));
  const defs=mkEl(&#x27;defs&#x27;,{});

  const lg=mkEl(&#x27;linearGradient&#x27;,{id:&#x27;cie-fill&#x27;,x1:&#x27;0%&#x27;,y1:&#x27;100%&#x27;,x2:&#x27;100%&#x27;,y2:&#x27;0%&#x27;});
  [[&#x27;0%&#x27;,&#x27;#2828bb&#x27;],[&#x27;18%&#x27;,&#x27;#006ecc&#x27;],[&#x27;36%&#x27;,&#x27;#00cc77&#x27;],[&#x27;55%&#x27;,&#x27;#77dd00&#x27;],
   [&#x27;72%&#x27;,&#x27;#ccbb00&#x27;],[&#x27;85%&#x27;,&#x27;#dd4400&#x27;],[&#x27;100%&#x27;,&#x27;#cc0000&#x27;]].forEach(([off,col])=&gt;{
    lg.appendChild(mkEl(&#x27;stop&#x27;,{offset:off,&#x27;stop-color&#x27;:col,&#x27;stop-opacity&#x27;:&#x27;0.14&#x27;}));
  });
  defs.appendChild(lg);

  const gf=mkEl(&#x27;filter&#x27;,{id:&#x27;glow&#x27;});
  gf.appendChild(mkEl(&#x27;feGaussianBlur&#x27;,{stdDeviation:&#x27;3&#x27;,result:&#x27;blur&#x27;}));
  const fm=mkEl(&#x27;feMerge&#x27;,{});

    t.textContent=gx.toFixed(1); svg.appendChild(t);

  for(let gy=0.1;gy&lt;=0.8;gy+=0.1){

function drawDiagram(mixPt) {
  buildDiagramBase();
  if(!mixPt) return;
  const[sx,sy]=toSvg(mixPt.x,mixPt.y);
  const[ax,ay]=toSvg(X_MIN,mixPt.y),[bx,by]=toSvg(X_MAX,mixPt.y);
  const[cx2,cy2]=toSvg(mixPt.x,Y_MIN),[dx2,dy2]=toSvg(mixPt.x,Y_MAX);
  svg.appendChild(mkEl(&#x27;line&#x27;,{x1:ax,y1:ay,x2:bx,y2:by,stroke:&#x27;#8b15ba&#x27;,&#x27;stroke-width&#x27;:&#x27;0.5&#x27;,opacity:&#x27;0.22&#x27;}));
  svg.appendChild(mkEl(&#x27;line&#x27;,{x1:cx2,y1:cy2,x2:dx2,y2:dy2,stroke:&#x27;#8b15ba&#x27;,&#x27;stroke-width&#x27;:&#x27;0.5&#x27;,opacity:&#x27;0.22&#x27;}));
  LEDS.forEach(led=&gt;{
    if(led.pwm&gt;0){
      const[lx,ly]=toSvg(led.x,led.y);
      svg.appendChild(mkEl(&#x27;line&#x27;,{x1:sx,y1:sy,x2:lx,y2:ly,stroke:led.color,&#x27;stroke-width&#x27;:&#x27;1&#x27;,opacity:&#x27;0.2&#x27;}));
    }
  });
  svg.appendChild(mkEl(&#x27;circle&#x27;,{cx:sx,cy:sy,r:14,fill:&#x27;#8b15ba&#x27;,opacity:&#x27;0.06&#x27;,filter:&#x27;url(#glow2)&#x27;}));
  svg.appendChild(mkEl(&#x27;circle&#x27;,{cx:sx,cy:sy,r:5,fill:&#x27;#8b15ba&#x27;,stroke:&#x27;#ffffff&#x27;,&#x27;stroke-width&#x27;:&#x27;2&#x27;,filter:&#x27;url(#glow)&#x27;}));
  const lbl=mkEl(&#x27;text&#x27;,{x:sx+10,y:sy-8,fill:&#x27;#8b15ba&#x27;,&#x27;font-size&#x27;:&#x27;9.5&#x27;,&#x27;font-family&#x27;:&#x27;Space Mono&#x27;,&#x27;font-weight&#x27;:&#x27;700&#x27;});
  lbl.textContent=`(${mixPt.x.toFixed(4)}, ${mixPt.y.toFixed(4)})`; svg.appendChild(lbl);
}
