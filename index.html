        <path d='M10.5 1.5v3h-3' stroke='currentColor' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/>
      </svg>
      Odśwież dane
    </button>
    <button class='btn btn-primary' onclick='generatePDF()'>
      <svg width='12' height='12' viewBox='0 0 12 12' fill='none'>

        <path d='M4 5.5h4M4 7.5h2.5' stroke='currentColor' stroke-width='1.2' stroke-linecap='round'/>

</div>

<!-- BODY: sidebar + preview -->
<div class='rpt-body'>

  <!-- ── SIDEBAR ── -->
  <div class='rpt-sidebar'>

    <!-- Project info -->
    <div class='section'>
      <div class='section-header'>
        <svg width='10' height='10' viewBox='0 0 10 10' fill='none'>
          <rect x='0.5' y='0.5' width='9' height='9' rx='1.5' stroke='currentColor' stroke-width='1.2'/>
          <path d='M3 5h4M3 3h4M3 7h2' stroke='currentColor' stroke-width='1.2' stroke-linecap='round'/>
        </svg>
        Informacje o projekcie
      </div>
      <div class='section-body'>
        <div class='field-row'>
          <div class='field-label'>Nazwa projektu</div>
          <input class='field-input' id='proj-name' type='text' placeholder='np. BCentrum LED Panel' value='LED Measurement Report'>
        </div>
        <div class='field-row'>
          <div class='field-label'>Autor / firma</div>
          <input class='field-input' id='proj-author' type='text' placeholder='np. kondz10 Lab' value=''>
        </div>
        <div class='field-row'>
          <div class='field-label'>Numer próbki / ID</div>
          <input class='field-input' id='proj-id' type='text' placeholder='np. SMP-001' value=''>
        </div>
      </div>
    </div>

    <!-- What to include -->
    <div class='section'>
      <div class='section-header'>
        <svg width='10' height='10' viewBox='0 0 10 10' fill='none'>
          <path d='M1.5 5l2.5 2.5 4.5-4.5' stroke='currentColor' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>
        </svg>
        Zawartość raportu
      </div>
      <div class='section-body' id='content-opts'>
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Source notice -->
    <div class='source-notice'>
      <strong>Źródło danych:</strong><br>
      Dane są pobierane automatycznie z aktywnych okien aplikacji:<br>
      CRI Analyzer · Colour Calculator · Colour Mixer · SA Spectral Analyzer.<br>
      Kliknij <em>Odśwież dane</em> po zmianie parametrów w innych zakładkach.
    </div>

    <!-- Refresh status -->
    <div id='data-status' style='font-size:10px;color:#4e5668;font-family:var(--mono);letter-spacing:0.06em;text-align:center;'></div>

  </div>

  <!-- ── PREVIEW ── -->
  <div class='rpt-preview-area'>
    <div id='preview-label' style='font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#3a4050;margin-bottom:12px;'>Podgląd raportu — A4</div>
    <div id='preview-page'>
      <!-- filled by buildPreview() -->
    </div>
    <div style='margin-top:12px;font-family:var(--mono);font-size:9px;color:#2a2f3a;letter-spacing:0.1em;'>794 × 1123 px · A4 · do druku</div>
  </div>

</div>

<!-- HIDDEN PRINT ROOT -->
<div id='print-root'></div>

<script>
// ─── CONTENT OPTIONS ───────────────────────────────────────────
const OPTS = [
  { id:'opt-rgb',     label:'Wartości RGB + swatch koloru',                          badge:'SA',  def:true  },
  { id:'opt-metrics', label:'Metryki (peak, temp, sygnał, kalibracja)',               badge:'SA',  def:true  },
  { id:'opt-chart',   label:'Wykres spektralny (canvas → obraz)',                     badge:'SA',  def:true  },
  { id:'opt-rawdata', label:'Dane surowe (tabela punktów)',                            badge:'SA',  def:true  },
  { id:'opt-cri',     label:'Wyniki CRI + indeksy R1–R15',                            badge:'CRI', def:true  },
  { id:'opt-calc',    label:'Wyniki Colour Calculator',                                badge:'CC',  def:true  },
  { id:'opt-mixer',   label:'Konfiguracja Colour Mixer / Mixer',                      badge:'CM',  def:true  },
];

const optContainer = document.getElementById('content-opts');
OPTS.forEach(o => {
  const row = document.createElement('div');
  row.className = 'opt-row' + (o.def ? ' checked' : '');
  row.id = o.id + '-row';
  row.innerHTML = \`
    <div class='opt-check'>\${o.def ? '✓' : ''}</div>
    <div class='opt-label'>\${o.label}</div>
    <div class='opt-badge'>\${o.badge}</div>
  \`;
  row.onclick = () => toggleOpt(o.id);
  optContainer.appendChild(row);
});

function toggleOpt(id) {
  const row = document.getElementById(id + '-row');
  const isChecked = row.classList.contains('checked');
  if (isChecked) {
    row.classList.remove('checked');
    row.querySelector('.opt-check').textContent = '';
  } else {
    row.classList.add('checked');
    row.querySelector('.opt-check').textContent = '✓';
  }
  buildPreview();
}

function isChecked(id) {
  return document.getElementById(id + '-row').classList.contains('checked');
}

// ─── LIVE DATA STORE ───────────────────────────────────────────
let LIVE = {
  sa: null,   // spectral analyzer data
  cri: null,  // CRI results
  cc: null,   // colour calculator results
  cm: null,   // colour mixer results
};

// ─── COLLECT DATA FROM PARENT iframes (via postMessage) ────────
let _refreshPending = false;
let _refreshTimer = null;

function refreshData() {
  const status = document.getElementById('data-status');
  status.textContent = '↻ pobieranie danych…';
  status.style.color = '#4e5668';

  // Request data from parent via postMessage
  try {
    window.parent.postMessage({ type: 'LED_TOOLS_REQUEST_DATA' }, '*');
  } catch(e) {
    // Fallback: try direct DOM access (same-origin file:// context)
    _refreshDirect();
  }

  // Timeout fallback if no postMessage response after 600ms
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(() => {
    _refreshDirect();
  }, 600);
}

// Listen for data from parent
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'LED_TOOLS_DATA') return;
  clearTimeout(_refreshTimer);
  const d = e.data;
  if (d.sa)  LIVE.sa  = d.sa;
  if (d.cri) LIVE.cri = d.cri;
  if (d.cc)  LIVE.cc  = d.cc;
  if (d.cm)  LIVE.cm  = d.cm;
  _updateStatus();
  buildPreview();
});

function _refreshDirect() {
  try {
    const parentDoc = window.parent.document;

    // ── SA: Spectral Analyzer (win3) ──
    const win3 = parentDoc.getElementById('win3');
    if (win3) {
      try {
        const saDoc = win3.querySelector('iframe').contentDocument;
        const r = saDoc.getElementById('rv')?.textContent;
        const g = saDoc.getElementById('gv')?.textContent;
        const b = saDoc.getElementById('bv')?.textContent;
        const hex = saDoc.getElementById('hexval')?.textContent;
        const mInteg = saDoc.getElementById('m-integ')?.textContent;
        const mPeakWl = saDoc.getElementById('m-peakwl')?.textContent;
        const mPeakVal = saDoc.getElementById('m-peakval')?.textContent;
        const mTemp = saDoc.getElementById('m-temp')?.textContent;
        const mSig = saDoc.getElementById('m-sig')?.textContent;
        const mCal = saDoc.getElementById('m-cal')?.textContent;
        const mDate = saDoc.getElementById('meas-date')?.textContent;
        const mTime = saDoc.getElementById('meas-time')?.textContent;
        const fname = saDoc.getElementById('fname')?.textContent;
        const canvas = saDoc.getElementById('chart');

        let chartImg = null;
        if (canvas && canvas.width > 0) {
          try { chartImg = canvas.toDataURL('image/png'); } catch(e){}
        }

        let rawPoints = [];
        if (canvas && canvas._vis) rawPoints = canvas._vis.slice(0, 200);

        if (r || g || b) {
          LIVE.sa = { r, g, b, hex, mInteg, mPeakWl, mPeakVal, mTemp, mSig, mCal, mDate, mTime, fname, chartImg, rawPoints };
        }
      } catch(e) { console.warn('SA data failed:', e); }
    }

    // ── CRI: Colour Analyzer (win0) ──
    const win0 = parentDoc.getElementById('win0');
    if (win0) {
      try {
        const criDoc = win0.querySelector('iframe').contentDocument;
        const criVal = criDoc.getElementById('criVal')?.textContent;
        const riCells = criDoc.querySelectorAll('#riGrid .ri-cell');
        const riData = [];
        riCells.forEach((cell, i) => {
          const label = cell.querySelector('.ri-cell-label')?.textContent || ('R'+(i+1));
          const val = cell.querySelector('.ri-cell-val')?.textContent || '—';
          const color = cell.querySelector('.ri-cell-val')?.style?.color || '#374151';
          riData.push({ label, val, color });
        });
        if (criVal && criVal !== '—') {
          LIVE.cri = { criVal, riData };
        }
      } catch(e) { console.warn('CRI data failed:', e); }
    }

    // ── CC: Colour Calculator (win1) ──
    const win1 = parentDoc.getElementById('win1');
    if (win1) {
      try {
        const ccDoc = win1.querySelector('iframe').contentDocument;
        const resX = ccDoc.getElementById('res-x')?.textContent;
        const resY = ccDoc.getElementById('res-y')?.textContent;
        const resZ = ccDoc.getElementById('res-z')?.textContent;
        const resLm = ccDoc.getElementById('res-lm')?.textContent;
        if (resX && resX !== '—') LIVE.cc = { resX, resY, resZ, resLm };
      } catch(e) { console.warn('CC data failed:', e); }
    }

    // ── CM: Colour Mixer (win2) ──
    const win2 = parentDoc.getElementById('win2');
    if (win2) {
      try {
        const cmDoc = win2.querySelector('iframe').contentDocument;
        const channels = cmDoc.querySelectorAll('.channel');
        const leds = [];
        channels.forEach((ch, i) => {
          const name = ch.querySelector('.channel-name')?.textContent?.trim() || '';
          const dot = ch.querySelector('.led-dot');
          const color = dot?.style?.background || '#888';
          const rangeInput = ch.querySelector('input[type=range]');
          const numInput = ch.querySelector('input[type=number]');
          const countEl = ch.querySelector('.count-val');
          const pwm = rangeInput?.value || numInput?.value || '0';
          const count = countEl?.textContent || '1';
          if (parseInt(pwm) > 0) leds.push({ name: name.replace(/^\s*\S+\s*/, ''), color, pwm, count });
        });
        const resX = cmDoc.getElementById('res-x')?.textContent;
        const resY = cmDoc.getElementById('res-y')?.textContent;
        const resZ = cmDoc.getElementById('res-z')?.textContent;
        const resLm = cmDoc.getElementById('res-lm')?.textContent;
        if (leds.length > 0) LIVE.cm = { leds, resX, resY, resZ, resLm };
      } catch(e) { console.warn('CM data failed:', e); }
    }

  } catch(e) {
    console.warn('Direct DOM access failed (cross-origin):', e.message);
  }

  _updateStatus();
  buildPreview();
}

function _updateStatus() {
  const status = document.getElementById('data-status');
  const count = [LIVE.sa, LIVE.cri, LIVE.cc, LIVE.cm].filter(Boolean).length;
  if (count > 0) {
    status.textContent = \`✓ Pobrano dane z \${count}/4 modułów · \${new Date().toLocaleTimeString('pl-PL')}\`;
    status.style.color = '#3da83d';
  } else {
    status.textContent = \`⚠ Brak danych — otwórz inne zakładki i odśwież · \${new Date().toLocaleTimeString('pl-PL')}\`;
    status.style.color = '#e8c45b';
  }
}

// ─── BUILD PREVIEW ─────────────────────────────────────────────
function buildPreview() {
  const page = document.getElementById('preview-page');
  const projName = document.getElementById('proj-name').value || 'LED Measurement Report';
  const projAuthor = document.getElementById('proj-author').value || '';
  const projId = document.getElementById('proj-id').value || '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('pl-PL', { year:'numeric', month:'long', day:'numeric' });
  const timeStr = now.toLocaleTimeString('pl-PL', { hour:'2-digit', minute:'2-digit' });

  let html = \`
    <div class='rp-header'>
      <div>
        <div class='rp-logo-text'>LED<span> Tools</span></div>
        <div class='rp-report-type'>Measurement Report</div>
        \${projName ? \`<div style='font-family:Space Mono,monospace;font-size:13px;font-weight:700;color:#fff;margin-top:8px;'>\${escHtml(projName)}</div>\` : ''}
      </div>
      <div class='rp-meta-block'>
        <div class='rp-meta-label'>Data raportu</div>
        <div class='rp-meta-val'>\${dateStr} \${timeStr}</div>
        \${projAuthor ? \`<div class='rp-meta-label' style='margin-top:6px;'>Autor</div><div class='rp-meta-val'>\${escHtml(projAuthor)}</div>\` : ''}
        \${projId ? \`<div class='rp-meta-label' style='margin-top:6px;'>ID próbki</div><div class='rp-meta-val'>\${escHtml(projId)}</div>\` : ''}
        \${LIVE.sa?.fname ? \`<div class='rp-meta-label' style='margin-top:6px;'>Plik</div><div class='rp-meta-val' style='font-size:9px;'>\${escHtml(LIVE.sa.fname)}</div>\` : ''}
      </div>
    </div>
    <div class='rp-divider'></div>
    <div class='rp-body'>
  \`;

  // ── RGB SECTION ──
  if (isChecked('opt-rgb') && LIVE.sa) {
    const sa = LIVE.sa;
    const r = sa.r || '0', g = sa.g || '0', b = sa.b || '0';
    const hex = sa.hex || '#000000';
    html += \`
      <div>
        <div class='rp-section-title'>Kolor wynikowy — RGB</div>
        <div class='rp-rgb-row'>
          <div class='rp-swatch' style='background:\${hex};'></div>
          <div class='rp-rgb-values'>
            <div class='rp-rgb-chip' style='border-top:3px solid #ef4444;'>
              <div class='rp-chip-label'>Red</div>
              <div class='rp-chip-val' style='color:#dc2626;'>\${r}</div>
              <div class='rp-chip-sub'>0–255</div>
            </div>
            <div class='rp-rgb-chip' style='border-top:3px solid #22c55e;'>
              <div class='rp-chip-label'>Green</div>
              <div class='rp-chip-val' style='color:#16a34a;'>\${g}</div>
              <div class='rp-chip-sub'>0–255</div>
            </div>
            <div class='rp-rgb-chip' style='border-top:3px solid #3b82f6;'>
              <div class='rp-chip-label'>Blue</div>
              <div class='rp-chip-val' style='color:#2563eb;'>\${b}</div>
              <div class='rp-chip-sub'>0–255</div>
            </div>
          </div>
          <div style='display:flex;flex-direction:column;gap:6px;align-items:flex-end;'>
            <div class='rp-hex-badge'>\${hex}</div>
            <div style='font-size:9px;color:#6b7280;font-family:Space Mono,monospace;'>rgb(\${r},\${g},\${b})</div>
          </div>
        </div>
      </div>
    \`;
  }

  // ── METRICS SECTION ──
  if (isChecked('opt-metrics') && LIVE.sa) {
    const sa = LIVE.sa;
    const metrics = [
      { label:'Peak λ', val: sa.mPeakWl || '—', unit:'' },
      { label:'Peak wartość', val: sa.mPeakVal || '—', unit:'' },
      { label:'Temperatura', val: sa.mTemp || '—', unit:'' },
      { label:'Poziom sygnału', val: sa.mSig || '—', unit:'' },
      { label:'Czas int.', val: sa.mInteg || '—', unit:'' },
      { label:'Kalibracja', val: sa.mCal || '—', unit:'' },
    ];
    html += \`
      <div>
        <div class='rp-section-title'>Metryki pomiaru spektralnego</div>
        <div class='rp-metrics-grid'>
          \${metrics.map(m => \`
            <div class='rp-metric-card'>
              <div class='rp-metric-label'>\${m.label}</div>
              <div class='rp-metric-val'>\${escHtml(m.val)} <span class='rp-metric-unit'>\${m.unit}</span></div>
            </div>
          \`).join('')}
        </div>
        \${(sa.mDate || sa.mTime) ? \`<div style='margin-top:8px;font-size:9px;color:#9ca3af;font-family:Space Mono,monospace;'>Pomiar: \${sa.mDate || ''} \${sa.mTime || ''}</div>\` : ''}
      </div>
    \`;
  }

  // ── CHART SECTION ──
  if (isChecked('opt-chart') && LIVE.sa?.chartImg) {
    html += \`
      <div>
        <div class='rp-section-title'>Rozkład widmowy (380–760 nm)</div>
        <div class='rp-chart-box'>
          <img src='\${LIVE.sa.chartImg}' style='width:100%;border-radius:5px;display:block;' alt='Spektrum'>
        </div>
      </div>
    \`;
  } else if (isChecked('opt-chart') && !LIVE.sa?.chartImg) {
    html += \`
      <div>
        <div class='rp-section-title'>Rozkład widmowy</div>
        <div style='background:#f9fafb;border:1px dashed #e5e7eb;border-radius:6px;padding:20px;text-align:center;color:#9ca3af;font-size:10px;font-family:Space Mono,monospace;'>
          Brak danych wykresu — otwórz SA Spectral Analyzer i wczytaj plik
        </div>
      </div>
    \`;
  }

  // ── CRI SECTION ──
  if (isChecked('opt-cri') && LIVE.cri) {
    const cri = LIVE.cri;
    const criNum = parseInt(cri.criVal) || 0;
    const criColor = criNum >= 90 ? '#16a34a' : criNum >= 80 ? '#ca8a04' : '#dc2626';
    html += \`
      <div>
        <div class='rp-section-title'>Wyniki CRI — Color Rendering Index</div>
        <div class='rp-cri-row'>
          <div style='flex-shrink:0;'>
            <div style='font-size:9px;font-family:Space Mono,monospace;color:#9ca3af;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;'>Ra (CRI)</div>
            <div class='rp-cri-big' style='color:\${criColor};'>\${cri.criVal}</div>
            <div style='font-size:9px;color:#6b7280;margin-top:4px;'>R1–R8 średnia</div>

// ─── HELPERS ──────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function riBgColor(val) {
  const n = parseInt(val);
  if (isNaN(n) || val === '—') return '#6b7280';
  if (n >= 90) return '#16a34a';
  if (n >= 80) return '#ca8a04';
  if (n >= 70) return '#d97706';
  return '#dc2626';
}

<div id="restore-bar">

</div>

<script>
const APPS = [
  { id:'win0', badge:'CRI', title:'Colour Analyzer'   },
  { id:'win1', badge:'CC',  title:'Colour Calculator' },
  { id:'win2', badge:'CM',  title:'Colour Mixer'      },
  { id:'win3', badge:'SA',  title:'SA Spectral Analyzer' },
  { id:'win4', badge:'PDF', title:'Report Generator'  },
];

let currentMode = 'tabs';
let activeTab   = 0;
let closedWins  = new Set();
let maximized   = null;
let savedGeom   = {};
let zTop        = 10;

// ── MODE ──
function setMode(mode) {
  currentMode = mode;
  const ws   = document.getElementById('workspace');
  const ts   = document.getElementById('tab-strip');
  const hint = document.getElementById('hint');

  // remove all mode classes
  ws.classList.remove('tabs-mode','free-mode','tiled-mode');
  ts.classList.remove('visible');

  if (mode === 'tabs') {
    ws.classList.add('tabs-mode');
    ts.classList.add('visible');
    hint.classList.remove('visible');
    // ensure active tab shown
    activateTab(activeTab);
  } else if (mode === 'free') {
    ws.classList.add('free-mode');
    hint.classList.add('visible');
    // cascade open windows
    let ci = 0;
    APPS.forEach((a) => {
      const w = document.getElementById(a.id);
      if (w.classList.contains('closed')) return;
      w.classList.remove('tab-active');
      w.style.left   = (30 + ci * 30) + 'px';
      w.style.top    = (20 + ci * 25) + 'px';
      w.style.width  = '860px';
      w.style.height = '560px';
      ci++;
    });
  } else { // tiled
    ws.classList.add('tiled-mode');
    hint.classList.remove('visible');
    APPS.forEach(a => document.getElementById(a.id).classList.remove('tab-active'));
  }

  ['free','tabs','tiled'].forEach(m =>
    document.getElementById('btn-'+m).classList.toggle('active', m === mode)
  );
}

// ── TABS ──
function activateTab(idx) {
  activeTab = idx;
  document.querySelectorAll('.tab-pill').forEach((p,i) => p.classList.toggle('active', i===idx));
  APPS.forEach((a,i) => document.getElementById(a.id).classList.toggle('tab-active', i===idx));
}

// ── CLOSE / RESTORE ──
function closeWin(id) {
  document.getElementById(id).classList.add('closed');
  closedWins.add(id);
  updateRestoreBar();
  if (currentMode === 'tabs') {
    const idx  = APPS.findIndex(a => a.id === id);
    const next = APPS.find((a,i) => i !== idx && !closedWins.has(a.id));
    if (next) activateTab(APPS.indexOf(next));
  }
}
function restoreWin(id) {
  document.getElementById(id).classList.remove('closed');
  closedWins.delete(id);
  updateRestoreBar();
  if (currentMode === 'tabs') activateTab(APPS.findIndex(a => a.id === id));
}
function updateRestoreBar() {
  const bar = document.getElementById('restore-bar');
  bar.querySelectorAll('.restore-chip').forEach(c => c.remove());
  closedWins.forEach(id => {
    const app  = APPS.find(a => a.id === id);
    const chip = document.createElement('div');
    chip.className = 'restore-chip';
    chip.innerHTML = `<span style="color:var(--accent);font-size:8px;">${app.badge}</span> ${app.title}`;
    chip.onclick = () => restoreWin(id);
    bar.appendChild(chip);
  });
  bar.className = closedWins.size > 0 ? 'visible' : '';
}

// ── MAXIMIZE ──
function maximizeWin(id) {
  if (currentMode !== 'free') return;
  const w  = document.getElementById(id);
  const ws = document.getElementById('workspace');
  if (maximized === id) {
    const g = savedGeom[id];
    Object.assign(w.style, g);
    maximized = null;
  } else {
    if (maximized) {
      const prev = document.getElementById(maximized);
      Object.assign(prev.style, savedGeom[maximized]);
    }
    savedGeom[id] = { left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height };
    w.style.left   = '0';
    w.style.top    = '0';
    w.style.width  = ws.clientWidth  + 'px';
    w.style.height = ws.clientHeight + 'px';
    maximized = id;
    bringToFront(w);
  }
}

// ── Z-ORDER ──
function bringToFront(el) { el.style.zIndex = ++zTop; }

// ── DRAG ──
let drag = null;
function startDrag(e, id) {
  if (currentMode !== 'free') return;
  if (e.button !== 0) return;
  if (e.target.closest('.win-btns')) return;
  e.preventDefault();
  const w    = document.getElementById(id);
  const rect = w.getBoundingClientRect();
  bringToFront(w);
  drag = { el: w, ox: e.clientX - rect.left, oy: e.clientY - rect.top };
  w.classList.add('dragging');
  document.getElementById('workspace').classList.add('drag-active');
}
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const ws = document.getElementById('workspace');
  const wr = ws.getBoundingClientRect();
  let x = e.clientX - wr.left - drag.ox;
  let y = e.clientY - wr.top  - drag.oy;
  x = Math.max(-drag.el.offsetWidth + 80, Math.min(wr.width  - 80, x));
  y = Math.max(0, Math.min(wr.height - 36, y));
  drag.el.style.left = x + 'px';
  drag.el.style.top  = y + 'px';
});
document.addEventListener('mouseup', () => {
  if (!drag) return;
  drag.el.classList.remove('dragging');
  document.getElementById('workspace').classList.remove('drag-active');
  drag = null;
});

// ── RESIZE ──
let resz = null;
function startResize(e, id) {
  if (currentMode !== 'free') return;
  e.preventDefault(); e.stopPropagation();
  const w    = document.getElementById(id);
  const rect = w.getBoundingClientRect();
  bringToFront(w);
  resz = { el: w, sx: e.clientX, sy: e.clientY, sw: rect.width, sh: rect.height };
  w.classList.add('resizing');
}
document.addEventListener('mousemove', e => {
  if (!resz) return;
  resz.el.style.width  = Math.max(280, resz.sw + e.clientX - resz.sx) + 'px';
  resz.el.style.height = Math.max(180, resz.sh + e.clientY - resz.sy) + 'px';
});
document.addEventListener('mouseup', () => {
  if (!resz) return;
  resz.el.classList.remove('resizing');
  resz = null;
});

// ── BRING TO FRONT ON CLICK ──
document.querySelectorAll('.win').forEach(w => {
  w.addEventListener('mousedown', () => { if (currentMode === 'free') bringToFront(w); }, true);
});

// init
setMode('tabs');

// ── POSTMESSAGE: serve data to win4 Report Generator ──
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'LED_TOOLS_REQUEST_DATA') return;
  const win4 = document.getElementById('win4');
  if (!win4) return;
  const reportFrame = win4.querySelector('iframe');
  if (!reportFrame) return;

  const data = { type: 'LED_TOOLS_DATA' };

  // ── SA data ──
  try {
    const saDoc = document.getElementById('win3')?.querySelector('iframe')?.contentDocument;
    if (saDoc) {
      const r = saDoc.getElementById('rv')?.textContent;
      const g = saDoc.getElementById('gv')?.textContent;
      const b = saDoc.getElementById('bv')?.textContent;
      const hex = saDoc.getElementById('hexval')?.textContent;
      const mInteg = saDoc.getElementById('m-integ')?.textContent;
      const mPeakWl = saDoc.getElementById('m-peakwl')?.textContent;
      const mPeakVal = saDoc.getElementById('m-peakval')?.textContent;
      const mTemp = saDoc.getElementById('m-temp')?.textContent;
      const mSig = saDoc.getElementById('m-sig')?.textContent;
      const mCal = saDoc.getElementById('m-cal')?.textContent;
      const mDate = saDoc.getElementById('meas-date')?.textContent;
      const mTime = saDoc.getElementById('meas-time')?.textContent;
      const fname = saDoc.getElementById('fname')?.textContent;
      const canvas = saDoc.getElementById('chart');
      let chartImg = null;
      if (canvas && canvas.width > 0) {
        try { chartImg = canvas.toDataURL('image/png'); } catch(err) {}
      }
      let rawPoints = [];
      if (canvas && canvas._vis) rawPoints = canvas._vis.slice(0, 200);
      if (r || g || b) {
        data.sa = { r, g, b, hex, mInteg, mPeakWl, mPeakVal, mTemp, mSig, mCal, mDate, mTime, fname, chartImg, rawPoints };
      }
    }
  } catch(err) { console.warn('postMessage SA:', err); }

  // ── CRI data ──
  try {
    const criDoc = document.getElementById('win0')?.querySelector('iframe')?.contentDocument;
    if (criDoc) {
      const criVal = criDoc.getElementById('criVal')?.textContent;
      const riCells = criDoc.querySelectorAll('#riGrid .ri-cell');
      const riData = [];
      riCells.forEach((cell, i) => {
        const label = cell.querySelector('.ri-cell-label')?.textContent || ('R'+(i+1));
        const val = cell.querySelector('.ri-cell-val')?.textContent || '—';
        const color = cell.querySelector('.ri-cell-val')?.style?.color || '#374151';
        riData.push({ label, val, color });
      });
      if (criVal && criVal !== '—') data.cri = { criVal, riData };
    }
  } catch(err) { console.warn('postMessage CRI:', err); }

  // ── CC data ──
  try {
    const ccDoc = document.getElementById('win1')?.querySelector('iframe')?.contentDocument;
    if (ccDoc) {
      const resX = ccDoc.getElementById('res-x')?.textContent;
      const resY = ccDoc.getElementById('res-y')?.textContent;
      const resZ = ccDoc.getElementById('res-z')?.textContent;
      const resLm = ccDoc.getElementById('res-lm')?.textContent;
      if (resX && resX !== '—') data.cc = { resX, resY, resZ, resLm };
    }
  } catch(err) { console.warn('postMessage CC:', err); }

  // ── CM data ──
  try {
    const cmDoc = document.getElementById('win2')?.querySelector('iframe')?.contentDocument;
    if (cmDoc) {
      const channels = cmDoc.querySelectorAll('.channel');
      const leds = [];
      channels.forEach((ch) => {
        const name = ch.querySelector('.channel-name')?.textContent?.trim() || '';
        const dot = ch.querySelector('.led-dot');
        const color = dot?.style?.background || '#888';
        const rangeInput = ch.querySelector('input[type=range]');
        const numInput = ch.querySelector('input[type=number]');
        const countEl = ch.querySelector('.count-val');
        const pwm = rangeInput?.value || numInput?.value || '0';
        const count = countEl?.textContent || '1';
        if (parseInt(pwm) > 0) leds.push({ name: name.replace(/^\s*\S+\s*/, ''), color, pwm, count });
      });
      const resX = cmDoc.getElementById('res-x')?.textContent;
      const resY = cmDoc.getElementById('res-y')?.textContent;
      const resZ = cmDoc.getElementById('res-z')?.textContent;
      const resLm = cmDoc.getElementById('res-lm')?.textContent;
      if (leds.length > 0) data.cm = { leds, resX, resY, resZ, resLm };
    }
  } catch(err) { console.warn('postMessage CM:', err); }

  // Send back to win4 iframe
  try {
    reportFrame.contentWindow.postMessage(data, '*');
  } catch(err) { console.warn('postMessage send:', err); }
});
</script>
</body>
</html>
