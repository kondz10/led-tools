function exportToPDF() {
  const g = id =&gt; { const el = document.getElementById(id); return el ? el.textContent.trim() : &#x27;—&#x27;; };

  // Collect active channel data from LEDS array
  const activeChannels = LEDS.filter(l =&gt; l.pwm &gt; 0);
  const mixX = g(&#x27;res-x&#x27;);
  const mixY = g(&#x27;res-y&#x27;);
  const mixLm = g(&#x27;res-lm&#x27;);
  const channelSummary = activeChannels.map(l =&gt; `${l.name}=${l.pwm}`).join(&#x27; &#x27;);

  // Serialize CIE SVG diagram to PNG via offscreen canvas
  let chartImage = null;
  try {
    const svgEl = document.getElementById(&#x27;cie-diagram&#x27;);
    if (svgEl) {
      const svgStr = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([svgStr], {type:&#x27;image/svg+xml;charset=utf-8&#x27;});
      const url = URL.createObjectURL(svgBlob);
      // Synchronous capture via Image + canvas
      const img = new Image();
      img.onload = function() {
        const cv = document.createElement(&#x27;canvas&#x27;);
        cv.width = 620; cv.height = 520;
        const ctx2d = cv.getContext(&#x27;2d&#x27;);
        ctx2d.fillStyle = &#x27;#ffffff&#x27;;
        ctx2d.fillRect(0, 0, 620, 520);
        ctx2d.drawImage(img, 0, 0, 620, 520);
        chartImage = cv.toDataURL(&#x27;image/png&#x27;);
        URL.revokeObjectURL(url);
        // Re-send with image now that it&#x27;s ready
        window.parent.postMessage({type:&#x27;LED_TOOLS_EXPORT&#x27;, payload: {
          source: &#x27;CM&#x27;,
          title: &#x27;Colour Mixer&#x27;,
          data: { x: mixX, y: mixY, lm: mixLm, channels: channelSummary, chartImage }
        }}, &#x27;*&#x27;);
      };
      img.onerror = function() { URL.revokeObjectURL(url); };
      img.src = url;
    }
  } catch(e) {}

  // Send immediately with data (chart will be re-sent asynchronously with image)
  const payload = {
    source: &#x27;CM&#x27;,
    title: &#x27;Colour Mixer&#x27;,
    data: {
      x: mixX,
      y: mixY,
      lm: mixLm,
      channels: channelSummary,
      chartImage: null,
    }
  };
  window.parent.postMessage({type:&#x27;LED_TOOLS_EXPORT&#x27;, payload}, &#x27;*&#x27;);
}
&lt;/script&gt;

// Listen for trigger from parent relay
window.addEventListener(&#x27;message&#x27;, (e) =&gt; {

    if (typeof exportToPDF === &#x27;function&#x27;) exportToPDF();
  }
});

function parseSpectrum(text) {
  const points = [];
  const meta = {};
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    if (line.startsWith(&#x27;;&#x27;)) {
      const parts = line.slice(1).split(/\t/);
      if (parts[0] === &#x27;Name&#x27;) meta.name = parts[1];
      if (parts[0] === &#x27;status&#x27; &amp;&amp; parts[1]) meta[parts[1]] = parts[2];
      continue;
    }
    if (line.startsWith(&#x27;Wavelength&#x27;) || line.startsWith(&#x27;;Wavelength&#x27;)) continue;
    const sep = line.includes(&#x27;\t&#x27;) ? &#x27;\t&#x27; : (line.includes(&#x27;;&#x27;) ? &#x27;;&#x27; : &#x27;,&#x27;);
    const cols = line.split(sep);
    if (cols.length &lt; 2) continue;
    const wl = parseFloat(cols[0].replace(&#x27;,&#x27;, &#x27;.&#x27;));
    const val = parseFloat(cols[1].replace(&#x27;,&#x27;, &#x27;.&#x27;));
    if (!isNaN(wl) &amp;&amp; !isNaN(val)) points.push([wl, val]);
  }
  return { points, meta };
}

function interpolate(points, wl) {
  for (let i = 0; i &lt; points.length - 1; i++) {
    if (points[i][0] &lt;= wl &amp;&amp; points[i+1][0] &gt;= wl) {
      const t = (wl - points[i][0]) / (points[i+1][0] - points[i][0]);
      return points[i][1] + t * (points[i+1][1] - points[i][1]);
    }
  }
  return 0;
}

function spectrumToRGB(points) {
  let X = 0, Y = 0, Z = 0;
  // Use 5nm CIE tables (81 points, 380–780nm) for higher accuracy
  // SPD value at each 5nm node is interpolated directly from the raw ~0.5nm data
  for (let i = 0; i &lt; CIE_X5.length; i++) {
    const wl = 380 + i * 5;
    const spd = Math.max(0, interpolate(points, wl));
    X += spd * CIE_X5[i];
    Y += spd * CIE_Y5[i];
    Z += spd * CIE_Z5[i];
  }
  // XYZ → linear sRGB
  let rLin =  3.2406*X - 1.5372*Y - 0.4986*Z;
  let gLin = -0.9689*X + 1.8758*Y + 0.0415*Z;
  let bLin =  0.0557*X - 0.2040*Y + 1.0570*Z;
  // Normalize by max linear value so the brightest channel = 1
  const maxLin = Math.max(rLin, gLin, bLin, 0.0001);
  rLin = rLin / maxLin;
  gLin = gLin / maxLin;
  bLin = bLin / maxLin;
  // clamp negatives to 0
  rLin = Math.max(0, rLin);
  gLin = Math.max(0, gLin);
  bLin = Math.max(0, bLin);
  // sRGB gamma encoding
  const gam = v =&gt; v &lt;= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055;
  const r = Math.round(Math.min(1, gam(rLin)) * 255);
  const g = Math.round(Math.min(1, gam(gLin)) * 255);
  const b = Math.round(Math.min(1, gam(bLin)) * 255);
  return [r, g, b];
}

function wavelengthToColor(wl) {
  let r=0,g=0,b=0;
  if (wl&gt;=380&amp;&amp;wl&lt;440){r=(440-wl)/60;g=0;b=1;}
  else if(wl&gt;=440&amp;&amp;wl&lt;490){r=0;g=(wl-440)/50;b=1;}
  else if(wl&gt;=490&amp;&amp;wl&lt;510){r=0;g=1;b=(510-wl)/20;}
  else if(wl&gt;=510&amp;&amp;wl&lt;580){r=(wl-510)/70;g=1;b=0;}
  else if(wl&gt;=580&amp;&amp;wl&lt;645){r=1;g=(645-wl)/65;b=0;}
  else if(wl&gt;=645&amp;&amp;wl&lt;=760){r=1;g=0;b=0;}
  let att=1;
  if(wl&lt;420)att=0.3+0.7*(wl-380)/40;
  else if(wl&gt;700)att=0.3+0.7*(760-wl)/60;
  return `rgba(${Math.round(r*255*att)},${Math.round(g*255*att)},${Math.round(b*255*att)},`;

  canvas.height = H * dpr;
  const ctx = canvas.getContext(&#x27;2d&#x27;);
  ctx.scale(dpr, dpr);

  const padL=60, padR=20, padT=20, padB=45;
  const cW=W-padL-padR, cH=H-padT-padB;

  // filter to 380-760
  const vis = points.filter(p=&gt;p[0]&gt;=380&amp;&amp;p[0]&lt;=760);
  if (!vis.length) return;

  const maxVal = Math.max(...vis.map(p=&gt;p[1]));
  const minVal = Math.min(0, Math.min(...vis.map(p=&gt;p[1])));

  const tx = wl =&gt; padL + (wl-380)/(760-380)*cW;
  const ty = v  =&gt; padT + cH - (v-minVal)/(maxVal-minVal)*cH;

  // Background (dark theme)
  ctx.fillStyle=&#x27;#0d0f12&#x27;; ctx.fillRect(0,0,W,H);

  // Spectral gradient fill
  const grad=ctx.createLinearGradient(padL,0,padL+cW,0);
  for(let wl=380;wl&lt;=760;wl+=5) {
    const stop=(wl-380)/380;
    const col=wavelengthToColor(wl);
    grad.addColorStop(stop, col+&#x27;0.55)&#x27;);
  }

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx(vis[0][0]),ty(0));
  for(const [wl,v] of vis) ctx.lineTo(tx(wl),ty(Math.max(v,minVal)));
  ctx.lineTo(tx(vis[vis.length-1][0]),ty(0));
  ctx.closePath();
  ctx.fillStyle=grad;
  ctx.fill();
  ctx.restore();

  // Grid lines
  ctx.strokeStyle=&#x27;rgba(30,37,53,0.9)&#x27;;
  ctx.lineWidth=1;
  for(let wl=400;wl&lt;=760;wl+=40){
    ctx.beginPath();ctx.moveTo(tx(wl),padT);ctx.lineTo(tx(wl),padT+cH);ctx.stroke();
  }
  const nLines=6;
  for(let i=0;i&lt;=nLines;i++){
    const v=minVal+(maxVal-minVal)*i/nLines;
    ctx.beginPath();ctx.moveTo(padL,ty(v));ctx.lineTo(padL+cW,ty(v));ctx.stroke();
  }

  // Zero line
  if(minVal&lt;0){
    ctx.strokeStyle=&#x27;rgba(139,21,186,0.35)&#x27;;ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(padL,ty(0));ctx.lineTo(padL+cW,ty(0));ctx.stroke();
    ctx.setLineDash([]);
  }

  // Spectrum curve
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx(vis[0][0]),ty(vis[0][1]));
  for(const [wl,v] of vis) ctx.lineTo(tx(wl),ty(v));
  ctx.strokeStyle=&#x27;rgba(255,255,255,0.9)&#x27;;
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();

  // Peak marker
  const peak=vis.reduce((a,b)=&gt;b[1]&gt;a[1]?b:a);
  ctx.strokeStyle=&#x27;rgba(192,106,224,0.8)&#x27;;ctx.lineWidth=1;
  ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(tx(peak[0]),padT);ctx.lineTo(tx(peak[0]),padT+cH);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=&#x27;#c06ae0&#x27;;ctx.font=&#x27;bold 11px Space Mono, monospace&#x27;;
  ctx.textAlign=&#x27;center&#x27;;
  ctx.fillText(peak[0].toFixed(1)+&#x27;nm&#x27;, tx(peak[0]), padT-5);

  // Axes
  ctx.strokeStyle=&#x27;rgba(74,90,106,0.8)&#x27;;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+cH);ctx.lineTo(padL+cW,padT+cH);ctx.stroke();

  // X-axis labels
  ctx.fillStyle=&#x27;#4e5668&#x27;;ctx.font=&#x27;10px Space Mono, monospace&#x27;;ctx.textAlign=&#x27;center&#x27;;
  for(let wl=400;wl&lt;=760;wl+=40){
    const color=wavelengthToColor(wl)+&#x27;1)&#x27;;
    ctx.fillStyle=color;
    ctx.fillText(wl+&#x27;nm&#x27;,tx(wl),padT+cH+16);
  }

  // Y-axis labels
  ctx.textAlign=&#x27;right&#x27;;ctx.fillStyle=&#x27;#4e5668&#x27;;
  for(let i=0;i&lt;=nLines;i++){
    const v=minVal+(maxVal-minVal)*i/nLines;
    ctx.fillText(v.toFixed(2),padL-6,ty(v)+4);
  }
  ctx.save();
  ctx.translate(12,padT+cH/2);ctx.rotate(-Math.PI/2);
  ctx.textAlign=&#x27;center&#x27;;ctx.font=&#x27;10px DM Sans, sans-serif&#x27;;ctx.fillStyle=&#x27;#3a4a5a&#x27;;
  ctx.fillText(&#x27;mW/m²/nm&#x27;,0,0);
  ctx.restore();

  // Tooltip interaction
  canvas._vis=vis; canvas._tx=tx; canvas._ty=ty; canvas._padL=padL; canvas._padT=padT; canvas._cH=cH;
}

function setupTooltip() {
  const canvas=document.getElementById(&#x27;chart&#x27;);
  const tip=document.getElementById(&#x27;tooltip&#x27;);
  canvas.addEventListener(&#x27;mousemove&#x27;, e=&gt;{
    if(!canvas._vis) return;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const pL=canvas._padL, cW=canvas.offsetWidth-pL-20;
    const wl=380+(mx-pL)/cW*380;
    if(wl&lt;380||wl&gt;760){tip.style.display=&#x27;none&#x27;;return;}
    // find nearest
    let best=canvas._vis[0];
    for(const p of canvas._vis) if(Math.abs(p[0]-wl)&lt;Math.abs(best[0]-wl)) best=p;
    tip.style.display=&#x27;block&#x27;;
    tip.style.left=(e.clientX+14)+&#x27;px&#x27;;
    tip.style.top=(e.clientY-8)+&#x27;px&#x27;;
    tip.textContent=best[0].toFixed(2)+&#x27; nm → &#x27;+best[1].toFixed(5)+&#x27; mW/m²/nm&#x27;;
  });
  canvas.addEventListener(&#x27;mouseleave&#x27;,()=&gt;tip.style.display=&#x27;none&#x27;);
}

function updateUI(text, filename=&#x27;BCentrum.txt&#x27;) {
  const {points, meta} = parseSpectrum(text);
  document.getElementById(&#x27;fname&#x27;).textContent=filename;

  // Date/time
  const dt = meta[&#x27;measurement_date&#x27;] || meta[&#x27;name&#x27;] || &#x27;&#x27;;
  if(dt) {
    const [datePart,timePart]=dt.split(&#x27;T&#x27;);
    document.getElementById(&#x27;meas-date&#x27;).textContent=datePart||&#x27;&#x27;;
    document.getElementById(&#x27;meas-time&#x27;).textContent=(timePart||&#x27;&#x27;).substring(0,8);
  }

  // Metrics
  const setM=(id,val,unit=&#x27;&#x27;)=&gt;{ const el=document.getElementById(id); if(el&amp;&amp;val!==undefined) el.textContent=val+(unit?&#x27; &#x27;+unit:&#x27;&#x27;); };
  setM(&#x27;m-integ&#x27;, meta[&#x27;integration_time&#x27;], &#x27;µs&#x27;);
  const peakWl=parseFloat(meta[&#x27;measurement_maximum_wavelength&#x27;]||0);
  setM(&#x27;m-peakwl&#x27;, peakWl?peakWl.toFixed(3)+&#x27; nm&#x27;:&#x27;—&#x27;);
  const peakVal=parseFloat(meta[&#x27;measurement_maximum&#x27;]||0);
  setM(&#x27;m-peakval&#x27;, peakVal?peakVal.toFixed(1):&#x27;—&#x27;);
  const temp=parseFloat(meta[&#x27;sensor_temperature&#x27;]||0);
  setM(&#x27;m-temp&#x27;, temp?temp.toFixed(2)+&#x27; °C&#x27;:&#x27;—&#x27;);
  const sig=parseFloat(meta[&#x27;signal_level&#x27;]||0);
  setM(&#x27;m-sig&#x27;, sig?sig.toFixed(2)+&#x27; %&#x27;:&#x27;—&#x27;);
  const calDate=(meta[&#x27;calibration_date&#x27;]||&#x27;&#x27;).substring(0,10);
  setM(&#x27;m-cal&#x27;, calDate||&#x27;—&#x27;);

  // RGB + CIE xyY
  const vis=points.filter(p=&gt;p[0]&gt;=380&amp;&amp;p[0]&lt;=760);
  const [r,g,b]=spectrumToRGB(vis.length?vis:points);
  document.getElementById(&#x27;rv&#x27;).textContent=r;
  document.getElementById(&#x27;gv&#x27;).textContent=g;
  document.getElementById(&#x27;bv&#x27;).textContent=b;
  const hex=&#x27;#&#x27;+[r,g,b].map(v=&gt;v.toString(16).padStart(2,&#x27;0&#x27;)).join(&#x27;&#x27;).toUpperCase();
  document.getElementById(&#x27;hexval&#x27;).textContent=hex;
  document.getElementById(&#x27;swatch&#x27;).style.background=`rgb(${r},${g},${b})`;

  // Compute raw XYZ for xyY (unnormalized, for chromaticity)
  let rX=0,rY=0,rZ=0;
  const srcPts=vis.length?vis:points;
  for(let i=0;i&lt;CIE_X5.length;i++){
    const wl=380+i*5;
    const spd=Math.max(0,interpolate(srcPts,wl));
    rX+=spd*CIE_X5[i];
    rY+=spd*CIE_Y5[i];
    rZ+=spd*CIE_Z5[i];
  }
  const s=rX+rY+rZ;
  if(s&gt;1e-10){
    document.getElementById(&#x27;cie-x&#x27;).textContent=(rX/s).toFixed(4);
    document.getElementById(&#x27;cie-y&#x27;).textContent=(rY/s).toFixed(4);
    // Y normalized to 1 (relative luminance)
    const Ynorm=rY/Math.max(rX,rY,rZ,1e-10);
    document.getElementById(&#x27;cie-Y&#x27;).textContent=Ynorm.toFixed(4);
  } else {
    document.getElementById(&#x27;cie-x&#x27;).textContent=&#x27;—&#x27;;
    document.getElementById(&#x27;cie-y&#x27;).textContent=&#x27;—&#x27;;
    document.getElementById(&#x27;cie-Y&#x27;).textContent=&#x27;—&#x27;;
  }

  drawChart(points);

  const count=points.filter(p=&gt;p[0]&gt;=380&amp;&amp;p[0]&lt;=760).length;
  document.getElementById(&#x27;status&#x27;).innerHTML=
    `&lt;span class=&quot;status-ok&quot;&gt;✓&lt;/span&gt; Wczytano ${points.length} punktów · zakres widmowy 380–760nm: ${count} pkt · RGB=(${r},${g},${b})`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
let _lastPoints = null;

function redrawIfNeeded() {
  if (_lastPoints &amp;&amp; _lastPoints.length) drawChart(_lastPoints);
}

window.addEventListener(&#x27;load&#x27;, ()=&gt;{
  document.getElementById(&#x27;rawdata&#x27;).value = DEFAULT_DATA;

  setTimeout(() =&gt; {
    updateUI(DEFAULT_DATA);
    setupTooltip();
    setTimeout(redrawIfNeeded, 300);
    setTimeout(redrawIfNeeded, 800);
    setTimeout(redrawIfNeeded, 1800);
  }, 50);

  document.getElementById(&#x27;fileInput&#x27;).addEventListener(&#x27;change&#x27;, e=&gt;{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=&gt;{
      const text=ev.target.result;
      document.getElementById(&#x27;rawdata&#x27;).value=text;
      updateUI(text, f.name);
    };
    reader.readAsText(f, &#x27;UTF-8&#x27;);
  });

  document.getElementById(&#x27;rawdata&#x27;).addEventListener(&#x27;input&#x27;, ()=&gt;{
    updateUI(document.getElementById(&#x27;rawdata&#x27;).value);
  });

  // ResizeObserver - redraws when chart panel resizes (e.g. tab becomes visible)
  const chartPanel = document.querySelector(&#x27;.chart-panel&#x27;);
  if (chartPanel &amp;&amp; window.ResizeObserver) {
    new ResizeObserver(() =&gt; { redrawIfNeeded(); }).observe(chartPanel);
  }
});

window.addEventListener(&#x27;resize&#x27;, ()=&gt;{
  const text=document.getElementById(&#x27;rawdata&#x27;).value;
  if(text) { const {points}=parseSpectrum(text); drawChart(points); }
});

// Listen for tab-activation signal from parent frame
window.addEventListener(&#x27;message&#x27;, (e) =&gt; {
  if (e.data &amp;&amp; e.data.type === &#x27;LED_TAB_ACTIVATED&#x27;) {
    setTimeout(redrawIfNeeded, 30);
  }
});

&lt;script&gt;
// Render chart to offscreen canvas with WHITE background for PDF export
function getChartImageLight() {
  if (!_lastPoints || !_lastPoints.length) return null;
  const vis = _lastPoints.filter(p=&gt;p[0]&gt;=380&amp;&amp;p[0]&lt;=760);
  if (!vis.length) return null;
  const W = 900, H = 340;
  const oc = document.createElement(&#x27;canvas&#x27;);
  oc.width = W; oc.height = H;
  const c = oc.getContext(&#x27;2d&#x27;);
  const padL=60, padR=20, padT=24, padB=48;
  const cW=W-padL-padR, cH=H-padT-padB;
  const maxVal=Math.max(...vis.map(p=&gt;p[1]));
  const minVal=Math.min(0,...vis.map(p=&gt;p[1]));
  const tx=wl=&gt;padL+(wl-380)/(760-380)*cW;
  const ty=v=&gt;padT+cH-(v-minVal)/(maxVal-minVal)*cH;
  // White bg
  c.fillStyle=&#x27;#ffffff&#x27;; c.fillRect(0,0,W,H);
  // Spectral gradient fill
  const grad=c.createLinearGradient(padL,0,padL+cW,0);
  for(let wl=380;wl&lt;=760;wl+=5){
    const stop=(wl-380)/380;
    const col=wavelengthToColor(wl);
    grad.addColorStop(stop,col+&#x27;0.40)&#x27;);
  }
  c.save(); c.beginPath();
  c.moveTo(tx(vis[0][0]),ty(0));
  for(const [wl,v] of vis) c.lineTo(tx(wl),ty(Math.max(v,minVal)));
  c.lineTo(tx(vis[vis.length-1][0]),ty(0));
  c.closePath(); c.fillStyle=grad; c.fill(); c.restore();
  // Grid
  c.strokeStyle=&#x27;rgba(180,185,200,0.8)&#x27;; c.lineWidth=1;
  for(let wl=400;wl&lt;=760;wl+=40){
    c.beginPath();c.moveTo(tx(wl),padT);c.lineTo(tx(wl),padT+cH);c.stroke();
  }
  const nLines=6;
  for(let i=0;i&lt;=nLines;i++){
    const v=minVal+(maxVal-minVal)*i/nLines;
    c.beginPath();c.moveTo(padL,ty(v));c.lineTo(padL+cW,ty(v));c.stroke();
  }
  // Zero line
  if(minVal&lt;0){
    c.strokeStyle=&#x27;rgba(139,21,186,0.5)&#x27;;c.lineWidth=1;c.setLineDash([4,4]);
    c.beginPath();c.moveTo(padL,ty(0));c.lineTo(padL+cW,ty(0));c.stroke();
    c.setLineDash([]);
  }
  // Curve
  c.save();c.beginPath();
  c.moveTo(tx(vis[0][0]),ty(vis[0][1]));
  for(const [wl,v] of vis) c.lineTo(tx(wl),ty(v));
  c.strokeStyle=&#x27;rgba(30,30,50,0.85)&#x27;;c.lineWidth=2;c.stroke();c.restore();
  // Peak
  const peak=vis.reduce((a,b)=&gt;b[1]&gt;a[1]?b:a);
  c.strokeStyle=&#x27;rgba(139,21,186,0.7)&#x27;;c.lineWidth=1;c.setLineDash([3,3]);
  c.beginPath();c.moveTo(tx(peak[0]),padT);c.lineTo(tx(peak[0]),padT+cH);c.stroke();
  c.setLineDash([]);
  c.fillStyle=&#x27;#8b15ba&#x27;;c.font=&#x27;bold 11px monospace&#x27;;c.textAlign=&#x27;center&#x27;;
  c.fillText(peak[0].toFixed(1)+&#x27;nm&#x27;,tx(peak[0]),padT-6);
  // Axes
  c.strokeStyle=&#x27;rgba(60,70,90,0.9)&#x27;;c.lineWidth=1;
  c.beginPath();c.moveTo(padL,padT);c.lineTo(padL,padT+cH);c.lineTo(padL+cW,padT+cH);c.stroke();
  // X labels
  c.font=&#x27;10px monospace&#x27;;c.textAlign=&#x27;center&#x27;;
  for(let wl=400;wl&lt;=760;wl+=40){
    c.fillStyle=wavelengthToColor(wl)+&#x27;1)&#x27;;
    c.fillText(wl+&#x27;nm&#x27;,tx(wl),padT+cH+16);
  }
  // Y labels
  c.textAlign=&#x27;right&#x27;;c.fillStyle=&#x27;#556&#x27;;
  for(let i=0;i&lt;=nLines;i++){
    const v=minVal+(maxVal-minVal)*i/nLines;
    c.fillText(v.toFixed(2),padL-6,ty(v)+4);
  }
  c.save();c.translate(12,padT+cH/2);c.rotate(-Math.PI/2);
  c.textAlign=&#x27;center&#x27;;c.font=&#x27;10px sans-serif&#x27;;c.fillStyle=&#x27;#556&#x27;;
  c.fillText(&#x27;mW/m²/nm&#x27;,0,0);c.restore();
  return oc.toDataURL(&#x27;image/png&#x27;);
}

function exportToPDF() {
  const g = id =&gt; { const el = document.getElementById(id); return el ? el.textContent.trim() : &#x27;—&#x27;; };
  // Use light-theme offscreen render for PDF
  let chartImage = null;
  try { chartImage = getChartImageLight(); } catch(e) {}

  const payload = {
    source: &#x27;SA&#x27;,
    title: &#x27;SA Spectral Analyzer&#x27;,
    data: {
      peakWl:   g(&#x27;m-peakwl&#x27;),
      peakVal:  g(&#x27;m-peakval&#x27;),
      integ:    g(&#x27;m-integ&#x27;),
      temp:     g(&#x27;m-temp&#x27;),
      signal:   g(&#x27;m-sig&#x27;),
      cal:      g(&#x27;m-cal&#x27;),
      measDate: g(&#x27;meas-date&#x27;),
      measTime: g(&#x27;meas-time&#x27;),
      chartImage,
    }
  };
  window.parent.postMessage({type:&#x27;LED_TOOLS_EXPORT&#x27;, payload}, &#x27;*&#x27;);
}

.logo-text{font-weight:600;font-size:1rem;color:var(--text);letter-spacing:-.02em}
.logo-sub{font-size:.65rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.hdr-sep{width:1px;height:28px;background:var(--border);margin:0 4px}
.status-pill{
  background:rgba(74,240,196,.08);border:1px solid rgba(74,240,196,.2);
  color:var(--accent);font-size:.65rem;padding:3px 10px;border-radius:20px;
  letter-spacing:.06em;text-transform:uppercase;font-family:&#x27;DM Mono&#x27;,monospace;
}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.btn{
  cursor:pointer;border:none;border-radius:6px;
  padding:7px 16px;font-family:&#x27;Space Grotesk&#x27;,sans-serif;
  font-size:.78rem;font-weight:500;letter-spacing:.02em;transition:all .15s;
}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-primary{background:var(--accent);color:#0a0c10}
.btn-primary:hover{background:#3de0b4;transform:translateY(-1px);box-shadow:0 4px 20px rgba(74,240,196,.2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-warn{background:rgba(240,196,74,.12);border:1px solid rgba(240,196,74,.25);color:var(--accent3)}
.btn-warn:hover{background:rgba(240,196,74,.2)}

/* ─── LEFT PANEL ─── */
.left-panel{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

/* tab nav */
.tab-nav{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;
}
.tab-btn{
  background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-family:&#x27;Space Grotesk&#x27;,sans-serif;font-size:.6rem;
  letter-spacing:.06em;text-transform:uppercase;padding:11px 4px;
  cursor:pointer;transition:all .15s;
}
.tab-btn:hover{color:var(--text);background:var(--surface2)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.tab-icon{display:block;font-size:.95rem;margin-bottom:3px}

/* tab contents */
.tab-pane{display:none;flex:1;overflow-y:auto;padding:18px;flex-direction:column;gap:10px}
.tab-pane.active{display:flex}

/* section headers inside tabs */
.sec-hdr{
  font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent2);padding:8px 0 6px;border-bottom:1px solid var(--border);
  margin-bottom:2px;font-family:&#x27;DM Mono&#x27;,monospace;
}

/* fields */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fi{
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:&#x27;DM Mono&#x27;,monospace;font-size:.78rem;
  padding:8px 10px;outline:none;transition:border-color .15s;width:100%;resize:none;
}
.fi:focus{border-color:var(--accent2)}
.fi::placeholder{color:var(--muted)}
.fi option,.fi optgroup{background:var(--surface2);color:var(--text)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* toggle rows */
.tog{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;cursor:pointer;transition:all .15s;user-select:none;
}
.tog:hover{border-color:var(--accent2)}
.tog input{display:none}
.tog-box{
  width:16px;height:16px;border:1px solid var(--border2);border-radius:3px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:.65rem;transition:all .15s;
}
.tog input:checked~.tog-box{background:var(--accent);border-color:var(--accent);color:#0a0c10}
.tog-info strong{display:block;font-size:.75rem;color:var(--text);font-weight:500}
.tog-info span{font-size:.65rem;color:var(--muted)}

/* color pickers */
.cp-row{display:flex;gap:8px}
.cp-row .fg{flex:1}
input[type=color]{width:100%;height:36px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);cursor:pointer;padding:2px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* measurement rows */
.mrow{
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;margin-bottom:6px;
}
.mrow-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mrow-hdr span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mrow-hdr button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.75rem}

/* ─── RIGHT PANEL ─── */
.right-panel{display:flex;flex-direction:column;background:#12141a;overflow:hidden}
.preview-bar{
  padding:10px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;
}
.preview-bar-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:&#x27;DM Mono&#x27;,monospace}
.preview-bar .ml{margin-left:auto;display:flex;gap:6px}
.zoom-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:4px;padding:4px 10px;font-size:.7rem;cursor:pointer;transition:all .15s;
  font-family:&#x27;DM Mono&#x27;,monospace;
}
.zoom-btn:hover{color:var(--text);border-color:var(--text)}
.preview-vp{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;background:#0d0f14}

/* ─── A4 SHEET ─── */
#sheet{
  background:#fff;width:794px;min-height:1123px;
  box-shadow:0 24px 80px rgba(0,0,0,.7);
  flex-shrink:0;position:relative;transform-origin:top center;
  font-family:&#x27;IBM Plex Sans&#x27;,sans-serif;font-size:11px;color:#1a1a2e;line-height:1.55;
}

/* ─── LAB REPORT PREVIEW STYLES ─── */
.rpt-top-bar{height:6px;width:100%}
.rpt-wrap{padding:44px 52px 80px}

.rpt-masthead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0}
.rpt-org{flex:1}
.rpt-org-name{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.rpt-org-sub{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#888;margin-top:3px}
.rpt-org-addr{font-size:9.5px;color:#666;margin-top:8px;line-height:1.7}
.rpt-meta-box{text-align:right;min-width:200px}
.rpt-doc-label{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#999;margin-bottom:4px}
.rpt-doc-id{font-size:15px;font-weight:700;letter-spacing:-.01em}
.rpt-meta-grid{margin-top:8px;font-size:9px;color:#666;line-height:2}
.rpt-meta-grid strong{color:#333}

.rpt-divider{height:2px;margin:18px 0}
.rpt-divider.thin{height:1px;background:#e5e5e5;margin:14px 0}

.rpt-title-block{padding:16px 0 14px;border-bottom:1px solid #eee}
.rpt-report-type{font-size:8px;text-transform:uppercase;letter-spacing:.16em;color:#aaa;margin-bottom:4px}
.rpt-report-title{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.rpt-report-subtitle{font-size:10.5px;color:#555;margin-top:4px}

.rpt-info-band{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  margin:16px 0;border:1px solid #e8e8e8;border-radius:4px;overflow:hidden;
}
.rpt-info-cell{padding:10px 12px;border-right:1px solid #e8e8e8}
.rpt-info-cell:last-child{border-right:none}
.rpt-info-cell-lbl{font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;color:#aaa;margin-bottom:3px}
.rpt-info-cell-val{font-size:10.5px;font-weight:600;color:#1a1a2e}

.rpt-section{margin-bottom:22px}
.rpt-section-hdr{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid #ececec;
}
.rpt-section-num{
  width:20px;height:20px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;flex-shrink:0;
}
.rpt-section-title{font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:#555}

/* measurements table */
.rpt-table{width:100%;border-collapse:collapse;font-size:9.5px}
.rpt-table thead tr{border-bottom:2px solid #333}
.rpt-table th{
  text-align:left;padding:7px 8px;font-size:8px;
  text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:#fff;
}
.rpt-table td{padding:7px 8px;border-bottom:1px solid #f0f0f0;color:#333}
.rpt-table tr:last-child td{border-bottom:none}
.rpt-table .r{text-align:right}
.rpt-table .c{text-align:center}
.rpt-table .mono{font-family:&#x27;Source Code Pro&#x27;,monospace;font-size:9px}
.rpt-table .badge-pass{background:#e8f8f2;color:#1a7a4a;padding:2px 6px;border-radius:3px;font-size:7.5px;font-weight:700;text-transform:uppercase}
.rpt-table .badge-fail{background:#fde8ec;color:#c0392b;padding:2px 6px;border-radius:3px;font-size:7.5px;font-weight:700;text-transform:uppercase}
.rpt-table .badge-warn{background:#fef8e8;color:#b7770d;padding:2px 6px;border-radius:3px;font-size:7.5px;font-weight:700;text-transform:uppercase}
.rpt-table tr.alt{background:#fafafa}

/* summary box */
.rpt-summary{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;
}
.rpt-sum-card{
  border:1px solid #e8e8e8;border-radius:4px;padding:12px 14px;
}
.rpt-sum-card-lbl{font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;color:#aaa;margin-bottom:4px}
.rpt-sum-card-val{font-size:18px;font-weight:700;line-height:1}
.rpt-sum-card-sub{font-size:8.5px;color:#999;margin-top:3px}

/* remarks */
.rpt-remarks{
  background:#f7f8fc;border-left:3px solid #ccc;border-radius:0 4px 4px 0;
  padding:12px 14px;font-size:9.5px;color:#555;line-height:1.65;
}
.rpt-remarks-lbl{font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;color:#aaa;margin-bottom:6px;font-weight:600}

/* conclusion box */
.rpt-conclusion{
  border-radius:4px;padding:14px 16px;margin-top:16px;
  border:1px solid #e0e0e0;
}
.rpt-conclusion-lbl{font-size:7.5px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;font-weight:700}
.rpt-conclusion-text{font-size:10px;line-height:1.7}

/* signatures */
.rpt-sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:32px}
.rpt-sig{border-top:1px solid #aaa;padding-top:8px}
.rpt-sig-role{font-size:7.5px;text-transform:uppercase;letter-spacing:.1em;color:#aaa;margin-bottom:2px}
.rpt-sig-name{font-size:9.5px;color:#555}

/* watermark */
.rpt-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);
  font-size:72px;font-weight:900;letter-spacing:-.02em;
  opacity:.03;pointer-events:none;white-space:nowrap;
}

/* footer */
.rpt-footer{
  position:absolute;bottom:0;left:0;right:0;
  border-top:1px solid #ececec;padding:10px 52px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:8px;color:#bbb;background:#fff;
}
.rpt-footer-bar{height:3px;position:absolute;bottom:0;left:0;right:0}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── IMPORT PANEL ── */
.import-panel {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.import-panel-hdr {
  font-size: .6rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
  font-family: &#x27;DM Mono&#x27;, monospace;
  display: flex; align-items: center; gap: 6px;
}
.import-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.import-btn {
  display: flex; align-items: center; gap: 5px;

  border-radius: 5px; padding: 5px 11px;
  color: #c06ae0; font-family: &#x27;DM Mono&#x27;, monospace; font-size: .68rem;
  cursor: pointer; transition: all .15s; letter-spacing: .04em;
}
.import-btn:hover { background: rgba(139,21,186,0.2); border-color: rgba(139,21,186,0.5); }
.import-btn.active { background: rgba(74,240,196,.12); border-color: rgba(74,240,196,.3); color: var(--accent); }
.import-status {
  font-size: .62rem; font-family: &#x27;DM Mono&#x27;, monospace;
  color: var(--muted); min-height: 14px; letter-spacing: .03em;
}
.import-status.ok { color: var(--accent); }
.import-status.err { color: var(--danger); }
.import-preview {
  margin-top: 8px; max-height: 120px; overflow-y: auto;
  background: var(--bg); border: 1px solid var(--border);

}
.import-preview.visible { display: block; }
.import-preview table { width: 100%; border-collapse: collapse; }
.import-preview td { padding: 2px 6px; }
.import-preview tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
.imp-tag { display: inline-block; background: rgba(139,21,186,0.15); border: 1px solid rgba(139,21,186,0.2); border-radius: 3px; padding: 1px 5px; font-size: .58rem; color: #c06ae0; margin-right: 4px; }

        &lt;option value=&quot;1.85&quot;&gt;Bardzo luźna (1.85)&lt;/option&gt;
      &lt;/select&gt;&lt;/div&gt;

    &lt;div class=&quot;sec-hdr&quot;&gt;Marginesy i układ strony&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Margines boczny (px)&lt;/label&gt;
        &lt;input class=&quot;fi&quot; id=&quot;padH&quot; type=&quot;number&quot; value=&quot;52&quot; min=&quot;20&quot; max=&quot;100&quot; oninput=&quot;updatePreview()&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Margines górny (px)&lt;/label&gt;
        &lt;input class=&quot;fi&quot; id=&quot;padV&quot; type=&quot;number&quot; value=&quot;44&quot; min=&quot;16&quot; max=&quot;80&quot; oninput=&quot;updatePreview()&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Grubość paska nagłówkowego (px)&lt;/label&gt;
      &lt;input class=&quot;fi&quot; id=&quot;topBarH&quot; type=&quot;number&quot; value=&quot;6&quot; min=&quot;0&quot; max=&quot;20&quot; oninput=&quot;updatePreview()&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Styl nagłówka org.&lt;/label&gt;
      &lt;select class=&quot;fi&quot; id=&quot;hdrStyle&quot; onchange=&quot;updatePreview()&quot;&gt;
        &lt;option value=&quot;split&quot;&gt;Podzielony (org. | meta)&lt;/option&gt;
        &lt;option value=&quot;centered&quot;&gt;Wycentrowany&lt;/option&gt;
        &lt;option value=&quot;compact&quot;&gt;Kompaktowy (1 linia)&lt;/option&gt;
      &lt;/select&gt;&lt;/div&gt;
    &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Naprzemienne tło wierszy tabeli&lt;/label&gt;
      &lt;select class=&quot;fi&quot; id=&quot;tableStripe&quot; onchange=&quot;updatePreview()&quot;&gt;
        &lt;option value=&quot;1&quot;&gt;Włączone&lt;/option&gt;
        &lt;option value=&quot;0&quot;&gt;Wyłączone&lt;/option&gt;
      &lt;/select&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ═══════════════ RIGHT PANEL ═══════════════ --&gt;
&lt;div class=&quot;right-panel&quot;&gt;
  &lt;div class=&quot;preview-bar&quot;&gt;
    &lt;span class=&quot;preview-bar-label&quot;&gt;Podgląd raportu — A4&lt;/span&gt;
    &lt;div class=&quot;ml&quot;&gt;
      &lt;button class=&quot;zoom-btn&quot; onclick=&quot;zoom(-0.08)&quot;&gt;− Oddal&lt;/button&gt;
      &lt;button class=&quot;zoom-btn&quot; onclick=&quot;zoom(0.08)&quot;&gt;+ Przybliż&lt;/button&gt;
      &lt;button class=&quot;zoom-btn&quot; onclick=&quot;zoom(0,&#x27;fit&#x27;)&quot;&gt;Dopasuj&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;preview-vp&quot;&gt;
    &lt;div id=&quot;sheet&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let scale = 0.78;
let mrows = [
  {param:&#x27;Strumień świetlny (Φ)&#x27;,unit:&#x27;lm&#x27;,value:&#x27;4 218&#x27;,ref:&#x27;≥ 4 000&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Skuteczność świetlna (η)&#x27;,unit:&#x27;lm/W&#x27;,value:&#x27;128.4&#x27;,ref:&#x27;≥ 110&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Temperatura barwowa (CCT)&#x27;,unit:&#x27;K&#x27;,value:&#x27;4 012&#x27;,ref:&#x27;3 900 – 4 200&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Wskaźnik oddawania barw (Ra)&#x27;,unit:&#x27;—&#x27;,value:&#x27;82.6&#x27;,ref:&#x27;≥ 80&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Współrz. barwy x (CIE 1931)&#x27;,unit:&#x27;—&#x27;,value:&#x27;0.3812&#x27;,ref:&#x27;0.370 – 0.400&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Współrz. barwy y (CIE 1931)&#x27;,unit:&#x27;—&#x27;,value:&#x27;0.3764&#x27;,ref:&#x27;0.360 – 0.390&#x27;,status:&#x27;pass&#x27;},
  {param:&#x27;Współczynnik tętnienia (Pst)&#x27;,unit:&#x27;%&#x27;,value:&#x27;18.7&#x27;,ref:&#x27;≤ 10&#x27;,status:&#x27;fail&#x27;},
  {param:&#x27;Moc czynna (P)&#x27;,unit:&#x27;W&#x27;,value:&#x27;32.8&#x27;,ref:&#x27;≤ 35&#x27;,status:&#x27;pass&#x27;},
];

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
  const today = new Date().toISOString().split(&#x27;T&#x27;)[0];
  const yd    = new Date(Date.now()-2*864e5).toISOString().split(&#x27;T&#x27;)[0];
  document.getElementById(&#x27;docIssueDate&#x27;).value = today;
  document.getElementById(&#x27;docTestDate&#x27;).value  = yd;
  document.getElementById(&#x27;sampleDate&#x27;).value   = yd;
  renderMrows();
  updatePreview();
});

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function switchTab(i) {
  document.querySelectorAll(&#x27;.tab-pane&#x27;).forEach((p,j)=&gt;p.classList.toggle(&#x27;active&#x27;,i===j));
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b,j)=&gt;b.classList.toggle(&#x27;active&#x27;,i===j));
}
function isOn(id){return document.getElementById(id)?.checked}
function val(id){return document.getElementById(id)?.value??&#x27;&#x27;}
function zoom(d,cmd){
  if(cmd===&#x27;fit&#x27;) scale=0.78; else scale=Math.max(.3,Math.min(1.3,scale+d));
  document.getElementById(&#x27;sheet&#x27;).style.transform=`scale(${scale})`;
}
function hex2rgb(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return[r/255,g/255,b/255];
}
function resetAll(){
  if(!confirm(&#x27;Zresetować wszystkie dane?&#x27;))return;
  mrows=[{param:&#x27;Strumień świetlny (Φ)&#x27;,unit:&#x27;lm&#x27;,value:&#x27;0&#x27;,ref:&#x27;≥ 4 000&#x27;,status:&#x27;pass&#x27;},{param:&#x27;Skuteczność świetlna (η)&#x27;,unit:&#x27;lm/W&#x27;,value:&#x27;0&#x27;,ref:&#x27;≥ 110&#x27;,status:&#x27;pass&#x27;},{param:&#x27;CRI (Ra)&#x27;,unit:&#x27;—&#x27;,value:&#x27;0&#x27;,ref:&#x27;≥ 80&#x27;,status:&#x27;pass&#x27;}];
  renderMrows();updatePreview();
}

// ═══════════════════════════════════════════════
// MEASUREMENT ROWS UI
// ═══════════════════════════════════════════════
function renderMrows(){
  document.getElementById(&#x27;mrows-list&#x27;).innerHTML = mrows.map((m,i)=&gt;`
    &lt;div class=&quot;mrow&quot;&gt;
      &lt;div class=&quot;mrow-hdr&quot;&gt;
        &lt;span&gt;Parametr ${i+1}&lt;/span&gt;
        &lt;button onclick=&quot;removeMrow(${i})&quot;&gt;✕ Usuń&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;two-col&quot; style=&quot;margin-bottom:6px&quot;&gt;
        &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Nazwa parametru&lt;/label&gt;
          &lt;input class=&quot;fi&quot; type=&quot;text&quot; value=&quot;${m.param}&quot; oninput=&quot;mrows[${i}].param=this.value;updatePreview()&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Jednostka&lt;/label&gt;
          &lt;input class=&quot;fi&quot; type=&quot;text&quot; value=&quot;${m.unit}&quot; oninput=&quot;mrows[${i}].unit=this.value;updatePreview()&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;three-col&quot;&gt;
        &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Wynik&lt;/label&gt;
          &lt;input class=&quot;fi&quot; type=&quot;text&quot; value=&quot;${m.value}&quot; oninput=&quot;mrows[${i}].value=this.value;updatePreview()&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Norma / ref.&lt;/label&gt;
          &lt;input class=&quot;fi&quot; type=&quot;text&quot; value=&quot;${m.ref}&quot; oninput=&quot;mrows[${i}].ref=this.value;updatePreview()&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fg&quot;&gt;&lt;label&gt;Status&lt;/label&gt;
          &lt;select class=&quot;fi&quot; onchange=&quot;mrows[${i}].status=this.value;updatePreview()&quot;&gt;
            &lt;option value=&quot;pass&quot;${m.status===&#x27;pass&#x27;?&#x27; selected&#x27;:&#x27;&#x27;}&gt;PASS ✓&lt;/option&gt;
            &lt;option value=&quot;fail&quot;${m.status===&#x27;fail&#x27;?&#x27; selected&#x27;:&#x27;&#x27;}&gt;FAIL ✗&lt;/option&gt;
            &lt;option value=&quot;warn&quot;${m.status===&#x27;warn&#x27;?&#x27; selected&#x27;:&#x27;&#x27;}&gt;WARN !&lt;/option&gt;
          &lt;/select&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;);
}
function addMrow(){mrows.push({param:&#x27;Nowy parametr&#x27;,unit:&#x27;mg/L&#x27;,value:&#x27;0.00&#x27;,ref:&#x27;—&#x27;,status:&#x27;pass&#x27;});renderMrows();updatePreview();}
function removeMrow(i){mrows.splice(i,1);renderMrows();updatePreview();}

// ═══════════════════════════════════════════════
// BUILD PREVIEW HTML
// ═══════════════════════════════════════════════
function buildHTML(){
  const cp      = val(&#x27;clrPrimary&#x27;)   || &#x27;#1a3a5c&#x27;;
  const ca      = val(&#x27;clrAccent&#x27;)    || &#x27;#2980b9&#x27;;
  const ctb     = val(&#x27;clrTopBar&#x27;)    || &#x27;#2980b9&#x27;;
  const cth     = val(&#x27;clrTableHdr&#x27;)  || &#x27;#1a3a5c&#x27;;
  const ct      = val(&#x27;clrText&#x27;)      || &#x27;#1a1a2e&#x27;;
  const csn     = val(&#x27;clrSecNum&#x27;)    || &#x27;#2980b9&#x27;;
  const font    = val(&#x27;docFont&#x27;)      || &quot;&#x27;IBM Plex Sans&#x27;,sans-serif&quot;;
  const fs      = val(&#x27;fontSize&#x27;)     || 11;
  const lh      = val(&#x27;lineHeight&#x27;)   || 1.55;
  const pH      = parseInt(val(&#x27;padH&#x27;))  || 52;
  const pV      = parseInt(val(&#x27;padV&#x27;))  || 44;
  const tbH     = parseInt(val(&#x27;topBarH&#x27;))|| 6;
  const stripe  = val(&#x27;tableStripe&#x27;)===&#x27;1&#x27;;
  const hdrSt   = val(&#x27;hdrStyle&#x27;)     || &#x27;split&#x27;;
  const docType = val(&#x27;docType&#x27;)      || &#x27;SPRAWOZDANIE Z BADAŃ&#x27;;
  const docNum  = val(&#x27;docNum&#x27;)       || &#x27;&#x27;;
  const conClr  = val(&#x27;conclusionColor&#x27;) || &#x27;positive&#x27;;
  const conColors = {
    positive:{bg:&#x27;#eaf7f0&#x27;,border:&#x27;#27ae60&#x27;,lbl:&#x27;#1a7a4a&#x27;},
    negative:{bg:&#x27;#fdecea&#x27;,border:&#x27;#e74c3c&#x27;,lbl:&#x27;#c0392b&#x27;},
    neutral: {bg:&#x27;#e8f1fb&#x27;,border:&#x27;#2980b9&#x27;,lbl:&#x27;#1a4f82&#x27;},
    warning: {bg:&#x27;#fef9e7&#x27;,border:&#x27;#f39c12&#x27;,lbl:&#x27;#9a6e00&#x27;},
  };
  const cc = conColors[conClr] || conColors.positive;

  let h = `&lt;div style=&quot;font-family:${font};font-size:${fs}px;color:${ct};line-height:${lh}&quot;&gt;`;

  // TOP BAR
  if(tbH&gt;0) h+=`&lt;div class=&quot;rpt-top-bar&quot; style=&quot;height:${tbH}px;background:${ctb}&quot;&gt;&lt;/div&gt;`;

  h+=`&lt;div class=&quot;rpt-wrap&quot; style=&quot;padding:${pV}px ${pH}px ${pV+36}px&quot;&gt;`;

  // WATERMARK
  if(isOn(&#x27;incWatermark&#x27;)&amp;&amp;val(&#x27;watermarkText&#x27;)){
    h+=`&lt;div class=&quot;rpt-watermark&quot; style=&quot;color:${cp}&quot;&gt;${val(&#x27;watermarkText&#x27;)}&lt;/div&gt;`;
  }

  // ── MASTHEAD ──
  if(isOn(&#x27;incOrg&#x27;)){
    if(hdrSt===&#x27;split&#x27;){
      h+=`&lt;div class=&quot;rpt-masthead&quot;&gt;
        &lt;div class=&quot;rpt-org&quot;&gt;
          &lt;div class=&quot;rpt-org-name&quot; style=&quot;color:${cp}&quot;&gt;${val(&#x27;orgName&#x27;)}&lt;/div&gt;
          &lt;div class=&quot;rpt-org-sub&quot;&gt;${val(&#x27;orgSub&#x27;)}&lt;/div&gt;
          &lt;div class=&quot;rpt-org-addr&quot;&gt;${val(&#x27;orgAddr&#x27;).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}
            ${val(&#x27;orgPhone&#x27;)?&#x27;&lt;br&gt;Tel: &#x27;+val(&#x27;orgPhone&#x27;):&#x27;&#x27;}
            ${val(&#x27;orgEmail&#x27;)?&#x27;&amp;nbsp;&amp;nbsp;E: &#x27;+val(&#x27;orgEmail&#x27;):&#x27;&#x27;}
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;rpt-meta-box&quot;&gt;
          &lt;div class=&quot;rpt-doc-label&quot;&gt;Numer dokumentu&lt;/div&gt;
          &lt;div class=&quot;rpt-doc-id&quot; style=&quot;color:${cp}&quot;&gt;${docNum}&lt;/div&gt;
          &lt;div class=&quot;rpt-meta-grid&quot;&gt;
            ${val(&#x27;orgAccr&#x27;)?`&lt;div&gt;&lt;strong&gt;Akredytacja:&lt;/strong&gt; ${val(&#x27;orgAccr&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
            ${val(&#x27;orgNorm&#x27;)?`&lt;div&gt;&lt;strong&gt;Standard:&lt;/strong&gt; ${val(&#x27;orgNorm&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
            ${val(&#x27;docTestDate&#x27;)?`&lt;div&gt;&lt;strong&gt;Data badania:&lt;/strong&gt; ${val(&#x27;docTestDate&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
            ${val(&#x27;docIssueDate&#x27;)?`&lt;div&gt;&lt;strong&gt;Data wydania:&lt;/strong&gt; ${val(&#x27;docIssueDate&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
            ${val(&#x27;docVer&#x27;)?`&lt;div&gt;&lt;strong&gt;Wersja:&lt;/strong&gt; ${val(&#x27;docVer&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    } else if(hdrSt===&#x27;centered&#x27;){
      h+=`&lt;div style=&quot;text-align:center;margin-bottom:8px&quot;&gt;
        &lt;div class=&quot;rpt-org-name&quot; style=&quot;color:${cp};font-size:18px&quot;&gt;${val(&#x27;orgName&#x27;)}&lt;/div&gt;
        &lt;div class=&quot;rpt-org-sub&quot;&gt;${val(&#x27;orgSub&#x27;)}&lt;/div&gt;
        &lt;div class=&quot;rpt-org-addr&quot;&gt;${val(&#x27;orgAddr&#x27;).replace(/\n/g,&#x27; | &#x27;)}
          ${val(&#x27;orgPhone&#x27;)?&#x27;| Tel: &#x27;+val(&#x27;orgPhone&#x27;):&#x27;&#x27;}
          ${val(&#x27;orgEmail&#x27;)?&#x27;| &#x27;+val(&#x27;orgEmail&#x27;):&#x27;&#x27;}
        &lt;/div&gt;
        &lt;div style=&quot;margin-top:6px;font-size:9px;color:#888&quot;&gt;
          ${val(&#x27;orgAccr&#x27;)?&#x27;Akredytacja: &#x27;+val(&#x27;orgAccr&#x27;):&#x27;&#x27;}
          ${val(&#x27;orgNorm&#x27;)?&#x27;&amp;nbsp;·&amp;nbsp;&#x27;+val(&#x27;orgNorm&#x27;):&#x27;&#x27;}
        &lt;/div&gt;
      &lt;/div&gt;`;
    } else {
      h+=`&lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;padding:8px 0&quot;&gt;
        &lt;div style=&quot;font-size:14px;font-weight:700;color:${cp}&quot;&gt;${val(&#x27;orgName&#x27;)} — ${val(&#x27;orgSub&#x27;)}&lt;/div&gt;
        &lt;div style=&quot;font-size:9px;color:#888&quot;&gt;${docNum} | ${val(&#x27;docIssueDate&#x27;)}&lt;/div&gt;
      &lt;/div&gt;`;
    }
    h+=`&lt;div class=&quot;rpt-divider&quot; style=&quot;background:${ca};height:2px&quot;&gt;&lt;/div&gt;`;
  }

  // ── TITLE BLOCK ──
  h+=`&lt;div class=&quot;rpt-title-block&quot;&gt;
    &lt;div class=&quot;rpt-report-type&quot; style=&quot;color:${ca}&quot;&gt;${docType}&lt;/div&gt;
    &lt;div class=&quot;rpt-report-title&quot; style=&quot;color:${cp}&quot;&gt;${val(&#x27;reportTitle&#x27;)}&lt;/div&gt;
    ${val(&#x27;reportSub&#x27;)?`&lt;div class=&quot;rpt-report-subtitle&quot;&gt;${val(&#x27;reportSub&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
  &lt;/div&gt;`;

  // ── INFO BAND (sample) ──
  if(isOn(&#x27;incSample&#x27;)){
    h+=`&lt;div class=&quot;rpt-info-band&quot; style=&quot;border-color:${ca}33;margin:14px 0&quot;&gt;
      &lt;div class=&quot;rpt-info-cell&quot;&gt;
        &lt;div class=&quot;rpt-info-cell-lbl&quot;&gt;ID Obiektu&lt;/div&gt;
        &lt;div class=&quot;rpt-info-cell-val&quot; style=&quot;color:${cp}&quot;&gt;${val(&#x27;sampleId&#x27;)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-info-cell&quot;&gt;
        &lt;div class=&quot;rpt-info-cell-lbl&quot;&gt;Metoda&lt;/div&gt;
        &lt;div class=&quot;rpt-info-cell-val&quot;&gt;${val(&#x27;sampleMethod&#x27;)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-info-cell&quot;&gt;
        &lt;div class=&quot;rpt-info-cell-lbl&quot;&gt;Miejsce pomiaru&lt;/div&gt;
        &lt;div class=&quot;rpt-info-cell-val&quot;&gt;${val(&#x27;sampleLoc&#x27;)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-info-cell&quot;&gt;
        &lt;div class=&quot;rpt-info-cell-lbl&quot;&gt;Data pomiaru&lt;/div&gt;
        &lt;div class=&quot;rpt-info-cell-val&quot;&gt;${val(&#x27;sampleDate&#x27;)}&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  let secN = 1;

  // ── SECTION: CLIENT ──
  if(isOn(&#x27;incClient&#x27;)){
    h+=`&lt;div class=&quot;rpt-section&quot;&gt;
      &lt;div class=&quot;rpt-section-hdr&quot;&gt;
        &lt;div class=&quot;rpt-section-num&quot; style=&quot;background:${csn}&quot;&gt;${secN++}&lt;/div&gt;
        &lt;div class=&quot;rpt-section-title&quot;&gt;Zleceniodawca / Zamawiający / Zamawiający&lt;/div&gt;
      &lt;/div&gt;
      &lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:10px&quot;&gt;
        &lt;div&gt;
          &lt;div style=&quot;font-weight:700;color:${cp};margin-bottom:3px&quot;&gt;${val(&#x27;clientName&#x27;)}&lt;/div&gt;
          &lt;div style=&quot;color:#555&quot;&gt;${val(&#x27;clientAddr&#x27;).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;color:#555;font-size:9.5px;line-height:1.9&quot;&gt;
          ${val(&#x27;clientContact&#x27;)?`&lt;div&gt;&lt;strong style=&quot;color:#333&quot;&gt;Osoba kontaktowa:&lt;/strong&gt; ${val(&#x27;clientContact&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
          ${val(&#x27;clientOrder&#x27;)?`&lt;div&gt;&lt;strong style=&quot;color:#333&quot;&gt;Nr zlecenia:&lt;/strong&gt; ${val(&#x27;clientOrder&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  // ── SECTION: CONDITIONS ──
  if(isOn(&#x27;incConditions&#x27;)){
    h+=`&lt;div class=&quot;rpt-section&quot;&gt;
      &lt;div class=&quot;rpt-section-hdr&quot;&gt;
        &lt;div class=&quot;rpt-section-num&quot; style=&quot;background:${csn}&quot;&gt;${secN++}&lt;/div&gt;
        &lt;div class=&quot;rpt-section-title&quot;&gt;Warunki przeprowadzenia pomiarów&lt;/div&gt;
      &lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:0;border:1px solid #eee;border-radius:3px;overflow:hidden;font-size:9.5px;width:fit-content&quot;&gt;
        ${[[&#x27;Temperatura&#x27;,val(&#x27;condTemp&#x27;)+&#x27;°C&#x27;],[&#x27;Wilgotność wzgl.&#x27;,val(&#x27;condHum&#x27;)+&#x27;%&#x27;],[&#x27;Ciśnienie atm.&#x27;,val(&#x27;condPress&#x27;)+&#x27; hPa&#x27;]].map(([l,v])=&gt;`
          &lt;div style=&quot;padding:8px 16px;border-right:1px solid #eee&quot;&gt;
            &lt;div style=&quot;font-size:7.5px;text-transform:uppercase;letter-spacing:.1em;color:#aaa;margin-bottom:3px&quot;&gt;${l}&lt;/div&gt;
            &lt;div style=&quot;font-weight:700;color:${cp};font-size:12px&quot;&gt;${v}&lt;/div&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;)}
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  // ── SECTION: RESULTS TABLE ── (grouped by source with separators)
  if(isOn(&#x27;incTable&#x27;)&amp;&amp;mrows.length&gt;0){
    // Group rows by source
    const srcOrder = [&#x27;CRI&#x27;, &#x27;CC&#x27;, &#x27;CM&#x27;, &#x27;SA&#x27;, &#x27;manual&#x27;];
    const srcLabel = {CRI:&#x27;Colour Analyzer (CRI)&#x27;, CC:&#x27;Colour Calculator&#x27;, CM:&#x27;Colour Mixer&#x27;, SA:&#x27;Spectral Analyzer&#x27;, manual:&#x27;Parametry ręczne&#x27;};
    const grouped = {};
    mrows.forEach(m =&gt; { const s = m._src || &#x27;manual&#x27;; if(!grouped[s]) grouped[s]=[]; grouped[s].push(m); });
    const sources = srcOrder.filter(s =&gt; grouped[s] &amp;&amp; grouped[s].length &gt; 0);
    // Also add any sources not in srcOrder
    Object.keys(grouped).forEach(s =&gt; { if(!sources.includes(s)) sources.push(s); });

    let rowGlobalIdx = 0;
    let tableHTML = &#x27;&#x27;;
    sources.forEach((src, si) =&gt; {
      const srcRows = grouped[src];
      const srcLbl = srcLabel[src] || src;
      const chartImg = (typeof importedCharts !== &#x27;undefined&#x27;) ? importedCharts[src] : null;
      // Source separator header
      if(sources.length &gt; 1) {
        tableHTML += `&lt;tr&gt;&lt;td colspan=&quot;6&quot; style=&quot;background:#f0f2f8;padding:5px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#555;border-top:${si&gt;0?&#x27;2px solid #d0d4e8&#x27;:&#x27;none&#x27;}&quot;&gt;
          &lt;span style=&quot;background:${csn};color:#fff;border-radius:2px;padding:1px 5px;font-size:8px;margin-right:6px&quot;&gt;${src}&lt;/span&gt;${srcLbl}
        &lt;/td&gt;&lt;/tr&gt;`;
      }
      srcRows.forEach((m) =&gt; {
        const i = rowGlobalIdx++;
        const bd = stripe&amp;&amp;i%2===1?&#x27;background:#f8f9fb&#x27;:&#x27;&#x27;;
        const bs = m.status===&#x27;pass&#x27;?&#x27;badge-pass&#x27;:m.status===&#x27;fail&#x27;?&#x27;badge-fail&#x27;:&#x27;badge-warn&#x27;;
        tableHTML += `&lt;tr style=&quot;${bd}&quot;&gt;
          &lt;td class=&quot;c&quot; style=&quot;color:#999;font-size:9px&quot;&gt;${i+1}&lt;/td&gt;
          &lt;td style=&quot;font-weight:500;color:${ct}&quot;&gt;${m.param}&lt;/td&gt;
          &lt;td class=&quot;c mono&quot;&gt;${m.unit}&lt;/td&gt;
          &lt;td class=&quot;r mono&quot; style=&quot;font-weight:700;color:${cp}&quot;&gt;${m.value}&lt;/td&gt;
          &lt;td class=&quot;r&quot; style=&quot;color:#666;font-size:9px&quot;&gt;${m.ref}&lt;/td&gt;
          &lt;td class=&quot;c&quot;&gt;&lt;span class=&quot;${bs}&quot;&gt;${m.status.toUpperCase()}&lt;/span&gt;&lt;/td&gt;
        &lt;/tr&gt;`;
      });
      // Chart image row
      if(chartImg) {
        tableHTML += `&lt;tr&gt;&lt;td colspan=&quot;6&quot; style=&quot;padding:8px 6px 4px;&quot;&gt;
          &lt;div style=&quot;font-size:8px;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px&quot;&gt;Wykres — ${srcLbl}&lt;/div&gt;
          &lt;img src=&quot;${chartImg}&quot; style=&quot;max-width:100%;border-radius:4px;border:1px solid #e8eaf0&quot; alt=&quot;wykres ${src}&quot;&gt;
        &lt;/td&gt;&lt;/tr&gt;`;
      }
    });
    const rows = tableHTML;
    h+=`&lt;div class=&quot;rpt-section&quot;&gt;
      &lt;div class=&quot;rpt-section-hdr&quot;&gt;
        &lt;div class=&quot;rpt-section-num&quot; style=&quot;background:${csn}&quot;&gt;${secN++}&lt;/div&gt;
        &lt;div class=&quot;rpt-section-title&quot;&gt;Wyniki badań&lt;/div&gt;
      &lt;/div&gt;
      &lt;table class=&quot;rpt-table&quot;&gt;
        &lt;thead&gt;&lt;tr style=&quot;background:${cth}&quot;&gt;
          &lt;th class=&quot;c&quot; style=&quot;width:28px&quot;&gt;#&lt;/th&gt;
          &lt;th&gt;Parametr&lt;/th&gt;
          &lt;th class=&quot;c&quot; style=&quot;width:80px&quot;&gt;Jednostka&lt;/th&gt;
          &lt;th class=&quot;r&quot; style=&quot;width:80px&quot;&gt;Wynik&lt;/th&gt;
          &lt;th class=&quot;r&quot; style=&quot;width:110px&quot;&gt;Wartość ref.&lt;/th&gt;
          &lt;th class=&quot;c&quot; style=&quot;width:70px&quot;&gt;Status&lt;/th&gt;
        &lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;${rows}&lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;`;
  }

  // ── SUMMARY CARDS ──
  if(isOn(&#x27;incSummary&#x27;)){
    const rs = val(&#x27;summResult&#x27;);
    const rsBg = rs===&#x27;ZGODNY&#x27;?&#x27;#eaf7f0&#x27;:rs===&#x27;NIEZGODNY&#x27;?&#x27;#fdecea&#x27;:&#x27;#fef9e7&#x27;;
    const rsClr = rs===&#x27;ZGODNY&#x27;?&#x27;#1a7a4a&#x27;:rs===&#x27;NIEZGODNY&#x27;?&#x27;#c0392b&#x27;:&#x27;#9a6e00&#x27;;
    const pass = mrows.filter(m=&gt;m.status===&#x27;pass&#x27;).length;
    const fail = mrows.filter(m=&gt;m.status===&#x27;fail&#x27;).length;
    const warn = mrows.filter(m=&gt;m.status===&#x27;warn&#x27;).length;
    h+=`&lt;div class=&quot;rpt-summary&quot;&gt;
      &lt;div class=&quot;rpt-sum-card&quot; style=&quot;background:${rsBg};border-color:${rsClr}40&quot;&gt;
        &lt;div class=&quot;rpt-sum-card-lbl&quot;&gt;Wynik ogólny&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-val&quot; style=&quot;color:${rsClr};font-size:13px&quot;&gt;${rs}&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-sub&quot;&gt;Ocena końcowa próbki&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-sum-card&quot;&gt;
        &lt;div class=&quot;rpt-sum-card-lbl&quot;&gt;Zgodność parametrów&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-val&quot; style=&quot;color:${cp}&quot;&gt;${val(&#x27;summPct&#x27;)}%&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-sub&quot;&gt;${pass} PASS / ${warn} WARN / ${fail} FAIL&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-sum-card&quot;&gt;
        &lt;div class=&quot;rpt-sum-card-lbl&quot;&gt;Niepewność pomiaru&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-val&quot; style=&quot;color:${cp}&quot;&gt;±${val(&#x27;summUnc&#x27;)}&lt;/div&gt;
        &lt;div class=&quot;rpt-sum-card-sub&quot;&gt;Poziom ufności: 95%&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  // ── REMARKS ──
  if(isOn(&#x27;incRemarks&#x27;)&amp;&amp;val(&#x27;remarksText&#x27;)){
    h+=`&lt;div class=&quot;rpt-section&quot;&gt;
      &lt;div class=&quot;rpt-section-hdr&quot;&gt;
        &lt;div class=&quot;rpt-section-num&quot; style=&quot;background:${csn}&quot;&gt;${secN++}&lt;/div&gt;
        &lt;div class=&quot;rpt-section-title&quot;&gt;Uwagi i obserwacje&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-remarks&quot; style=&quot;border-left-color:${ca}&quot;&gt;
        ${val(&#x27;remarksText&#x27;).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  // ── CONCLUSION ──
  if(isOn(&#x27;incConclusion&#x27;)&amp;&amp;val(&#x27;conclusionText&#x27;)){
    h+=`&lt;div class=&quot;rpt-section&quot;&gt;
      &lt;div class=&quot;rpt-section-hdr&quot;&gt;
        &lt;div class=&quot;rpt-section-num&quot; style=&quot;background:${csn}&quot;&gt;${secN++}&lt;/div&gt;
        &lt;div class=&quot;rpt-section-title&quot;&gt;Wniosek końcowy&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rpt-conclusion&quot; style=&quot;background:${cc.bg};border-color:${cc.border}40&quot;&gt;
        &lt;div class=&quot;rpt-conclusion-lbl&quot; style=&quot;color:${cc.lbl}&quot;&gt;Wniosek&lt;/div&gt;
        &lt;div class=&quot;rpt-conclusion-text&quot;&gt;${val(&#x27;conclusionText&#x27;).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }

  // ── SIGNATURES ──
  if(isOn(&#x27;incSigs&#x27;)){
    h+=`&lt;div class=&quot;rpt-sigs&quot;&gt;
      ${[[val(&#x27;sig1name&#x27;),val(&#x27;sig1role&#x27;)],[val(&#x27;sig2name&#x27;),val(&#x27;sig2role&#x27;)],[val(&#x27;sig3name&#x27;),val(&#x27;sig3role&#x27;)]].map(([n,r])=&gt;`
        &lt;div class=&quot;rpt-sig&quot;&gt;
          &lt;div class=&quot;rpt-sig-role&quot;&gt;${r}&lt;/div&gt;
          &lt;div class=&quot;rpt-sig-name&quot;&gt;${n}&lt;/div&gt;
        &lt;/div&gt;`).join(&#x27;&#x27;)}
    &lt;/div&gt;`;
  }

  h+=`&lt;/div&gt;`; // end rpt-wrap

  // ── FOOTER ──
  if(isOn(&#x27;incFooter&#x27;)){
    h+=`&lt;div class=&quot;rpt-footer&quot;&gt;
      &lt;span&gt;${val(&#x27;orgName&#x27;)}&lt;/span&gt;
      &lt;span&gt;${docType} | ${docNum}&lt;/span&gt;
      &lt;span&gt;Strona 1 / 1 &amp;nbsp;·&amp;nbsp; ${val(&#x27;docIssueDate&#x27;)}&lt;/span&gt;
      &lt;div class=&quot;rpt-footer-bar&quot; style=&quot;background:${ctb};height:3px&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;`;
  }

  h+=`&lt;/div&gt;`;
  return h;
}

// UPDATE PREVIEW
// ═══════════════════════════════════════════════
function updatePreview(){
  const sheet = document.getElementById(&#x27;sheet&#x27;);
  sheet.style.fontFamily = val(&#x27;docFont&#x27;)||&quot;&#x27;IBM Plex Sans&#x27;,sans-serif&quot;;
  sheet.innerHTML = buildHTML();
  sheet.style.transform = `scale(${scale})`;
  sheet.style.transformOrigin = &#x27;top center&#x27;;
}

// ═══════════════════════════════════════════════
// GENERATE PDF — jsPDF + polskie znaki + wielostronicowość
// ═══════════════════════════════════════════════
function generatePDF(){
  if(typeof window.jspdf===&#x27;undefined&#x27;){alert(&#x27;Biblioteka jsPDF się ładuje, spróbuj za chwilę.&#x27;);return;}
  const {jsPDF}=window.jspdf;

  // ── Polskie znaki: transliteracja dla jsPDF/helvetica ──
  function pl(s){
    if(!s) return &#x27;&#x27;;
    return String(s)
      .replace(/ą/g,&#x27;a&#x27;).replace(/Ą/g,&#x27;A&#x27;)
      .replace(/ć/g,&#x27;c&#x27;).replace(/Ć/g,&#x27;C&#x27;)
      .replace(/ę/g,&#x27;e&#x27;).replace(/Ę/g,&#x27;E&#x27;)
      .replace(/ł/g,&#x27;l&#x27;).replace(/Ł/g,&#x27;L&#x27;)
      .replace(/ń/g,&#x27;n&#x27;).replace(/Ń/g,&#x27;N&#x27;)
      .replace(/ó/g,&#x27;o&#x27;).replace(/Ó/g,&#x27;O&#x27;)
      .replace(/ś/g,&#x27;s&#x27;).replace(/Ś/g,&#x27;S&#x27;)
      .replace(/ź/g,&#x27;z&#x27;).replace(/Ź/g,&#x27;Z&#x27;)
      .replace(/ż/g,&#x27;z&#x27;).replace(/Ż/g,&#x27;Z&#x27;);
  }

  const doc=new jsPDF({unit:&#x27;mm&#x27;,format:&#x27;a4&#x27;});
  const W=210,H=297,ml=16,mr=16;
  const bottomMargin=20; // reserve space for footer
  let y=0;
  let pageNum=1;
  let totalPagesPlaceholder=&#x27;{TP}&#x27;;

  const cp   = val(&#x27;clrPrimary&#x27;)  ||&#x27;#1a3a5c&#x27;;
  const ca   = val(&#x27;clrAccent&#x27;)   ||&#x27;#2980b9&#x27;;
  const ctb  = val(&#x27;clrTopBar&#x27;)   ||&#x27;#2980b9&#x27;;
  const cth  = val(&#x27;clrTableHdr&#x27;) ||&#x27;#1a3a5c&#x27;;
  const ct   = val(&#x27;clrText&#x27;)     ||&#x27;#1a1a2e&#x27;;
  const tbH  = parseInt(val(&#x27;topBarH&#x27;))||6;
  const stripe=val(&#x27;tableStripe&#x27;)===&#x27;1&#x27;;
  const docType=pl(val(&#x27;docType&#x27;))||&#x27;SPRAWOZDANIE Z BADAN&#x27;;
  const docNum =val(&#x27;docNum&#x27;)||&#x27;&#x27;;

  function sC(hex){const[r,g,b]=hex2rgb(hex);doc.setTextColor(Math.round(r*255),Math.round(g*255),Math.round(b*255));}
  function sF(hex){const[r,g,b]=hex2rgb(hex);doc.setFillColor(Math.round(r*255),Math.round(g*255),Math.round(b*255));}
  function sD(hex){const[r,g,b]=hex2rgb(hex);doc.setDrawColor(Math.round(r*255),Math.round(g*255),Math.round(b*255));}

  // Track footer draw positions for later total-pages fixup
  const footerDraws=[];

  function drawFooter(){
    if(!isOn(&#x27;incFooter&#x27;)) return;
    sD(&#x27;#e0e0e0&#x27;);doc.setLineWidth(0.2);doc.line(ml,H-14,W-mr,H-14);
    doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(7);sC(&#x27;#bbbbbb&#x27;);
    doc.text(pl(val(&#x27;orgName&#x27;)),ml,H-9);
    doc.text(docType+&#x27; | &#x27;+docNum,W/2,H-9,{align:&#x27;center&#x27;});
    const pageLabel=&#x27;Strona &#x27;+pageNum+&#x27; / &#x27;+totalPagesPlaceholder+&#x27;  .  &#x27;+val(&#x27;docIssueDate&#x27;);
    doc.text(pageLabel,W-mr,H-9,{align:&#x27;right&#x27;});
    if(tbH&gt;0){sF(ctb);doc.rect(0,H-3,W,3,&#x27;F&#x27;);}
    footerDraws.push({page:pageNum,str:pageLabel,x:W-mr,y:H-9});
  }

  function newPage(){
    drawFooter();
    doc.addPage();
    pageNum++;
    // Re-draw top bar on new page
    if(tbH&gt;0){
      sF(ctb);doc.rect(0,0,W,tbH*0.35,&#x27;F&#x27;);
      y=tbH*0.35+8;
    } else {y=10;}
  }

  // Guard: if y is too close to bottom, start new page
  function checkPage(needed){
    if(y+needed &gt; H-bottomMargin) newPage();
  }

  // ─ TOP BAR ─
  if(tbH&gt;0){
    sF(ctb);doc.rect(0,0,W,tbH*0.35,&#x27;F&#x27;);
    y=tbH*0.35+8;
  } else {y=10;}

  // ─ MASTHEAD ─
  if(isOn(&#x27;incOrg&#x27;)){
    checkPage(30);
    doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(14);sC(cp);
    doc.text(pl(val(&#x27;orgName&#x27;)),ml,y);
    doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(7.5);sC(&#x27;#888888&#x27;);
    y+=5;doc.text(pl(val(&#x27;orgSub&#x27;)),ml,y);
    y+=4;
    const addrL=pl([val(&#x27;orgAddr&#x27;),...(val(&#x27;orgPhone&#x27;)?[&#x27;Tel: &#x27;+val(&#x27;orgPhone&#x27;)]:[]),(val(&#x27;orgEmail&#x27;)?[&#x27;E: &#x27;+val(&#x27;orgEmail&#x27;)]:[])].join(&#x27; | &#x27;));
    sC(&#x27;#777777&#x27;);doc.setFontSize(7);doc.text(addrL,ml,y,{maxWidth:W-ml-mr-60});
    let ry=y-9;
    doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(12);sC(cp);
    doc.text(docNum,W-mr,ry,{align:&#x27;right&#x27;});ry+=5;
    doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(7.5);sC(&#x27;#777777&#x27;);
    const metaR=[];
    if(val(&#x27;orgAccr&#x27;)) metaR.push(pl(&#x27;Akredytacja: &#x27;+val(&#x27;orgAccr&#x27;)));
    if(val(&#x27;orgNorm&#x27;)) metaR.push(&#x27;Standard: &#x27;+val(&#x27;orgNorm&#x27;));
    if(val(&#x27;docTestDate&#x27;)) metaR.push(pl(&#x27;Data badania: &#x27;)+val(&#x27;docTestDate&#x27;));
    if(val(&#x27;docIssueDate&#x27;)) metaR.push(pl(&#x27;Data wydania: &#x27;)+val(&#x27;docIssueDate&#x27;));
    if(val(&#x27;docVer&#x27;)) metaR.push(&#x27;Wersja: &#x27;+val(&#x27;docVer&#x27;));
    metaR.forEach(l=&gt;{doc.text(l,W-mr,ry,{align:&#x27;right&#x27;});ry+=4;});
    y+=8;
    sF(ca);sD(ca);doc.setLineWidth(0.5);doc.rect(ml,y,W-ml-mr,0.5,&#x27;F&#x27;);
    y+=6;
  }

  // ─ TITLE ─
  checkPage(20);
  doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(7.5);sC(ca);
  doc.text(docType,ml,y);y+=5;
  doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(14);sC(cp);
  const titleLines=doc.splitTextToSize(pl(val(&#x27;reportTitle&#x27;)),W-ml-mr);
  titleLines.forEach(l=&gt;{checkPage(7);doc.text(l,ml,y);y+=6;});
  if(val(&#x27;reportSub&#x27;)){
    doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(9);sC(&#x27;#555555&#x27;);
    checkPage(6);doc.text(pl(val(&#x27;reportSub&#x27;)),ml,y);y+=5;
  }
  sD(&#x27;#e0e0e0&#x27;);doc.setLineWidth(0.2);doc.line(ml,y,W-mr,y);y+=6;

  // ─ INFO BAND ─
  if(isOn(&#x27;incSample&#x27;)){
    checkPage(16);
    const cells=[[&#x27;ID Obiektu&#x27;,val(&#x27;sampleId&#x27;)],[pl(&#x27;Metoda&#x27;),val(&#x27;sampleMethod&#x27;)],[pl(&#x27;Miejsce pomiaru&#x27;),val(&#x27;sampleLoc&#x27;)],[&#x27;Data pomiaru&#x27;,val(&#x27;sampleDate&#x27;)]];
    const cw=(W-ml-mr)/4;
    sD(&#x27;#e0e0e0&#x27;);doc.setLineWidth(0.2);doc.rect(ml,y,W-ml-mr,14,&#x27;S&#x27;);
    cells.forEach(([lbl,v],i)=&gt;{
      const cx=ml+i*cw;
      if(i&gt;0){doc.line(cx,y,cx,y+14);}
      doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(6.5);sC(&#x27;#aaaaaa&#x27;);
      doc.text(pl(lbl).toUpperCase(),cx+3,y+4.5);
      doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(8.5);sC(cp);
      doc.text(pl(doc.splitTextToSize(v,cw-6)[0]),cx+3,y+10);
    });
    y+=19;
  }

  // section counter
  let secN=1;
  function secHdr(title){
    checkPage(14);
    sF(val(&#x27;clrSecNum&#x27;)||ca);
    doc.rect(ml,y-3.5,5,5,&#x27;F&#x27;);
    doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(7);sC(&#x27;#ffffff&#x27;);
    doc.text(String(secN++),ml+2.5,y,{align:&#x27;center&#x27;});
    doc.setFont(&#x27;helvetica&#x27;,&#x27;bold&#x27;);doc.setFontSize(7.5);sC(&#x27;#555555&#x27;);
    doc.text(pl(title).toUpperCase(),ml+8,y);

    doc.setFont(&#x27;helvetica&#x27;,&#x27;normal&#x27;);doc.setFontSize(9);sC(ct);
    clines.forEach((l,i)=&gt;doc.text(l,ml+5,y+9+i*4.5));

  // ─ SIGNATURES ─

  // ─ FOOTER on last page ─

  // Fix total pages placeholder in all footers

// ════════════════════════════════════════════
// IMPORT Z LED TOOLS — postMessage listener
// ════════════════════════════════════════════
const WIN_IDS = { CRI: 0, CC: 1, CM: 2, SA: 3 };

// Storage for imported chart images (keyed by source: CRI, CC, CM, SA)
const importedCharts = {};

function requestImport(source) {
  const idx = WIN_IDS[source];
  if (idx === undefined) return;
  setStatus(&#x27;import-status&#x27;, &#x27;⟳ Żądanie wysłane do &#x27; + source + &#x27; — naciśnij &quot;Eksportuj do PDF&quot; w oknie &#x27; + source + &#x27;...&#x27;, &#x27;&#x27;);
  
  // Highlight the button
  document.querySelectorAll(&#x27;.import-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
  const btn = document.getElementById(&#x27;imp-btn-&#x27; + source);
  if (btn) btn.classList.add(&#x27;active&#x27;);
  
  // Try to trigger export from the sibling iframe via parent
  try {
    window.parent.postMessage({type: &#x27;LED_TOOLS_REQUEST_EXPORT&#x27;, source}, &#x27;*&#x27;);
  } catch(e) {}
}

function setStatus(id, msg, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = &#x27;import-status&#x27; + (cls ? &#x27; &#x27; + cls : &#x27;&#x27;);
}

function applyImport(payload) {
  const {source, data} = payload;
  let rows = [];
  
  if (source === &#x27;CRI&#x27;) {
    // Ra overall
    if (data.Ra &amp;&amp; data.Ra !== &#x27;—&#x27;) {
      const ra = parseInt(data.Ra);
      rows.push({param: &#x27;CRI (Ra)&#x27;, unit: &#x27;—&#x27;, value: data.Ra, ref: &#x27;≥ 80&#x27;, status: ra &gt;= 80 ? &#x27;pass&#x27; : ra &gt;= 70 ? &#x27;warn&#x27; : &#x27;fail&#x27;});
    }
    // R1–R8 individual (special colour rendering indices)
    const r1to8labels = [&#x27;R1 (szary)&#x27;,&#x27;R2 (żółty)&#x27;,&#x27;R3 (zielony)&#x27;,&#x27;R4 (oliwkowy)&#x27;,&#x27;R5 (pomarańcz.)&#x27;,&#x27;R6 (niebieski)&#x27;,&#x27;R7 (fioletowy)&#x27;,&#x27;R8 (różowy)&#x27;];
    if (data.riData) {
      data.riData.slice(0, 8).forEach((ri, i) =&gt; {
        if (ri.value === &#x27;—&#x27;) return;
        const v = parseInt(ri.value);
        rows.push({param: r1to8labels[i] || ri.label, unit: &#x27;—&#x27;, value: ri.value, ref: &#x27;≥ 80&#x27;, status: v &gt;= 80 ? &#x27;pass&#x27; : v &gt;= 70 ? &#x27;warn&#x27; : &#x27;fail&#x27;});
      });
    }
    if (data.leds &amp;&amp; data.leds.length) {
      // annotate sample ID with LED config
      const ledStr = data.leds.map(l =&gt; l.name.replace(/\s+/g,&#x27; &#x27;)).join(&#x27;, &#x27;);
      try { document.getElementById(&#x27;sampleId&#x27;).value = &#x27;LED: &#x27; + ledStr.substring(0,40); } catch(e) {}
    }
  }
  
  else if (source === &#x27;CC&#x27;) {
    const numOrDash = v =&gt; (v &amp;&amp; v !== &#x27;—&#x27;) ? v : &#x27;—&#x27;;
    if (data.x &amp;&amp; data.x !== &#x27;—&#x27;) rows.push({param: &#x27;Wsp. barwy x (CIE 1931)&#x27;, unit: &#x27;—&#x27;, value: numOrDash(data.x), ref: &#x27;0.300 – 0.450&#x27;, status: &#x27;pass&#x27;});
    if (data.y &amp;&amp; data.y !== &#x27;—&#x27;) rows.push({param: &#x27;Wsp. barwy y (CIE 1931)&#x27;, unit: &#x27;—&#x27;, value: numOrDash(data.y), ref: &#x27;0.300 – 0.430&#x27;, status: &#x27;pass&#x27;});
    if (data.z &amp;&amp; data.z !== &#x27;—&#x27;) rows.push({param: &#x27;Wsp. barwy z (CIE 1931)&#x27;, unit: &#x27;—&#x27;, value: numOrDash(data.z), ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    if (data.lm &amp;&amp; data.lm !== &#x27;—&#x27;) {
      const lm = parseInt(data.lm);
      rows.push({param: &#x27;Jasność względna (Lm)&#x27;, unit: &#x27;lm (wz.)&#x27;, value: numOrDash(data.lm), ref: &#x27;≥ 80&#x27;, status: lm &gt;= 80 ? &#x27;pass&#x27; : &#x27;warn&#x27;});
    }
    if (data.cct &amp;&amp; data.cct !== &#x27;—&#x27; &amp;&amp; data.cct !== &#x27; K&#x27;) {
      const cctNum = parseInt(data.cct);
      rows.push({param: &#x27;Temperatura barwowa (CCT)&#x27;, unit: &#x27;K&#x27;, value: data.cct.replace(&#x27; K&#x27;,&#x27;&#x27;), ref: &#x27;2700 – 6500&#x27;, status: (cctNum &gt;= 2700 &amp;&amp; cctNum &lt;= 6500) ? &#x27;pass&#x27; : &#x27;warn&#x27;});
    }
    if (data.hex &amp;&amp; data.hex !== &#x27;—&#x27;) {
      rows.push({param: &#x27;Kolor wynikowy (HEX)&#x27;, unit: &#x27;—&#x27;, value: data.hex, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
      try { document.getElementById(&#x27;sampleId&#x27;).value = &#x27;Barwa: &#x27; + data.hex; } catch(e) {}
    }
    if (data.rgb &amp;&amp; data.rgb !== &#x27;—&#x27;) {
      rows.push({param: &#x27;Kolor wynikowy (RGB)&#x27;, unit: &#x27;—&#x27;, value: data.rgb, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    }
  }
  
  else if (source === &#x27;CM&#x27;) {
    // CIE x, y coordinates of mix point
    if (data.x &amp;&amp; data.x !== &#x27;—&#x27;) rows.push({param: &#x27;Wsp. x mieszaniny (CIE 1931)&#x27;, unit: &#x27;—&#x27;, value: data.x, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    if (data.y &amp;&amp; data.y !== &#x27;—&#x27;) rows.push({param: &#x27;Wsp. y mieszaniny (CIE 1931)&#x27;, unit: &#x27;—&#x27;, value: data.y, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    if (data.lm &amp;&amp; data.lm !== &#x27;—&#x27;) {
      const lmNum = parseFloat(data.lm);
      rows.push({param: &#x27;Strumień świetlny (Lm total)&#x27;, unit: &#x27;lm&#x27;, value: data.lm.replace(&#x27; lm&#x27;,&#x27;&#x27;), ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    }
    if (data.channels &amp;&amp; data.channels !== &#x27;—&#x27; &amp;&amp; data.channels !== &#x27;&#x27;) {
      rows.push({param: &#x27;Konfiguracja kanałów LED&#x27;, unit: &#x27;PWM&#x27;, value: data.channels, ref: &#x27;0–255&#x27;, status: &#x27;pass&#x27;});
      try { document.getElementById(&#x27;reportSub&#x27;).value = &#x27;Mieszanie barw LED: &#x27; + data.channels; } catch(e) {}
    }
    if (data.x) {
      try { document.getElementById(&#x27;sampleId&#x27;).value = &#x27;Mix CIE: x=&#x27; + data.x + &#x27; y=&#x27; + data.y; } catch(e) {}
    }
  }
  
  else if (source === &#x27;SA&#x27;) {
    if (data.peakWl &amp;&amp; data.peakWl !== &#x27;—&#x27;) rows.push({param: &#x27;Długość fali max. (λ_peak)&#x27;, unit: &#x27;nm&#x27;, value: data.peakWl.replace(&#x27; nm&#x27;,&#x27;&#x27;), ref: &#x27;380 – 780&#x27;, status: &#x27;pass&#x27;});
    if (data.peakVal &amp;&amp; data.peakVal !== &#x27;—&#x27;) rows.push({param: &#x27;Wartość maksymalna sygnału&#x27;, unit: &#x27;mW/m²/nm&#x27;, value: data.peakVal, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    if (data.integ &amp;&amp; data.integ !== &#x27;—&#x27;) rows.push({param: &#x27;Czas integracji&#x27;, unit: &#x27;µs&#x27;, value: data.integ, ref: &#x27;—&#x27;, status: &#x27;pass&#x27;});
    if (data.signal &amp;&amp; data.signal !== &#x27;—&#x27;) {
      const sig = parseFloat(data.signal);
      rows.push({param: &#x27;Poziom sygnału&#x27;, unit: &#x27;%&#x27;, value: data.signal.replace(&#x27; %&#x27;,&#x27;&#x27;), ref: &#x27;20 – 90&#x27;, status: (sig &gt;= 20 &amp;&amp; sig &lt;= 90) ? &#x27;pass&#x27; : sig &lt; 20 ? &#x27;warn&#x27; : &#x27;fail&#x27;});
    }
    if (data.temp &amp;&amp; data.temp !== &#x27;—&#x27;) rows.push({param: &#x27;Temperatura czujnika&#x27;, unit: &#x27;°C&#x27;, value: data.temp.replace(&#x27; °C&#x27;,&#x27;&#x27;), ref: &#x27;10 – 40&#x27;, status: &#x27;pass&#x27;});
    if (data.cal &amp;&amp; data.cal !== &#x27;—&#x27;) {
      try { document.getElementById(&#x27;orgAccr&#x27;).value = &#x27;Kalibracja: &#x27; + data.cal; } catch(e) {}
    }
    if (data.measDate &amp;&amp; data.measDate !== &#x27;—&#x27;) {
      try { document.getElementById(&#x27;docTestDate&#x27;).value = data.measDate; } catch(e) {}
      try { document.getElementById(&#x27;sampleDate&#x27;).value = data.measDate; } catch(e) {}
    }
  }
  
  if (rows.length === 0) {
    setStatus(&#x27;import-status&#x27;, &#x27;⚠ Brak danych do importu — wykonaj pomiar w oknie &#x27; + source + &#x27; przed eksportem&#x27;, &#x27;err&#x27;);
    return;
  }
  
  // Store chart image per source
  if (data.chartImage) {
    importedCharts[source] = data.chartImage;
  }
  
  // Merge: replace existing rows or append
  const existingSources = mrows.filter(r =&gt; r._src === source);
  if (existingSources.length &gt; 0) {
    // Remove old rows from this source
    mrows = mrows.filter(r =&gt; r._src !== source);
  }
  rows.forEach(r =&gt; r._src = source);
  mrows = mrows.concat(rows);
  
  renderMrows();
  updatePreview();
  
  // Show preview
  showImportPreview(source, rows, data.chartImage);
  setStatus(&#x27;import-status&#x27;, &#x27;✓ Zaimportowano &#x27; + rows.length + &#x27; parametr(ów) z &#x27; + source + (data.chartImage ? &#x27; (z wykresem)&#x27; : &#x27;&#x27;), &#x27;ok&#x27;);
  
  // Remove active highlight from button
  setTimeout(() =&gt; {
    const btn = document.getElementById(&#x27;imp-btn-&#x27; + source);
    if (btn) btn.classList.remove(&#x27;active&#x27;);
  }, 2000);
}

function showImportPreview(source, rows, chartImage) {
  const el = document.getElementById(&#x27;import-preview&#x27;);
  if (!el) return;
  el.classList.add(&#x27;visible&#x27;);
  const srcLabel = {CRI: &#x27;Colour Analyzer&#x27;, CC: &#x27;Colour Calculator&#x27;, CM: &#x27;Colour Mixer&#x27;, SA: &#x27;Spectral Analyzer&#x27;};
  const imgHtml = chartImage ? `&lt;div style=&quot;margin-top:8px&quot;&gt;
    &lt;div style=&quot;font-size:8px;color:var(--muted);font-family:&#x27;Space Mono&#x27;,monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px&quot;&gt;Podgląd graficzny&lt;/div&gt;
    &lt;img src=&quot;${chartImage}&quot; style=&quot;max-width:100%;border-radius:5px;border:1px solid var(--border)&quot; alt=&quot;wykres&quot;&gt;
  &lt;/div&gt;` : &#x27;&#x27;;
  el.innerHTML = `&lt;div style=&quot;font-size:9px;color:var(--muted);font-family:&#x27;Space Mono&#x27;,monospace;letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase&quot;&gt;${source} — ${srcLabel[source]||source}&lt;/div&gt;`
    + &#x27;&lt;table&gt;&#x27; + rows.map(r =&gt;
    `&lt;tr&gt;
      &lt;td style=&quot;color:var(--accent2);white-space:nowrap&quot;&gt;${r.param}&lt;/td&gt;
      &lt;td style=&quot;color:var(--text);font-weight:600;text-align:right&quot;&gt;${r.value}&lt;/td&gt;
      &lt;td style=&quot;color:var(--muted)&quot;&gt;${r.unit}&lt;/td&gt;
      &lt;td style=&quot;color:${r.status===&#x27;pass&#x27;?&#x27;#27ae60&#x27;:r.status===&#x27;fail&#x27;?&#x27;#e74c3c&#x27;:&#x27;#e67e22&#x27;}&quot;&gt;${r.status.toUpperCase()}&lt;/td&gt;
    &lt;/tr&gt;`
  ).join(&#x27;&#x27;) + &#x27;&lt;/table&gt;&#x27; + imgHtml;
}

// Expose function to allow async chart update from CM after SVG→PNG conversion
window._updateImportChart = function(source, chartImage) {
  if (chartImage) importedCharts[source] = chartImage;
  const el = document.getElementById(&#x27;import-preview&#x27;);
  if (!el || !el.classList.contains(&#x27;visible&#x27;)) return;
  // Update or add image in preview
  let imgDiv = el.querySelector(&#x27;.import-chart-img&#x27;);
  if (!imgDiv) {
    imgDiv = document.createElement(&#x27;div&#x27;);
    imgDiv.className = &#x27;import-chart-img&#x27;;
    imgDiv.style.cssText = &#x27;margin-top:8px&#x27;;
    el.appendChild(imgDiv);
  }
  imgDiv.innerHTML = `&lt;div style=&quot;font-size:8px;color:var(--muted);font-family:&#x27;Space Mono&#x27;,monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px&quot;&gt;Podgląd graficzny&lt;/div&gt;
    &lt;img src=&quot;${chartImage}&quot; style=&quot;max-width:100%;border-radius:5px;border:1px solid var(--border)&quot; alt=&quot;wykres&quot;&gt;`;
  updatePreview();
};

// Listen for export data from sibling iframes (relayed by parent)
window.addEventListener(&#x27;message&#x27;, (e) =&gt; {
  if (!e.data || e.data.type !== &#x27;LED_TOOLS_EXPORT&#x27;) return;
  const payload = e.data.payload;
  // If this is a second async send (only chartImage updated, data rows same source already imported)
  if (payload &amp;&amp; payload.data &amp;&amp; payload.data.chartImage &amp;&amp; payload.source) {
    const existingRows = mrows.filter(r =&gt; r._src === payload.source);
    if (existingRows.length &gt; 0) {
      // Just update the chart image, don&#x27;t re-import rows
      importedCharts[payload.source] = payload.data.chartImage;
      if (typeof window._updateImportChart === &#x27;function&#x27;) {
        window._updateImportChart(payload.source, payload.data.chartImage);
      }
      return;
    }
  }
  applyImport(payload);
});

&lt;/script&gt;

" loading="eager"></iframe>
    </div>
    <div class="win-resize" onmousedown="startResize(event,'win4')"></div>
